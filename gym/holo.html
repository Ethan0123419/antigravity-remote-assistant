<!DOCTYPE html>
<html lang="zh-CN" data-beacon-repo="Ethan0123419/antigravity-remote-assistant" data-beacon-subpath="gym">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; background: #000; }
    .hud {
      position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between;
      align-items: center; gap: 8px; pointer-events: none; z-index: 10;
    }
    .hud-pill {
      background: rgba(11, 18, 36, 0.85); border: 1px solid #38bdf8; color: #7dd3fc;
      padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; pointer-events: auto;
    }
    .toolbar {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 10;
    }
    .tbtn {
      background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; color: #f8fafc;
      padding: 7px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    body.clean .hud, body.clean .toolbar { display: none !important; }
    body.embed .toolbar { bottom: 6px; }

<body>

  <script>'use strict';

(() => {
  const canvas = document.getElementById('holoCanvas');
  const ctx = canvas.getContext('2d');
  const connPill = document.getElementById('connPill');
  const moodPill = document.getElementById('moodPill');

  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1' || window.self !== window.top;
  if (isEmbed) document.body.classList.add('embed');

  let fourFaces = params.get('faces') !== '1';
  let mirrorFlip = true;
  let state = {
    scene: 'gym',
    lift: 'deadlift',
    lift_meta: { zh: '硬拉', emoji: '🏋️' },
    weight_kg: 100,
    plates: [{ kg: 20, color: '#2563eb', h: 0.96 }, { kg: 20, color: '#2563eb', h: 0.96 }],
    current_reps: 0,
    target_reps: 5,
    progress: 0,
    effort: 0,
    phase: 'idle',
    bubble_text: '',
    daily: { mood: 'sedentary', mood_label: '🛋️ 今日未动', aura_color: '#38bdf8', levitate: false, progress_pct: 0 },
  };

  const GW = 108, GH = 90;
  const pix = document.createElement('canvas');
  pix.width = GW; pix.height = GH;
  const pctx = pix.getContext('2d');

  const off = document.createElement('canvas');
  off.width = 324; off.height = 270;
  const g = off.getContext('2d');

  const C = {
    ink: '#1a1624',
    skinHi: '#fff0e2', skinMid: '#f7d6be', skinSh: '#daa88c', blush: '#f898a8', mole: '#442e2e',
    hairDk: '#121118', hairMid: '#22202a', hairHi: '#403c4a', hairShine: '#6c6678',
    tankDk: '#08090d', tankMid: '#12141b', tankHi: '#242834', tankTrim: '#343a4a',
    shortsDk: '#0c0d12', shortsMid: '#181a23', shortsHi: '#2c303e',
    sockW: '#f8fafc', sockSh: '#d0d8e4',
    shoeW: '#f8fafc', shoeSh: '#d4dae4', shoeRed: '#d62838', shoeRedHi: '#f65c68',
    watchBand: '#1a1c26', watchGlow: '#63b3ff',
    bottleCap: '#9333ea', bottleCapHi: '#c084fc', bottleBody: '#ceeafc', bottleWater: '#93c5fd',
    suitDk: '#08090d', suitMid: '#111319', suitHi: '#2a2e3a',
    shirtW: '#f8fafc', shirtSh: '#d6deec',
    tieDk: '#9e1624', tieMid: '#dc2638', tieHi: '#fc7680',
    deskHi: '#c4865c', deskTop: '#9e6644', deskFront: '#744630', deskDk: '#523022',
    cupW: '#f8f4ec', cupSh: '#cec6bc', coffee: '#704024',
    beltDk: '#16141c', beltMid: '#2c2834', goldHi: '#fef3a4', goldMid: '#facc15',
    steelDk: '#445068', steelMid: '#92a2ba', steelHi: '#eef4fc',
    benchPad: '#282638', benchHi: '#484462', white: '#ffffff',
    eyeDk: '#16121c', eyeWarm: '#3a2c2a',
  };

  const explicitRepo = document.documentElement.getAttribute('data-beacon-repo') || '';
  const explicitSub = (document.documentElement.getAttribute('data-beacon-subpath') || '').replace(/^\/+|\/+$/g, '');
  const isStaticShell = Boolean(explicitRepo) || location.hostname.endsWith('.github.io');
  const hashP = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const inKey = (params.get('key') || params.get('token') || hashP.get('key') || hashP.get('token') || '').trim();
  const inTunnel = (params.get('t') || hashP.get('t') || '').trim();
  if (inKey) { try { localStorage.setItem('agy_gym_token', inKey); } catch {} }
  if (inTunnel && /^https:\/\/[a-z0-9.-]+(?::\d+)?(?:\/.*)?$/i.test(inTunnel)) {
    try { localStorage.setItem('agy_gym_last_tunnel', inTunnel.replace(/\/$/, '')); } catch {}
  }
  let gymToken = '';
  try { gymToken = localStorage.getItem('agy_gym_token') || inKey || ''; } catch { gymToken = inKey; }
  let apiBase = '';
  let activeEs = null;
  let activeWs = null;
  let wsFailCount = 0;
  let wsReconnectTimer = 0;
  const apiUrl = p => (apiBase ? `${apiBase}${p}` : p);
  const wsUrl = p => {
    if (apiBase) return apiBase.replace(/^http/i, 'ws') + p;
    return `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}${p}`;
  };

  function b64uToBytes(str) {
    const pad = '='.repeat((4 - (str.length % 4)) % 4);
    const bin = atob((str + pad).replace(/-/g, '+').replace(/_/g, '/'));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function decryptBeacon(env, secret) {
    const salt = b64uToBytes(env.salt), nonce = b64uToBytes(env.nonce), ct = b64uToBytes(env.ct), expMac = b64uToBytes(env.mac);
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret.trim()), 'PBKDF2', false, ['deriveBits']);
    const derived = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: Number(env.iter) || 100000, hash: 'SHA-256' }, baseKey, 512));
    const encK = derived.slice(0, 32), macK = derived.slice(32, 64);
    const tag = new TextEncoder().encode('AGY-BEACON-V1');
    const macIn = new Uint8Array(tag.length + salt.length + nonce.length + ct.length);
    macIn.set(tag, 0); macIn.set(salt, tag.length); macIn.set(nonce, tag.length + salt.length); macIn.set(ct, tag.length + salt.length + nonce.length);
    const mk = await crypto.subtle.importKey('raw', macK, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!(await crypto.subtle.verify('HMAC', mk, expMac, macIn))) throw new Error('MAC');
    const sk = await crypto.subtle.importKey('raw', encK, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const pt = new Uint8Array(ct.length);
    for (let idx = 0; idx < Math.ceil(ct.length / 32); idx++) {
      const bi = new Uint8Array(20); bi.set(nonce, 0); new DataView(bi.buffer).setUint32(16, idx, false);
      const ks = new Uint8Array(await crypto.subtle.sign('HMAC', sk, bi));
      for (let j = idx * 32; j < Math.min((idx + 1) * 32, ct.length); j++) pt[j] = ct[j] ^ ks[j - idx * 32];
    }
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function pingBase(u, ms = 2400) {
    if (!u) return false;
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), ms);
    try { const r = await fetch(`${u.replace(/\/$/, '')}/ping?_t=${Date.now()}`, { cache: 'no-store', signal: ctrl.signal }); return r.ok; }
    catch { return false; } finally { clearTimeout(tm); }
  }
  async function resolveHoloBase(forceFresh = false) {
    if (!isStaticShell) return '';
    let cached = ''; try { cached = localStorage.getItem('agy_gym_last_tunnel') || ''; } catch {}
    if (cached && !forceFresh && await pingBase(cached, 2200)) return cached.replace(/\/$/, '');
    if (!gymToken) throw new Error('NO_KEY');
    const ts = Date.now(), rel = explicitSub ? `${explicitSub}/beacon.json` : 'beacon.json';
    const fetchJ = async (u, hdrs = {}, ghApi = false) => {
      const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 8500);
      try {
        const r = await fetch(u, { cache: 'no-store', headers: hdrs, signal: ctrl.signal });
        if (!r.ok) throw new Error('HTTP_' + r.status);
        const j = await r.json();
        return ghApi ? JSON.parse(atob(String(j.content || '').replace(/\s+/g, ''))) : j;
      } finally { clearTimeout(tm); }
    };
    const srcs = [fetchJ(`./beacon.json?_t=${ts}`)];
    if (explicitRepo && explicitRepo.includes('/')) {
      const [ow, rp] = explicitRepo.split('/');
      srcs.push(fetchJ(`https://${ow.toLowerCase()}.github.io/${rp}/${rel}?_t=${ts}`));
      srcs.push(fetchJ(`https://raw.githubusercontent.com/${explicitRepo}/gh-pages/${rel}?_t=${ts}`));
      srcs.push(fetchJ(`https://api.github.com/repos/${explicitRepo}/contents/${rel}?ref=gh-pages&_t=${ts}`, { Accept: 'application/vnd.github.v3+json' }, true));
    }
    let fallback = '';
    const tasks = srcs.map(async p => {
      const env = await p;
      const dec = await decryptBeacon(env, gymToken);
      const cand = String(dec.tunnel_url || '').replace(/\/$/, '');
      if (!cand) throw new Error('EMPTY');
      fallback = cand;
      if (await pingBase(cand, 3000)) return cand;
      throw new Error('PING');
    });
    try {
      const win = await Promise.any(tasks);
      try { localStorage.setItem('agy_gym_last_tunnel', win); } catch {}
      return win;
    } catch {
      if (fallback) { try { localStorage.setItem('agy_gym_last_tunnel', fallback); } catch {} return fallback; }
      throw new Error('BEACON_FAIL');
    }
  }

  function applyState(next) {
    if (!next || typeof next !== 'object') return;
    if (next._fast) {
      Object.assign(state, next);
      delete state._fast;
      return;
    }
    state = next;
    connPill.textContent = (activeWs && activeWs.readyState === 1)
      ? (isStaticShell ? '⚡ 永久全息 WS' : '⚡ 局域网 0延迟 WS')
      : (isStaticShell ? '● 永久全息已连' : '● 局域网实时同步');
    connPill.style.borderColor = '#4ade80';
    connPill.style.color = '#4ade80';
    const d = next.daily || {};
    moodPill.textContent = next.scene === 'office' ? '💼 黑西装办公中' : (d.mood_label || '⚡ Antigravity');
    moodPill.style.borderColor = d.aura_color || '#38bdf8';
    moodPill.style.color = d.aura_color || '#7dd3fc';
  }

  function openHoloSse() {
    if (activeEs) { try { activeEs.close(); } catch {} activeEs = null; }
    const es = new EventSource(apiUrl('/api/sync/stream?fast=1'));
    activeEs = es;
    let errCnt = 0;
    es.onmessage = ev => { errCnt = 0; try { applyState(JSON.parse(ev.data)); } catch {} };
    es.onerror = () => {
      connPill.textContent = '○ 重连中…';
      connPill.style.borderColor = '#f59e0b';
      connPill.style.color = '#fde047';
      if (isStaticShell && ++errCnt >= 2) {
        try { es.close(); } catch {}
        setTimeout(() => bootHolo(true), 2000);
      }
    };
  }
  function openHoloStream() {
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = 0; }
    if (activeWs) { try { activeWs.close(); } catch {} activeWs = null; }
    if (typeof WebSocket === 'undefined') { openHoloSse(); return; }
    let ws;
    try { ws = new WebSocket(wsUrl('/ws')); } catch { openHoloSse(); return; }
    activeWs = ws;
    ws.onopen = () => {
      wsFailCount = 0;
      if (activeEs) { try { activeEs.close(); } catch {} activeEs = null; }
    };
    ws.onmessage = ev => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg && msg._pong === undefined) applyState(msg);
      } catch {}
    };
    ws.onclose = () => {
      if (activeWs === ws) activeWs = null;
      wsFailCount += 1;
      if (!activeEs && wsFailCount >= 2) openHoloSse();
      if (isStaticShell && wsFailCount >= 3) {
        wsFailCount = 0;
        wsReconnectTimer = setTimeout(() => bootHolo(true), 1800);
      } else {
        wsReconnectTimer = setTimeout(() => openHoloStream(), Math.min(6000, 1000 * wsFailCount));
      }
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }
  async function bootHolo(forceFresh = false) {
    if (isStaticShell) {
      connPill.textContent = '⏳ 信标寻址中…';
      try { apiBase = await resolveHoloBase(forceFresh); }
      catch { connPill.textContent = '○ 电脑未在线，稍后重试'; setTimeout(() => bootHolo(true), 5000); return; }
    }
    openHoloStream();
  }

  if (isEmbed && typeof BroadcastChannel !== 'undefined') {
    const bus = new BroadcastChannel('agy-gym-bus');
    bus.onmessage = ev => applyState(ev.data);
    fetch('/api/status', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(applyState).catch(() => {});
  } else {
    bootHolo(false);
    const cleanup = () => {
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      try { activeWs?.close(); } catch {}
      try { activeEs?.close(); } catch {}
    };
    window.addEventListener('pagehide', cleanup);
    window.addEventListener('beforeunload', cleanup);
  }

  function dot(x, y, col, a = 1) {
    if (a < 1) { pctx.save(); pctx.globalAlpha = a; pctx.fillStyle = col; pctx.fillRect(Math.round(x), Math.round(y), 1, 1); pctx.restore(); }
    else { pctx.fillStyle = col; pctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
  }
  function rect(x, y, w, h, col) { pctx.fillStyle = col; pctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
  function roundedBox(x, y, w, h, fill, hi, sh) {
    const x0 = Math.round(x), y0 = Math.round(y), wi = Math.round(w), hiI = Math.round(h);
    rect(x0 - 1, y0, wi + 2, hiI, C.ink);
    rect(x0, y0 - 1, wi, hiI + 2, C.ink);
    rect(x0, y0, wi, hiI, fill);
    if (hi && wi >= 2 && hiI >= 2) rect(x0, y0, wi - 1, 1, hi);
    if (sh && wi >= 2 && hiI >= 2) rect(x0, y0 + hiI - 1, wi, 1, sh);
  }
  function ellipsePx(cx, cy, rx, ry, col, filled = true, alpha = 1) {
    pctx.save(); pctx.globalAlpha = alpha; pctx.fillStyle = col;
    const cxi = Math.round(cx), cyi = Math.round(cy), rxi = Math.max(1, Math.round(rx)), ryi = Math.max(1, Math.round(ry));
    for (let yy = cyi - ryi; yy <= cyi + ryi; yy++) {
      for (let xx = cxi - rxi; xx <= cxi + rxi; xx++) {
        const d = ((xx - cx) / Math.max(0.5, rx)) ** 2 + ((yy - cy) / Math.max(0.5, ry)) ** 2;
        if (filled ? d <= 1.0 : (d >= 0.70 && d <= 1.12)) pctx.fillRect(xx, yy, 1, 1);
      }
    }
    pctx.restore();
  }
  function capsule(x0, y0, x1, y1, radius, fill = C.skinMid, hi = C.skinHi, sh = C.skinSh) {
    const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 1.6));
    const rOut = radius + 0.95;
    pctx.fillStyle = C.ink;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, cx = x0 + (x1 - x0) * t, cy = y0 + (y1 - y0) * t;
      for (let dy = -Math.ceil(rOut); dy <= Math.ceil(rOut); dy++) {
        for (let dx = -Math.ceil(rOut); dx <= Math.ceil(rOut); dx++) {
          if (dx * dx + dy * dy <= rOut * rOut) pctx.fillRect(Math.round(cx + dx), Math.round(cy + dy), 1, 1);
        }
      }
    }
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, cx = x0 + (x1 - x0) * t, cy = y0 + (y1 - y0) * t;
      for (let dy = -Math.ceil(radius); dy <= Math.ceil(radius); dy++) {
        for (let dx = -Math.ceil(radius); dx <= Math.ceil(radius); dx++) {
          if (dx * dx + dy * dy <= radius * radius) {
            pctx.fillStyle = (dx < 0 || dy < 0) ? hi : ((dx > 0 && dy >= 0) ? sh : fill);
            pctx.fillRect(Math.round(cx + dx), Math.round(cy + dy), 1, 1);
          }
        }
      }
    }
  }
  function star(cx, cy, col, big = false) {
    cx = Math.round(cx); cy = Math.round(cy);
    dot(cx, cy, C.white);
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) dot(cx + dx, cy + dy, col);
    if (big) {
      for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2]]) dot(cx + dx, cy + dy, col, 0.65);
    }
  }

  function drawBarbell(cx, cy, plates, halfW = 27, glowCol = null) {
    cx = Math.round(cx); cy = Math.round(cy);
    if (glowCol) {
      pctx.save(); pctx.globalAlpha = 0.2; rect(cx - halfW - 1, cy - 2, (halfW + 1) * 2, 5, glowCol); pctx.restore();
    }
    rect(cx - halfW, cy - 2, halfW * 2, 4, C.ink);
    rect(cx - halfW + 1, cy - 1, halfW * 2 - 2, 2, C.steelMid);
    rect(cx - halfW + 2, cy - 1, halfW * 2 - 4, 1, C.steelHi);
    for (let kx = cx - 7; kx <= cx + 7; kx += 2) dot(kx, cy, C.steelDk);

    const list = (plates && plates.length) ? plates : [{ kg: 5, color: '#f8fafc', h: 0.65 }];
    for (const side of [-1, 1]) {
      const collarX = cx + side * 16;
      rect(collarX - 1, cy - 3, 3, 6, C.ink); rect(collarX, cy - 2, 1, 4, C.steelHi);
      list.slice(0, 5).forEach((pl, idx) => {
        let px = cx + side * (19 + idx * 3);
        if (side < 0) px -= 1;
        const ph = Math.max(4, Math.round(8.5 * (pl.h || 0.85)));
        rect(px - 1, cy - ph - 1, 4, ph * 2 + 2, C.ink);
        rect(px, cy - ph, 2, ph * 2, pl.color || '#38bdf8');
        pctx.save(); pctx.globalAlpha = 0.32; rect(px, cy - ph, 1, Math.max(2, ph), C.white); pctx.restore();
      });
    }
  }

  function drawBottle(x, y) {
    roundedBox(x - 2, y - 7, 5, 7, C.bottleBody, C.white, C.bottleWater);
    rect(x - 1, y - 4, 3, 4, C.bottleWater); dot(x - 1, y - 6, C.white);
    roundedBox(x - 1, y - 10, 3, 2, C.bottleCap, C.bottleCapHi, C.ink);
    dot(x, y - 11, C.bottleCapHi);
  }

  function drawWatch(x, y) {
    rect(Math.round(x) - 1, Math.round(y) - 2, 3, 3, C.watchBand);
    dot(Math.round(x), Math.round(y) - 1, C.watchGlow);
  }

  function drawPersonalHead(cx, cy, t, mood, effort, phase, sipping = false, annoyed = '') {
    cx = Math.round(cx); cy = Math.round(cy);
    const bounce = Math.floor(t * 3.8) % 2 === 0 ? 1 : 0;
    const curls = [
      [-7, -5, 3.2], [-5, -8, 3.6], [-1, -9.5, 3.8], [3, -9, 3.7],
      [6.5, -6.5, 3.4], [7.5, -4, 2.8], [-7.5, -3, 2.6], [0.5, -10.2 - bounce * 0.35, 3.0],
    ];
    for (const [ox, oy, r] of curls) ellipsePx(cx + ox, cy + oy, r + 1, r + 1, C.ink, true);
    ellipsePx(cx, cy - 0.5, 8.2, 8.0, C.ink, true);
    for (const s of [-1, 1]) {
      const ex = cx + s * 8;
      rect(ex - 1, cy - 1, 3, 4, C.ink); rect(ex, cy, 1, 2, C.skinMid);
      dot(ex, cy + 1, C.white); dot(ex, cy + 2, '#e2e8f0');
    }
    for (const [ox, oy, r] of curls) ellipsePx(cx + ox, cy + oy, r, r, C.hairMid, true);
    ellipsePx(cx, cy - 6, 8.2, 4.8, C.hairMid, true);

    ellipsePx(cx, cy + 0.8, 6.8, 5.7, C.skinMid, true);
    rect(cx - 5, cy - 2, 10, 2, C.skinHi);
    rect(cx - 4, cy + 5, 8, 1, C.skinSh);
    rect(cx - 5, cy + 6, 10, 1, C.ink);

      for (let i = 0; i < 4; i++) rect(cx - 10 + i * 5, deskTopY - 12 - ((Math.floor(t * 20) + i * 3) % 10), 3, 1, i % 2 === 0 ? C.goldMid : '#38bdf8');
    } else if (stretchSeq) {
      drawMug(mugDeskX, deskTopY - 1, t);
      const uSt = Math.sin(Math.min(1, Math.max(0, poseP)) * Math.PI);
      const spread = 11 + uSt * 4, raiseY = shY - 6 - uSt * 9;
      for (const s of [-1, 1]) {
        const ex = cx + s * (armXOff + 3 + uSt * 2), ey = shY - 1 - uSt * 3;
        const hx = cx + s * spread, hy = raiseY;
        capsule(cx + s * armXOff, shY + 3, ex, ey, sleeveR, C.suitMid, C.suitHi, C.suitDk);
        capsule(ex, ey, hx, hy, Math.max(1.45, sleeveR * 0.92), C.suitMid, C.suitHi, C.suitDk);
        if (s < 0) drawWatch(hx, hy + 2);
        roundedBox(hx - 1, hy - 2, 3, 3, C.skinHi);
      }
      if (uSt > 0.35) { star(cx - 17, headY - 10, '#7dd3fc', uSt > 0.7); star(cx + 17, headY - 10, C.goldMid, uSt > 0.7); }
    } else if (dumbSeq) {
      drawMug(mugDeskX, deskTopY - 1, t);
      capsule(cx - armXOff, shY + 4, cx - 10, deskTopY - 2, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      drawWatch(cx - 10, deskTopY - 2); roundedBox(cx - 11, deskTopY - 3, 3, 2, C.skinHi);
      const curlU = 0.5 - 0.5 * Math.cos(t * 7.2);
      const ex = cx + armXOff + 4.5, ey = shY + 7.5;
      const hx = cx + armXOff + 7.5 - curlU * 3, hy = (shY + 4.5) - curlU * 10.5;
      capsule(cx + armXOff, shY + 3, ex, ey, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      capsule(ex, ey, hx, hy, Math.max(1.5, sleeveR * 0.94), C.suitMid, C.suitHi, C.suitDk);
      drawOfficeDumbbell(hx + 1, hy - 1); roundedBox(hx - 1, hy - 1, 3, 3, C.skinHi);
      if (curlU > 0.65) { star(hx + 5, hy - 5, C.goldMid); dot(cx + 7, headY - 2, '#7dd3fc'); }
    } else if (thinkSeq) {
      drawMug(mugDeskX, deskTopY - 1, t);
      capsule(cx - armXOff, shY + 4, cx - 10, deskTopY - 2, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      drawWatch(cx - 10, deskTopY - 2); roundedBox(cx - 11, deskTopY - 3, 3, 2, C.skinHi);
      const ex = cx + armXOff + 2, ey = deskTopY - 3;
      capsule(cx + armXOff, shY + 4, ex, ey, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      capsule(ex, ey, cx + 3, headY + 6, Math.max(1.45, sleeveR * 0.92), C.suitMid, C.suitHi, C.suitDk);
      roundedBox(cx + 1, headY + 5, 3, 2, C.skinHi);
      drawQuestionBubble(cx + 14, headY - 8, t);
    } else if (eurekaSeq) {
      drawMug(mugDeskX, deskTopY - 1, t);
      capsule(cx - armXOff, shY + 4, cx - 10, deskTopY - 2, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      drawWatch(cx - 10, deskTopY - 2); roundedBox(cx - 11, deskTopY - 3, 3, 2, C.skinHi);
      const pumpY = -Math.abs(Math.sin(t * 11)) * 3.5;
      const hx = cx + armXOff + 5, hy = shY - 5 + pumpY;
      capsule(cx + armXOff, shY + 3, hx, hy, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      roundedBox(hx - 1, hy - 2, 4, 4, C.skinHi);
      drawPixelLightbulb(cx + 15, headY - 9, t);
      star(cx - 14, headY - 7, '#34d399', true);
    } else if (phoneSeq) {
      drawMug(mugDeskX, deskTopY - 1, t);
      capsule(cx - armXOff, shY + 4, cx - 10, deskTopY - 2, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      drawWatch(cx - 10, deskTopY - 2); roundedBox(cx - 11, deskTopY - 3, 3, 2, C.skinHi);
      const pxPh = cx + armXOff + 4, pyPh = shY + 2 + Math.sin(t * 6) * 0.7;
      capsule(cx + armXOff, shY + 4, pxPh, pyPh + 2, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      drawPixelPhone(pxPh + 1, pyPh - 2, t); roundedBox(pxPh - 1, pyPh, 3, 3, C.skinHi);
      if (Math.floor(t * 4) % 2 === 0) star(pxPh + 4, pyPh - 8, '#38bdf8');
    } else if (notesSeq) {
      drawMug(mugDeskX, deskTopY - 1, t);
      drawDeskNotebook(cx + 22, deskTopY - 1);
      capsule(cx - armXOff, shY + 4, cx - 10, deskTopY - 2, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      drawWatch(cx - 10, deskTopY - 2); roundedBox(cx - 11, deskTopY - 3, 3, 2, C.skinHi);
      const hx = cx + 21 + Math.sin(t * 14) * 2.2, hy = deskTopY - 4;
      capsule(cx + armXOff, shY + 4, hx, hy, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      roundedBox(hx - 1, hy - 1, 3, 2, C.skinHi);
      capsule(hx, hy, hx + 2, hy - 3, 0.55, C.goldMid, C.goldHi, C.ink);
    } else if (pouringLift || pouringStream) {
      const uLift = pouringLift ? Math.min(1, poseP / 0.16) : 1;
      const targetElev = 10 + ph * 21;
      const kx = kettleBaseX + (1 - uLift) * 3;
      const ky = (deskTopY - 3) - uLift * targetElev + (pouringStream ? Math.sin(t * (12 + ph * 10)) * (0.35 + ph * 0.45) : 0);

      if (coffeeSplashed) {
        const shj = Math.sin(t * 26) * 1.3;
        capsule(bcx - armXOff, shY + 4, bcx - 1, headY + 4 + shj, sleeveR, C.suitMid, C.suitHi, C.suitDk);
        drawWatch(bcx - 3, headY + 6 + shj); roundedBox(bcx - 2, headY + 3 + shj, 3, 3, C.skinHi);
        capsule(bcx + armXOff, shY + 4, bcx + 5, headY + 6 - shj * 0.7, sleeveR, C.suitMid, C.suitHi, C.suitDk);
        roundedBox(bcx + 4, headY + 5 - shj * 0.7, 3, 3, C.skinHi);
        drawAngerMark(bcx - 11, headY - 7, Math.floor(t * 12));
        rect(bcx - 1, headY - 17, 2, 4, '#ef4444'); rect(bcx - 1, headY - 12, 2, 1, C.goldHi);
        dot(bcx + 4, headY + 1, C.coffee); dot(bcx + 5, headY + 2, '#ba7a4a');
      } else if (coffeeNervous) {
        capsule(bcx - armXOff, shY + 4, bcx - 11, shY + 1, sleeveR, C.suitMid, C.suitHi, C.suitDk);
        drawWatch(bcx - 11, shY + 2); roundedBox(bcx - 12, shY - 1, 3, 3, C.skinHi);
        capsule(bcx + armXOff, shY + 4, bcx + 11, shY + 1, sleeveR, C.suitMid, C.suitHi, C.suitDk);
        roundedBox(bcx + 10, shY - 1, 3, 3, C.skinHi);
        dot(bcx - 9, headY - 7, '#7dd3fc');
      } else {
        capsule(bcx - armXOff, shY + 4, cx - 10, deskTopY - 2, sleeveR, C.suitMid, C.suitHi, C.suitDk);
        drawWatch(cx - 10, deskTopY - 2); roundedBox(cx - 11, deskTopY - 3, 3, 2, C.skinHi);
        capsule(bcx + armXOff, shY + 4, cx + 10, deskTopY - 2, sleeveR, C.suitMid, C.suitHi, C.suitDk);
        roundedBox(cx + 9, deskTopY - 3, 3, 2, C.skinHi);
      }

      drawMug(mugDeskX, deskTopY - 1, t);
      if (pouringStream) {
        const sx = Math.round(kx - 7), sy0 = Math.round(ky + 3), sy1 = Math.round(deskTopY - 5);
        for (let py = sy0; py <= sy1; py++) {
          const wob = ((py + Math.floor(t * (20 + ph * 14))) % (ph < 0.5 ? 4 : 3) === 0) ? 1 : 0;
          const swayX = ph >= 0.45 ? Math.round(Math.sin(py * 0.45 - t * 22) * (ph * 0.9)) : 0;
          const pxs = sx + swayX;
          dot(pxs, py, C.coffee);
          if (ph >= 0.25 || wob) dot(pxs + 1, py, wob ? '#9c5e36' : C.coffee);
          if (ph >= 0.72 && (py + Math.floor(t * 28)) % 2 === 0) dot(pxs - 1, py, '#d69862');
          else if ((py + Math.floor(t * 26)) % 3 === 0) dot(pxs, py, '#d69862');
        }
        if (ph < 0.28) {
          dot(mugDeskX - 1, sy1 - 1, '#d69862'); dot(mugDeskX + 1, sy1 - (Math.floor(t * 14) % 2), '#eec698');
          star(mugDeskX - 3, sy1 - 5, C.goldMid);
        } else {
          const nDrops = ph < 0.68 ? 6 : 14;
          const speedMul = 0.52 + ph * 1.20;
          const foamR = ph < 0.68 ? 2 : 4;
          for (let fx = -foamR; fx <= foamR; fx++) {
            const fyb = -1 - ((Math.abs(fx) + Math.floor(t * 24)) % (ph < 0.68 ? 2 : 4));
            dot(mugDeskX + fx, sy1 + fyb, fx % 2 === 0 ? '#eec698' : '#ba7a4a');
          }
          for (let i = 0; i < nDrops; i++) {
            const ud = ((t * (2.5 + (i % 3) * 0.55) + i * 0.16) % 1 + 1) % 1;
            const goLeft = ph >= 0.68 ? (i % 4 !== 0) : (i % 2 === 0);
            const vx = goLeft ? -(8.5 + (i % 5) * 4.2) * speedMul : (5 + (i % 4) * 2.6) * speedMul;
            const vy = -(8.5 + (i % 4) * 3.8) * speedMul;
            const grav = 20 + ph * 10;
            const dropX = Math.round(mugDeskX + vx * ud);
            const dropY = Math.round(sy1 + vy * ud + 0.5 * grav * ud * ud);
            const dcol = i % 2 === 0 ? C.coffee : (i % 3 === 1 ? '#ba7a4a' : '#f2cea6');
            dot(dropX, dropY, dcol);
            if (ph >= 0.68 && i < 8) {
              dot(dropX - 1, dropY, '#945832');
              if (i < 4) dot(dropX, dropY - 1, '#eec698');
            }
          }
          dot(mugDeskX - 5, deskTopY, C.coffee); dot(mugDeskX + 6, deskTopY, '#9c5e36');
          if (ph >= 0.68) { dot(mugDeskX - 8, deskTopY + 1, C.coffee); dot(mugDeskX - 11, deskTopY, '#9c5e36'); }
        }
      }
      if (pouringStream && ph >= 0.36) dot(kx + 4, ky - 5, Math.floor(t * 10) % 2 === 0 ? C.goldHi : '#38bdf8');
      drawCoffeeKettle(kx, ky, pouringStream);
    } else if (sipping) {
      capsule(cx - armXOff, shY + 4, cx - 12, deskTopY - 2, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      drawWatch(cx - 12, deskTopY - 2); roundedBox(cx - 13, deskTopY - 3, 3, 2, C.skinMid);
      const cupX = cx + 6, cupY = headY + 5;
      capsule(cx + armXOff, shY + 4, cupX + 3, cupY, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      roundedBox(cupX + 2, cupY - 1, 3, 2, C.skinHi);
      drawMug(cupX, cupY, t);
      if (pouringSip) { star(cx - 13, headY - 6, C.goldMid, true); star(cx + 15, headY - 4, C.goldMid); }
    } else {
      const lt = Math.floor(t * 10) % 2 === 0 ? -1 : 0, rt = Math.floor(t * 10 + 1) % 2 === 0 ? -1 : 0;
      capsule(cx - armXOff, shY + 4, cx - 10, deskTopY - 2 + lt, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      drawWatch(cx - 10, deskTopY - 2 + lt); roundedBox(cx - 11, deskTopY - 3 + lt, 3, 2, C.skinHi);
      capsule(cx + armXOff, shY + 4, cx + 10, deskTopY - 2 + rt, sleeveR, C.suitMid, C.suitHi, C.suitDk);
      roundedBox(cx + 9, deskTopY - 3 + rt, 3, 2, C.skinHi);
      drawMug(mugDeskX, deskTopY - 1, t);
    }
    if (levitate) {
      for (let i = 0; i < 3; i++) star(cx - 22 + i * 22, headY - 8 - ((Math.floor(t * 6) + i * 3) % 6), C.goldMid, i === 1);
    }
  }

  function drawTransitionFx(cx, gy, p, transTo, aura, t) {
    const cy = gy - 26;
    if (p < 0.52) {
      const u = p / 0.52, ry = gy - 2 - u * 44, rx = Math.max(6, Math.round(24 - u * 8));
      ellipsePx(cx, ry, rx, 4, aura, false, 0.85);
      ellipsePx(cx, ry + 5, Math.max(4, rx - 4), 3, '#facc15', false, 0.65);
      for (let i = 0; i < 6; i++) {
        const ang = t * 8 + i * (Math.PI * 2 / 6), rad = (1 - u) * 26 + 4;
        star(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad * 0.65, i % 2 === 0 ? C.goldMid : aura);
      }
    }
    if (p >= 0.34 && p <= 0.68) {
      const peak = Math.max(0, Math.min(1, 1 - Math.abs(p - 0.5) / 0.18));
      const pr = 6 + peak * 10;
      const puffs = [[0,0,pr],[-11,-3,pr*0.72],[11,-3,pr*0.72],[-7,7,pr*0.66],[7,7,pr*0.66],[0,-9,pr*0.68]];
      for (const [ox, oy, r] of puffs) ellipsePx(cx + ox * (0.6 + 0.4 * peak), cy + oy * (0.6 + 0.4 * peak), r + 1, r + 1, C.ink, true);
      for (const [ox, oy, r] of puffs) ellipsePx(cx + ox * (0.6 + 0.4 * peak), cy + oy * (0.6 + 0.4 * peak), r, r, '#e0f2fe', true, 0.95);
      ellipsePx(cx, cy, pr * 0.65, pr * 0.65, C.white, true);
      if (peak > 0.45) {
        if (transTo === 'office') {
          rect(cx - 5, cy - 4, 2, 7, C.tieMid); dot(cx - 5, cy - 4, C.tieHi);
          roundedBox(cx + 1, cy - 2, 5, 4, C.cupW, null, C.cupSh); rect(cx + 2, cy - 2, 3, 1, C.coffee);
        } else {
          rect(cx - 7, cy - 1, 14, 2, C.steelHi);
          rect(cx - 7, cy - 4, 3, 8, '#ef4444'); rect(cx + 4, cy - 4, 3, 8, '#ef4444');
          star(cx, cy - 6, C.goldMid, true);
        }
      }
    }
    if (p >= 0.48) {
      const u = (p - 0.48) / 0.52, sw = Math.round(10 + u * 28);
      ellipsePx(cx, gy + 1, sw, Math.max(2, Math.floor(sw / 6)), '#facc15', false, Math.max(0.08, 0.85 * (1 - u)));
      for (let i = 0; i < 6; i++) {
        const ang = i * (Math.PI * 2 / 6) + 0.4, dist = 8 + u * 26;
        if (u < 0.85) star(cx + Math.cos(ang) * dist, cy + Math.sin(ang) * dist * 0.65, i % 2 === 0 ? C.goldMid : aura, u < 0.35 && i % 2 === 0);
      }
    }
  }

  let dispProgress = 0;
  let dispEffort = 0;
  let dispLift = 'deadlift';
  let lastFrameMs = 0;

  function renderPetFrame(ms) {
    const t = ms / 1000;
    const dt = lastFrameMs ? Math.max(0.004, Math.min(0.1, (ms - lastFrameMs) / 1000)) : 0.016;
    lastFrameMs = ms;
    pctx.fillStyle = '#000000';
    pctx.fillRect(0, 0, GW, GH);

    const scene = state.scene || 'gym';
    const transP = Number(state.transition_progress || 0);
    const transFrom = state.transition_from || scene;
    const transTo = state.transition_to || scene;
    const inTrans = transP > 0 && transP < 1 && transFrom !== transTo;
    const drawScene = inTrans ? (transP < 0.5 ? transFrom : transTo) : scene;
    let transYOff = 0;
    if (inTrans) {
      if (transP < 0.5) transYOff = -4.5 * Math.pow(transP / 0.5, 1.5);
      else { const u = (transP - 0.5) / 0.5; transYOff = -Math.abs(Math.sin((1 - u) * Math.PI)) * 7.5 * (1 - u); }
    }
    const officeAction = state.office_action || 'idle';
    const officeActionP = Number(state.office_action_progress || 0);
    const pourHeight = Number(state.pour_height ?? 0.26);
    const pourActive = Boolean(state.pour_active);
    const lift = state.lift || 'deadlift';
    const tgtP = Number(state.progress || 0);
    const tgtE = Number(state.effort || 0);
    if (lift !== dispLift) {
      dispLift = lift; dispProgress = tgtP; dispEffort = tgtE;
    } else {
      const k = 1 - Math.exp(-dt * 115);
      dispProgress += (tgtP - dispProgress) * k;
      dispEffort += (tgtE - dispEffort) * k;
      if (Math.abs(tgtP - dispProgress) < 0.004) dispProgress = tgtP;
      if (Math.abs(tgtE - dispEffort) < 0.004) dispEffort = tgtE;
    }
    const p = dispProgress;
    const effort = dispEffort;
    const phase = state.phase || 'idle';
    const d = state.daily || {};
    const gr = state.growth || d.growth || {};
    const morph = resolveMorph(state);
    const mood = d.mood || 'sedentary';
    const aura = d.aura_color || '#38bdf8';
    const levitate = Boolean(d.levitate);
    const cx = 54, gy = 75;

    if (drawScene === 'office') {
      drawOfficeScene(cx, gy, t, mood, levitate, officeAction, officeActionP, transYOff, morph, pourHeight, pourActive);
    } else {
      const floatY = (levitate ? (-4 + Math.sin(t * 4.2) * 1.5) : (phase === 'set_celebrate' ? -Math.abs(Math.sin(t * 9)) * 3.5 : Math.sin(t * 3.6) * 0.45)) + transYOff;
      const px = cx + (effort > 0.52 ? Math.sin(t * 44) * effort : 0);

      const shR = lift === 'bench' ? (levitate ? 23 : 28) : (levitate ? 13 : 16);
      ellipsePx(cx - (lift === 'bench' ? 2 : 0), gy + 1, shR, 3.2, '#141026', true, 0.55);
      drawBottle(cx + (lift === 'bench' ? 35 : 29), gy + 1);
      if (levitate || phase === 'lockout' || phase === 'set_celebrate') {
        const rr = 17 + Math.floor((t * 24) % 13);
        ellipsePx(cx, gy + 1, rr, Math.max(2, Math.floor(rr / 5)), aura, false, 0.55);
      }
      const prestige = morph.prestige_tier;
      if (levitate || phase === 'lockout' || phase === 'set_celebrate' || mood === 'pumped' || prestige >= 1) {
        const n = (levitate || phase === 'set_celebrate') ? 5 : Math.min(4, 2 + prestige);
        for (let i = 0; i < n; i++) {
          const ang = t * 1.9 + i * (Math.PI * 2 / n);
          star(cx + Math.cos(ang) * 20, gy - 14 - ((t * 11 + i * 9) % 36), (levitate || prestige >= 1 || i % 2 === 0) ? C.goldMid : aura, (levitate || prestige >= 2) && i % 2 === 0);
        }
      }

      const shArmX = morph.shoulder_hw + 0.9;
      const armR = morph.arm_r, chestDef = morph.chest_def;

      if (lift === 'deadlift') {
        const barY = gy - 7 - p * 15 + floatY, hipY = gy - 14 - p * 6 + floatY, shY = hipY - 11 - p * 4;
        drawShortsSocksSneakers(px, hipY, 6.5 - p * 1.5, gy - 7 - p * 1.5 + floatY, 5.5, gy + floatY, morph);
        drawBlackTank(px, shY, hipY, effort, morph);
        drawBarbell(px, barY, state.plates, 27, p > 0.6 ? aura : null);
        const gripX = Math.max(7.5, Math.min(9.8, shArmX + 0.4));
        for (const s of [-1, 1]) {
          const sx0 = px + s * shArmX, sy0 = shY + 2.5, sx1 = px + s * gripX;
          capsule(sx0, sy0, sx1, barY, armR);
          drawLeanBicepPeak(sx0, sy0, sx1, barY, s, armR, chestDef);
          if (s < 0) drawWatch(sx1, barY - 2); else rect(sx1 - 1, barY - 3, 3, 2, C.white);
          roundedBox(sx1 - 1, barY - 1, 3, 3, C.skinHi);
        }
        drawPersonalHead(px, shY - 8, t, mood, effort, phase);
      } else if (lift === 'bench') {
        drawLyingBenchPress(cx, gy, t, p, effort, phase, mood, state.plates, floatY, morph);
      } else {
        const drop = p * 14, hipY = gy - 17 + drop + floatY, shY = hipY - 13 + p * 1.5, barY = shY + 1;
        for (const s of [-1, 1]) {
          const rx = cx + s * 19;
          rect(rx - 1, gy - 44 + floatY, 3, 45, C.ink); rect(rx, gy - 43 + floatY, 1, 43, C.steelDk);
        }
        drawBarbell(px, barY, state.plates, 27, p >= 0.78 ? '#34d399' : (levitate ? aura : null));
        drawShortsSocksSneakers(px, hipY, 6 + p * 6, gy - 8.5 + p * 3 + floatY, 7, gy + floatY, morph);
        drawBlackTank(px, shY, hipY, effort, morph);
        const sqArmR = Math.max(1.32, armR * 0.94);
        const elbOff = Math.max(11.8, shArmX + 4.4);
        for (const s of [-1, 1]) {
          const sx0 = px + s * shArmX, sy0 = shY + 2.5, ex = px + s * elbOff, ey = barY + 4;
          capsule(sx0, sy0, ex, ey, sqArmR);
          drawLeanBicepPeak(sx0, sy0, ex, ey, s, sqArmR, chestDef);
          capsule(ex, ey, ex, barY, sqArmR);
          if (s < 0) drawWatch(ex, barY + 1); else rect(ex - 1, barY - 1, 3, 2, C.white);
        }
        if (p >= 0.78) { star(px - 14, gy - 3, '#34d399'); star(px + 14, gy - 3, '#34d399'); }
        drawPersonalHead(px, shY - 8, t, mood, effort, phase);
      }
    }

    if (inTrans) {
      drawTransitionFx(cx, gy, transP, transTo, aura, t);
    }

    g.imageSmoothingEnabled = false;
    g.fillStyle = '#000000';
    g.fillRect(0, 0, 324, 270);
    g.drawImage(pix, 0, 0, 324, 270);

    const meta = state.lift_meta || { zh: '硬拉' };
    g.fillStyle = '#1a1624'; g.fillRect(22, 240, 280, 26);
    g.fillStyle = 'rgba(19,25,50,0.95)'; g.fillRect(24, 242, 276, 22);
    g.strokeStyle = aura; g.lineWidth = 2; g.strokeRect(24, 242, 276, 22);
    g.fillStyle = '#ffffff';
    g.font = 'bold 11.5px "Microsoft YaHei", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const tierSeg = gr && gr.tier_name ? ` · ${gr.tier_name}` : '';
    const activePose = (officeAction !== 'idle' && (pourActive || (officeActionP > 0 && officeActionP < 1)))
      ? officeAction : resolveOfficeIdlePose(t)[0];
    let officeLbl = '';
    if (activePose === 'pour_coffee') {
      const phPct = Math.round(pourHeight * 100);
      officeLbl = (pourHeight >= 0.68 ? `高空狂溅!(${phPct}%)` : (pourHeight >= 0.36 ? `中高拉花(${phPct}%)` : `贴杯柔注(${phPct}%)`)) + `${tierSeg} · ${d.progress_pct || 0}%`;
    } else {
      const actMap = {
        wipe_coffee: `擦拭黑西装${tierSeg} · ${d.progress_pct || 0}%`,
        shush_busy: `嘘! 专心办公${tierSeg} · ${d.progress_pct || 0}%`,
        wave_away: `别打扰! 赶进度${tierSeg} · ${d.progress_pct || 0}%`,
        dnd_sign: `勿扰模式 · 敲代码 · ${d.progress_pct || 0}%`,
        stretch_break: `工位伸懒腰${tierSeg} · ${d.progress_pct || 0}%`,
        desk_dumbbell: `偷练小哑铃${tierSeg} · ${d.progress_pct || 0}%`,
        debug_eureka: `灵感修通Bug${tierSeg} · ${d.progress_pct || 0}%`,
        eureka_cheer: `灵感爆发!${tierSeg} · ${d.progress_pct || 0}%`,
        think_chin: `托腮思考中${tierSeg} · ${d.progress_pct || 0}%`,
        check_phone: `摸鱼看手机${tierSeg} · ${d.progress_pct || 0}%`,
        jot_notes: `写笔记整理${tierSeg} · ${d.progress_pct || 0}%`,
        sip_coffee: `喝咖啡续命${tierSeg} · ${d.progress_pct || 0}%`,
        typing: `专注敲代码${tierSeg} · ${d.progress_pct || 0}%`,
      };
      officeLbl = actMap[activePose] || `黑西装办公${tierSeg} · ${d.progress_pct || 0}%`;
    }
    const label = drawScene === 'office'
      ? officeLbl
      : `${meta.zh} ${state.weight_kg}kg(${state.current_reps}/${state.target_reps})${tierSeg} · ${d.progress_pct || 0}%`;
    g.fillText(label, 162, 253);
  }

  function loop(now) {
    renderPetFrame(now);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (fourFaces) {
      const turns = [[0, -210, 0], [210, 0, Math.PI / 2], [0, 210, Math.PI], [-210, 0, -Math.PI / 2]];
      for (const [dx, dy, rot] of turns) {
        ctx.save(); ctx.translate(360 + dx, 360 + dy); ctx.rotate(rot); ctx.scale(mirrorFlip ? -1 : 1, 1);
        ctx.drawImage(off, -135, -112, 270, 225); ctx.restore();
      }
    } else {
      ctx.save(); ctx.translate(360, 360); ctx.drawImage(off, -342, -285, 684, 570); ctx.restore();
    }
    requestAnimationFrame(loop);
  }

  const btnFaces = document.getElementById('btnFaces');
  btnFaces.textContent = fourFaces ? '切单图直看' : '切四面金字塔';
  btnFaces.onclick = () => { fourFaces = !fourFaces; btnFaces.textContent = fourFaces ? '切单图直看' : '切四面金字塔'; };
  document.getElementById('btnMirror').onclick = () => { mirrorFlip = !mirrorFlip; };

  function toggleClean() {
    document.body.classList.toggle('clean');
    if (document.body.classList.contains('clean')) document.documentElement.requestFullscreen?.().catch?.(() => {});
    else if (document.fullscreenElement) document.exitFullscreen?.().catch?.(() => {});
  }
  document.getElementById('btnClean').onclick = toggleClean;
  canvas.addEventListener('dblclick', toggleClean);

  let lastTap = 0;
  canvas.addEventListener('touchend', e => {
    const n = performance.now();
    if (n - lastTap < 320) { e.preventDefault(); toggleClean(); lastTap = 0; }
    else lastTap = n;
  }, { passive: false });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
