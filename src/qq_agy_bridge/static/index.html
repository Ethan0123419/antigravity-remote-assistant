<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0D0D0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="反重力助手" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <title>反重力助手</title>
  <style>
    :root {
      /* Obsidian Velvet iOS Pro Dark Palette */
      --bg-main: #0d0d0f;
      --bg-sidebar: rgba(16, 16, 20, 0.95);
      --bg-surface: #1a1a1f;
      --bg-surface-2: #222228;
      --bg-surface-hover: #2a2a32;
      --bg-code: #08080a;
      --bg-code-hdr: #141418;
      --border-hairline: rgba(255, 255, 255, 0.065);
      --border-subtle: rgba(255, 255, 255, 0.085);
      --border-med: rgba(255, 255, 255, 0.14);
      --specular-top: inset 0 1px 0 rgba(255, 255, 255, 0.075);
      --text-pri: #f2f2f5;
      --text-sec: #a8a8b3;
      --text-muted: #72727e;
      --accent-green: #10b981;
      --danger: #ef4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --top-safe: var(--safe-top);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --app-h: 100dvh;
      --kb-open: 0;
    }

    /* Push header & drawer cleanly below iOS standalone system status-bar progressive blur scrim */
    html.ios-standalone {
      --top-safe: calc(max(env(safe-area-inset-top, 0px), 54px) + 16px);
    }
    @media all and (display-mode: standalone) {
      @supports (-webkit-touch-callout: none) {
        :root {
          --top-safe: calc(max(env(safe-area-inset-top, 0px), 54px) + 16px);
        }
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-h, 100dvh);
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg-main);
      color: var(--text-pri);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Hard opaque top status-bar shield so iOS WebKit samples pure #0D0D0F instead of washing out */
    .ios-status-shield {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--top-safe);
      background: #0d0d0f;
      z-index: 25;
      pointer-events: none;
    }

    button { font-family: inherit; }

    /* ── Crisp Razor-Sharp Solid Obsidian Top Bar (Zero Backdrop-Filter Subpixel Blur) ── */
    .topbar {
      height: calc(var(--top-safe) + 52px);
      padding: var(--top-safe) 10px 0;
      background: #0d0d0f;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
      flex-shrink: 0;
      transform: translateZ(0);
    }

    .nav-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: none;
      background: transparent;
      color: var(--text-pri);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.16s, transform 0.12s;
    }
    .nav-icon-btn:hover { background: rgba(255, 255, 255, 0.06); }
    .nav-icon-btn:active { background: rgba(255, 255, 255, 0.11); transform: scale(0.93); }

    .conn-dot {
      position: absolute;
      top: 8px;
      right: 7px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 0 2px #0d0d0f;
    }
    .conn-dot.online {
      background: var(--accent-green);
      box-shadow: 0 0 0 2px #0d0d0f, 0 0 8px rgba(16, 185, 129, 0.55);
    }
    .conn-dot.offline { background: var(--danger); }

    .center-model-btn {
      border: none;
      background: transparent;
      color: var(--text-pri);
      padding: 5px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      max-width: 68vw;
      transition: background 0.16s, transform 0.12s;
    }
    .center-model-btn:hover { background: rgba(255, 255, 255, 0.05); }
    .center-model-btn:active { background: rgba(255, 255, 255, 0.09); transform: scale(0.98); }

    .header-title-row {
      display: flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
    }
    .header-title {
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-chevron {
      color: var(--text-muted);
      font-size: 11px;
      flex-shrink: 0;
      opacity: 0.85;
    }
    .header-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      margin-top: 1px;
    }

    .right-nav-group { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }

    /* ── Slide-Over Frosted Obsidian Drawer Sidebar ── */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.64);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }
    .drawer-backdrop.show { opacity: 1; pointer-events: auto; }

    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(84vw, 322px);
      background: var(--bg-sidebar);
      backdrop-filter: blur(32px) saturate(160%);
      -webkit-backdrop-filter: blur(32px) saturate(160%);
      z-index: 46;
      transform: translateX(-103%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      padding: calc(var(--top-safe) + 12px) 12px calc(var(--safe-bot) + 12px);
      border-right: 1px solid var(--border-subtle);
      box-shadow: 18px 0 48px rgba(0, 0, 0, 0.65);
    }
    .sidebar-drawer.show { transform: translateX(0); }

    .drawer-search-row {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .drawer-search-ico {
      position: absolute;
      left: 11px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }
    .drawer-search {
      width: 100%;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--specular-top);
      border-radius: 12px;
      padding: 8.5px 12px 8.5px 34px;
      color: var(--text-pri);
      font-size: 14px;
      outline: none;
      transition: border-color 0.16s, background 0.16s;
    }
    .drawer-search::placeholder { color: var(--text-muted); }
    .drawer-search:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .drawer-menu-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-hairline);
      margin-bottom: 10px;
    }
    .drawer-menu-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-pri);
      padding: 9px 10px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      text-align: left;
      transition: background 0.14s;
    }
    .drawer-menu-item:hover, .drawer-menu-item:active { background: rgba(255, 255, 255, 0.07); }
    .drawer-menu-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--border-hairline);
      color: var(--text-pri);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Segmented Track Filter Tabs */
    .drawer-tabs {
      display: flex;
      gap: 3px;
      padding: 3px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-hairline);
      border-radius: 11px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .drawer-tabs::-webkit-scrollbar { display: none; }
    .drawer-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5.5px 8px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .drawer-tab.active {
      background: var(--bg-surface-2);
      color: var(--text-pri);
      box-shadow: var(--specular-top), 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .drawer-conv-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .drawer-conv-list::-webkit-scrollbar { width: 4px; }
    .drawer-conv-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }

    .conv-group-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 12px 10px 4px;
    }

    .conv-item {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-pri);
      padding: 9.5px 11px;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      transition: background 0.14s, border-color 0.14s;
    }
    .conv-item:hover { background: rgba(255, 255, 255, 0.045); }
    .conv-item.active {
      background: rgba(255, 255, 255, 0.075);
      border-color: var(--border-subtle);
      box-shadow: var(--specular-top);
    }

    .conv-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .conv-item-title {
      font-size: 13.8px;
      font-weight: 500;
      letter-spacing: -0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-tag {
      font-size: 10px;
      font-weight: 500;
      padding: 1.5px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.065);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--text-sec);
      flex-shrink: 0;
    }
    .conv-tag.codex { color: #a7f3d0; background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.22); }
    .conv-tag.ide { color: #dbeafe; background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.13); }
    .conv-tag.run { color: #6ee7b7; background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.35); }
    .conv-item-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
    }

    /* ── Main Chat Stream (Editorial Luxury Flow) ── */
    .chat-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .chat-wrap::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 22px;
      background: linear-gradient(to bottom, transparent, var(--bg-main));
      pointer-events: none;
      z-index: 4;
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px 26px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      -webkit-overflow-scrolling: touch;
    }
    .chat-scroll > * {
      width: 100%;
      max-width: 768px;
      margin-left: auto;
      margin-right: auto;
    }
    .chat-scroll::-webkit-scrollbar { width: 5px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 999px; }

    .load-more-bar { text-align: center; }
    .load-more-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--specular-top);
      color: var(--text-sec);
      font-size: 12.5px;
      padding: 7px 16px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* ── Bespoke Obsidian Hero Empty State + 2x2 Bento Grid ── */
    .empty-hero {
      margin-top: auto;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 6px;
    }
    .hero-logo {
      width: 56px;
      height: 56px;
      border-radius: 17px;
      background: linear-gradient(180deg, #23232a 0%, #141418 100%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 14px 36px rgba(0, 0, 0, 0.65),
        0 0 42px rgba(255, 255, 255, 0.045);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .empty-hero h2 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 6px;
      letter-spacing: -0.35px;
    }
    .hero-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 24px;
      letter-spacing: 0.1px;
    }
    .suggestion-pills {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 440px;
    }
    .suggest-pill {
      border: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, rgba(30, 30, 36, 0.85) 0%, rgba(22, 22, 27, 0.85) 100%);
      box-shadow: var(--specular-top), 0 4px 16px rgba(0, 0, 0, 0.28);
      color: var(--text-pri);
      padding: 12px 13px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      text-align: left;
      transition: transform 0.14s ease, background 0.16s, border-color 0.16s;
    }
    .suggest-pill:hover {
      border-color: var(--border-med);
      background: var(--bg-surface-2);
    }
    .suggest-pill:active {
      transform: scale(0.97);
      background: var(--bg-surface-hover);
    }
    .sug-ico {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-hairline);
      color: var(--text-sec);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .sug-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-pri);
      letter-spacing: -0.1px;
    }
    .sug-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* ── User Message: Precision Smoked Capsule ── */
    .msg-row {
      display: flex;
      flex-direction: column;
      animation: msgFadeIn 0.18s ease-out;
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { align-items: flex-end; }
    .msg-row.user .user-pill {
      max-width: min(82%, 540px);
      background: linear-gradient(180deg, #25252d 0%, #1e1e25 100%);
      border: 1px solid rgba(255, 255, 255, 0.085);
      box-shadow: var(--specular-top), 0 4px 16px rgba(0, 0, 0, 0.28);
      color: var(--text-pri);
      padding: 10.5px 16px;
      border-radius: 22px 22px 6px 22px;
      font-size: 15.5px;
      line-height: 1.54;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    /* ── Assistant Message: Borderless Editorial Typography ── */
    .msg-row.assistant { align-items: flex-start; }
    .asst-body {
      width: 100%;
      color: var(--text-pri);
      font-size: 15.5px;
      line-height: 1.72;
      letter-spacing: -0.05px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .asst-body p { margin: 0 0 12px; }
    .asst-body p:last-child { margin-bottom: 0; }
    .asst-body h1, .asst-body h2, .asst-body h3, .asst-body h4 {
      margin: 18px 0 8px;
      line-height: 1.35;
      font-weight: 600;
      letter-spacing: -0.25px;
      color: #ffffff;
    }
    .asst-body h1 { font-size: 20px; }
    .asst-body h2 { font-size: 17.5px; }
    .asst-body h3, .asst-body h4 { font-size: 16px; }
    .asst-body ul, .asst-body ol { margin: 8px 0 12px; padding-left: 21px; }
    .asst-body li { margin: 5px 0; }
    .asst-body li::marker { color: var(--text-muted); }
    .asst-body blockquote {
      margin: 12px 0;
      padding: 6px 12px 6px 14px;
      border-left: 2.5px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.025);
      border-radius: 0 10px 10px 0;
      color: var(--text-sec);
    }
    .asst-body hr { border: none; border-top: 1px solid var(--border-hairline); margin: 18px 0; }
    .asst-body a { color: #93c5fd; text-decoration: underline; text-underline-offset: 3px; }
    .asst-body strong { color: #ffffff; font-weight: 600; }

    .asst-body code {
      background: rgba(255, 255, 255, 0.085);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 1.5px 5.5px;
      border-radius: 6px;
      font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 13.2px;
      color: #f1f5f9;
    }

    /* ── Obsidian Code Card ── */
    .code-card {
      margin: 14px 0;
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-code);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
    }
    .code-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: var(--bg-code-hdr);
      border-bottom: 1px solid var(--border-hairline);
      color: var(--text-muted);
      font-family: "SF Mono", Consolas, monospace;
      font-size: 11.5px;
      letter-spacing: 0.2px;
    }
    .copy-code-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-hairline);
      color: var(--text-sec);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11.5px;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 6px;
      transition: background 0.14s, color 0.14s;
    }
    .copy-code-btn:active { color: #fff; background: rgba(255,255,255,0.14); }
    .code-card pre {
      margin: 0;
      padding: 13px 15px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .code-card pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.58;
      color: #e4e4e7;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 14px 0;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: #121216;
      -webkit-overflow-scrolling: touch;
    }
    .asst-body table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 260px; }
    .asst-body th, .asst-body td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-hairline);
      text-align: left;
    }
    .asst-body th { background: rgba(255, 255, 255, 0.045); font-weight: 600; color: #fff; white-space: nowrap; }
    .asst-body tr:last-child td { border-bottom: none; }

    /* Inline Screenshots & Attachments */
    .media-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    .chat-img {
      max-width: min(100%, 520px);
      max-height: 390px;
      border-radius: 16px;
      border: 1px solid var(--border-med);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      cursor: zoom-in;
      object-fit: contain;
      background: #070709;
      display: block;
    }
    .file-card {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--specular-top);
      border-radius: 13px;
      color: var(--text-pri);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
    }

    /* Subtle Action Row + Model Origin Badge under Assistant Turn */
    .msg-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 11.5px;
    }
    .msg-act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      padding: 4px 7px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.14s, background 0.14s;
    }
    .msg-act-btn:hover, .msg-act-btn:active {
      color: var(--text-pri);
      background: rgba(255, 255, 255, 0.06);
    }
    .msg-origin-tag {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.72;
    }

    /* Live Shimmer Thinking Status + Pulsing Dot */
    .status-shimmer {
      display: inline-block;
      font-size: 14px;
      font-weight: 500;
      background: linear-gradient(90deg, #72727e 0%, #e4e4eb 50%, #72727e 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 1.8s linear infinite;
    }
    @keyframes textShimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .gpt-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-pri);
      margin-left: 5px;
      vertical-align: middle;
      animation: pulseDot 1s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(0.72); opacity: 0.4; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    /* Floating Frosted Down Arrow Pill */
    .jump-bottom-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      z-index: 15;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(28, 28, 34, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-med);
      box-shadow: var(--specular-top), 0 8px 22px rgba(0, 0, 0, 0.55);
      color: var(--text-pri);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .jump-bottom-btn.show { display: inline-flex; }

    /* ── Pending Attachments Strip ── */
    .att-strip {
      display: none;
      gap: 8px;
      padding: 6px 14px 2px;
      overflow-x: auto;
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      flex-shrink: 0;
    }
    .att-badge {
      background: var(--bg-surface);
      border: 1px solid var(--border-med);
      box-shadow: var(--specular-top);
      color: var(--text-pri);
      padding: 5px 11px;
      border-radius: 11px;
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .att-badge button {
      background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 0;
    }

    /* ── Precision Floating Glass Bottom Composer ── */
    .composer-outer {
      padding: 6px 12px calc((1 - var(--kb-open, 0)) * var(--safe-bot) + 10px);
      background: var(--bg-main);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .composer-row {
      max-width: 768px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    .plus-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      box-shadow: var(--specular-top), 0 4px 14px rgba(0, 0, 0, 0.35);
      color: var(--text-pri);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-bottom: 2px;
      transition: background 0.16s, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.16s;
    }
    .plus-btn.open {
      background: var(--bg-surface-2);
      border-color: var(--border-med);
      transform: rotate(45deg);
    }
    .plus-btn:active { transform: scale(0.92); }

    .composer-pill {
      flex: 1;
      min-width: 0;
      background: var(--bg-surface);
      border: 1px solid rgba(255, 255, 255, 0.095);
      box-shadow: var(--specular-top), 0 8px 26px rgba(0, 0, 0, 0.45);
      border-radius: 25px;
      padding: 5px 6px 5px 16px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      transition: border-color 0.18s, background 0.18s;
    }
    .composer-pill:focus-within {
      background: #1e1e24;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .input-box {
      flex: 1;
      background: transparent;
      border: none;
      padding: 7.5px 0;
      color: var(--text-pri);
      font-size: 16px; /* Prevents iOS auto-zoom */
      line-height: 1.42;
      max-height: 136px;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    .input-box::placeholder { color: var(--text-muted); }

    .mic-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-sec);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mic-btn.recording {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #09090b;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-bottom: 1px;
      transition: opacity 0.16s, transform 0.12s, background 0.16s;
    }
    .send-btn.empty:not(.stop) {
      background: rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.42);
      box-shadow: none;
    }
    .send-btn:active { transform: scale(0.9); }

    /* Frosted Glass Plus Action Popover */
    .plus-popover {
      position: fixed;
      left: 12px;
      bottom: calc((1 - var(--kb-open, 0)) * var(--safe-bot) + 64px);
      width: 238px;
      background: rgba(26, 26, 32, 0.92);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--border-med);
      box-shadow: var(--specular-top), 0 18px 48px rgba(0, 0, 0, 0.68);
      border-radius: 20px;
      padding: 6px;
      z-index: 42;
      display: none;
      flex-direction: column;
      gap: 2px;
      animation: popScaleIn 0.16s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: bottom left;
    }
    @keyframes popScaleIn {
      from { opacity: 0; transform: scale(0.92) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .plus-popover.show { display: flex; }
    .pop-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-pri);
      padding: 10px 12px;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .pop-item:hover, .pop-item:active { background: rgba(255, 255, 255, 0.085); }
    .pop-ico {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-sec);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── Frosted Obsidian Modals & Bottom Sheets ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.center { align-items: center; padding: 16px; }
    .overlay.show { display: flex; }

    .sheet {
      width: 100%;
      max-width: 640px;
      max-height: 86dvh;
      background: rgba(22, 22, 27, 0.96);
      backdrop-filter: blur(32px) saturate(160%);
      -webkit-backdrop-filter: blur(32px) saturate(160%);
      border-top: 1px solid var(--border-med);
      box-shadow: var(--specular-top), 0 -16px 52px rgba(0, 0, 0, 0.72);
      border-radius: 26px 26px 0 0;
      padding: 14px 16px calc(var(--safe-bot) + 20px);
      display: flex;
      flex-direction: column;
      animation: sheetSlideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes sheetSlideUp {
      from { transform: translateY(24px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .overlay.center .sheet {
      border-radius: 22px;
      border: 1px solid var(--border-med);
      padding: 20px;
    }
    @media (min-width: 700px) {
      .overlay { align-items: center; padding: 16px; }
      .sheet { border-radius: 22px; border: 1px solid var(--border-med); padding: 20px; }
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 auto 14px;
    }
    .sheet-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    .sheet-hdr h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }

    .pill-btn {
      background: rgba(255, 255, 255, 0.065);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--specular-top);
      color: var(--text-pri);
      padding: 6.5px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.14s, transform 0.12s;
    }
    .pill-btn:active { opacity: 0.85; transform: scale(0.96); }

    .model-opt {
      width: 100%;
      text-align: left;
      padding: 13px 15px;
      margin-bottom: 8px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.038);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--specular-top);
      color: var(--text-pri);
      cursor: pointer;
      transition: background 0.14s, border-color 0.14s;
    }
    .model-opt:hover, .model-opt:active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-med);
    }

    .screen-frame {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: #070709;
      max-height: 62dvh;
      object-fit: contain;
    }

    .token-input {
      width: 100%;
      padding: 11.5px 14px;
      border-radius: 13px;
      border: 1px solid var(--border-subtle);
      background: #101014;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .token-input:focus { border-color: rgba(255, 255, 255, 0.26); }

    .primary-btn {
      width: 100%;
      padding: 12.5px;
      border-radius: 999px;
      border: none;
      background: #ffffff;
      color: #09090b;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Workspace & Diff Inspector */
    .insp-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .file-row {
      width: 100%;
      text-align: left;
      padding: 10.5px 13px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border-hairline);
      color: var(--text-pri);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      font-size: 13.5px;
    }
    .file-row:hover { background: rgba(255, 255, 255, 0.075); }
    .git-st { font-family: "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
    .git-st.m { background: rgba(245, 158, 11, 0.18); color: #fcd34d; }
    .git-st.a { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }
    .git-st.d { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }

    .diff-viewer {
      background: #08080a;
      border: 1px solid var(--border-subtle);
      border-radius: 13px;
      padding: 11px 13px;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 12px;
      line-height: 1.54;
      overflow-x: auto;
      white-space: pre;
      color: #d4d4d8;
    }
    .diff-add { color: #6ee7b7; background: rgba(16, 185, 129, 0.12); display: block; }
    .diff-del { color: #fca5a5; background: rgba(239, 68, 68, 0.12); display: block; }
    .diff-hunk { color: #93c5fd; font-weight: 600; display: block; }

    .toast {
      position: fixed;
      top: calc(var(--top-safe) + 58px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28, 28, 35, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-med);
      box-shadow: var(--specular-top), 0 10px 30px rgba(0, 0, 0, 0.55);
      color: var(--text-pri);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      z-index: 90;
      display: none;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<script>
(() => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      try { reg.update(); } catch (_) {}
    }).catch(() => {});
  }

  const $ = (id) => document.getElementById(id);
  const chatScroll = $('chatScroll');
  const msgInput = $('msgInput');
  const sendBtn = $('sendBtn');
  const connDot = $('connDot');
  const subInfo = $('subInfo');
  const jumpBottomBtn = $('jumpBottomBtn');
  const sidebarDrawer = $('sidebarDrawer');
  const drawerBackdrop = $('drawerBackdrop');
  const plusPopover = $('plusPopover');

  // Detect static permanent iOS App shell (`https://<owner>.github.io/<repo>/`) vs direct local/tunnel server
  const explicitBeaconRepo = document.documentElement.getAttribute('data-beacon-repo') || '';
  const ghParts = location.hostname.endsWith('.github.io')
    ? [location.hostname.replace(/\.github\.io$/i, ''), (location.pathname.split('/').filter(Boolean)[0] || '')]
    : ['', ''];
  const beaconRepo = explicitBeaconRepo || (ghParts[0] && ghParts[1] ? `${ghParts[0]}/${ghParts[1]}` : '');
  const isStaticShell = Boolean(beaconRepo) || location.hostname.endsWith('.github.io');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = Boolean(window.navigator.standalone) || window.matchMedia('(display-mode: standalone)').matches;
  if (isIOS && isStandalone) {
    document.documentElement.classList.add('ios-standalone');
  }

  // Extract ?key= / ?token= / #key= from QR scan or Home Screen Web Clip URL
  const urlParams = new URLSearchParams(location.search);
  const hashParams = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const incomingToken = (
    urlParams.get('key') ||
    urlParams.get('token') ||
    hashParams.get('key') ||
    hashParams.get('token') ||
    ''
  ).trim();

  if (incomingToken) {
    try { localStorage.setItem('agy_pwa_token', incomingToken); } catch (_) {}
    if (isStaticShell && isIOS && !isStandalone) {
      // Preserve `?key=...` query param in Mobile Safari so iOS SpringBoard saves `?key=...` into the Home Screen Web Clip!
      const cleanPath = location.pathname.endsWith('/') ? location.pathname : `${location.pathname}/`;
      history.replaceState({}, '', `${cleanPath}?key=${encodeURIComponent(incomingToken)}`);
    } else {
      history.replaceState({}, '', location.pathname);
    }
  }

  let token = '';
  try { token = localStorage.getItem('agy_pwa_token') || incomingToken || ''; } catch (_) { token = incomingToken; }
  let apiBase = '';
  let connectingBeacon = false;

  if (isStaticShell && isIOS && !isStandalone) {
    try {
      if (!sessionStorage.getItem('hide_ios_banner')) {
        $('iosInstallBanner').style.display = 'flex';
      }
    } catch (_) {
      $('iosInstallBanner').style.display = 'flex';
    }
    $('closeIosBannerBtn').onclick = () => {
      $('iosInstallBanner').style.display = 'none';
      try { sessionStorage.setItem('hide_ios_banner', '1'); } catch (_) {}
    };
  }

  function syncManifestToken() {
    // Never inject `<link rel="manifest">` inside iOS Safari on static shell so "Add to Home Screen" preserves `?key=...`!
    if (isStaticShell && isIOS) return;
    let link = $('manifestLink');
    if (!link) {
      link = document.createElement('link');
      link.id = 'manifestLink';
      link.rel = 'manifest';
      document.head.appendChild(link);
    }
    if (isStaticShell) {
      link.href = './manifest.json';
    } else {
      link.href = token ? `/manifest.json?token=${encodeURIComponent(token)}` : '/manifest.json';
    }
  }
  syncManifestToken();

  try {
    const savedDraft = localStorage.getItem('agy_pwa_draft');
    if (savedDraft) msgInput.value = savedDraft;
  } catch (_) {}

  // Mobile Virtual Keyboard Viewport Adaptation
  function updateVisualViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    const h = Math.round(vv.height);
    const kbOpen = (window.innerHeight - h) > 110 ? 1 : 0;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    document.documentElement.style.setProperty('--kb-open', String(kbOpen));
    if (window.scrollY !== 0) window.scrollTo(0, 0);
    if (kbOpen) scrollToBottom(false);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateVisualViewport);
    window.visualViewport.addEventListener('scroll', updateVisualViewport);
    updateVisualViewport();
  }
  msgInput.addEventListener('blur', () => {
    setTimeout(() => {
      if (window.scrollY !== 0) window.scrollTo(0, 0);
      updateVisualViewport();
    }, 80);
  });

  let ws = null;
  let reconnectTimer = null;
  let reconnectAttempt = 0;
  let pongWatchdog = null;
  let connectWatchdog = null;
  let isStreaming = false;
  let activeStreamMsgId = '';
  let liveScreenOn = false;
  let pendingAttachments = [];
  let pingTimer = null;
  let lastRttMs = null;
  let optimisticWaitRowId = null;
  let activeSlot = '';
  let activeConvId = '';
  let activeConvStore = '';
  let currentModelLabel = '';
  let hasMoreHistory = false;
  let totalConvMessages = 0;
  let allConvItems = [];
  let convFilter = 'all';
  let convQuery = '';

  let wsTab = 'git';
  let currentRelDir = '';
  let latestWsData = null;

  const streamBuffers = new Map();
  const rawMessageTexts = new Map();
  const renderedIds = new Set();

  function showToast(text, ms = 2400) {
    const el = $('toast');
    el.textContent = text;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, ms);
  }

  function setPlusOpen(open) {
    plusPopover.classList.toggle('show', Boolean(open));
    $('plusBtn').classList.toggle('open', Boolean(open));
  }

  function openDrawer() {
    setPlusOpen(false);
    sidebarDrawer.classList.add('show');
    drawerBackdrop.classList.add('show');
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'list_conversations' }));
    }
  }
  function closeDrawer() {
    sidebarDrawer.classList.remove('show');
    drawerBackdrop.classList.remove('show');
  }

  // Edge swipe gesture to open/close left sidebar drawer (like native ChatGPT iOS/Android)
  let touchStartX = 0;
  let touchStartY = 0;
  document.addEventListener('touchstart', (e) => {
    if (!e.touches || e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!e.changedTouches || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (dy > 60) return;
    if (!sidebarDrawer.classList.contains('show') && touchStartX < 28 && dx > 65) {
      openDrawer();
    } else if (sidebarDrawer.classList.contains('show') && dx < -65) {
      closeDrawer();
    }
  }, { passive: true });

  async function copyTextSafe(text, btnEl, okLabel = '已复制') {
    const orig = btnEl ? btnEl.textContent : '';
    let copied = false;
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (_) {}
    }
    if (!copied) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        copied = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (_) {}
    }
    if (copied && btnEl) {
      btnEl.textContent = okLabel;
      setTimeout(() => { btnEl.textContent = orig; }, 1600);
    } else if (!copied) {
      showToast('复制失败，请长按文本复制');
    }
  }

  function mediaUrl(mediaId) {
    const base = `${apiBase}/dl/${encodeURIComponent(mediaId)}`;
    return token ? `${base}?token=${encodeURIComponent(token)}` : base;
  }

  function shortModelName(m) {
    if (!m) return 'Sonnet 5.5';
    if (m.includes('电脑端')) return m;
    if (m.includes('sonnet') && m.includes('low')) return 'Sonnet 极速';
    if (m.includes('sonnet')) return 'Sonnet 5.5';
    if (m.includes('opus')) return 'Opus 5.5';
    if (m.includes('gemini-4')) return 'Gemini 4';
    if (m.includes('flash')) return 'Flash';
    return m.split('-').slice(0, 2).join(' ');
  }

  function refreshHeaderSubtitle() {
    const wsName = subInfo.dataset.wsName || '';
    const mShort = shortModelName(currentModelLabel);
    const storeTag = activeConvStore === 'ide' ? 'Antigravity 电脑端 · ' : (activeConvStore === 'codex' ? 'Codex 电脑端 · ' : '');
    const rttTag = lastRttMs ? ` · ${lastRttMs}ms` : '';
    subInfo.textContent = `${storeTag}${mShort}${wsName ? ' · ' + wsName : ''}${rttTag}`;
    $('syncPcBtn').style.display = (activeConvStore === 'ide' || activeConvStore === 'codex') ? 'inline-flex' : 'none';
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatInlineMarkdown(escapedLine) {
    const codeSlots = [];
    let s = escapedLine.replace(/`([^`\n]+)`/g, (_, code) => {
      const idx = codeSlots.push(`<code>${code}</code>`) - 1;
      return `\x00C${idx}\x00`;
    });
    // Markdown images pointing to http/https or /dl/
    s = s.replace(/!\[([^\]]*)\]\(((?:https?:\/\/|\/dl\/)[^\s)]+)\)/g, (_, alt, url) => {
      const idx = codeSlots.push(`<img class="chat-img" src="${url}" alt="${alt}" />`) - 1;
      return `\x00C${idx}\x00`;
    });
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
      const idx = codeSlots.push(`<a href="${url}" target="_blank" rel="noopener">${label}</a>`) - 1;
      return `\x00C${idx}\x00`;
    });
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\x00C(\d+)\x00/g, (_, idx) => codeSlots[Number(idx)] || '');
    return s;
  }

  function renderMarkdownBlocks(textBlock) {
    const lines = textBlock.split('\n');
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const loopStart = i;
      const rawLine = lines[i];
      const trimmed = rawLine.trim();
      if (!trimmed) { i++; continue; }

      if (/^(-{3,}|\*{3,})$/.test(trimmed)) {
        out.push('<hr/>');
        i++;
        continue;
      }

      const hm = trimmed.match(/^(#{1,4})\s+(.+)$/);
      if (hm) {
        const lvl = hm[1].length;
        out.push(`<h${lvl}>${formatInlineMarkdown(escapeHtml(hm[2]))}</h${lvl}>`);
        i++;
        continue;
      }

      if (trimmed.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i + 1])) {
        const parseCells = (rowStr) => rowStr.trim().replace(/^\||\|$/g, '').split('|').map((c) => formatInlineMarkdown(escapeHtml(c.trim())));
        const headers = parseCells(rawLine);
        i += 2;
        const bodyRows = [];
        while (i < lines.length && lines[i].trim().includes('|')) {
          bodyRows.push(parseCells(lines[i]));
          i++;
        }
        const thHtml = headers.map((h) => `<th>${h}</th>`).join('');
        const tbHtml = bodyRows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
        out.push(`<div class="table-wrap"><table><thead><tr>${thHtml}</tr></thead><tbody>${tbHtml}</tbody></table></div>`);
        continue;
      }

      if (/^\s*(?:>|&gt;)/.test(rawLine)) {
        const qLines = [];
        while (i < lines.length && /^\s*(?:>|&gt;)/.test(lines[i])) {
          qLines.push(formatInlineMarkdown(escapeHtml(lines[i].replace(/^\s*(?:>|&gt;)\s?/, ''))));
          i++;
        }
        if (i === loopStart) i++;
        out.push(`<blockquote>${qLines.join('<br/>')}</blockquote>`);
        continue;
      }

      if (/^\s*[-*•]\s+/.test(rawLine)) {
        const items = [];
        while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
          items.push(`<li>${formatInlineMarkdown(escapeHtml(lines[i].replace(/^\s*[-*•]\s+/, '')))}</li>`);
          i++;
        }
        out.push(`<ul>${items.join('')}</ul>`);
        continue;
      }

      if (/^\s*\d+\.\s+/.test(rawLine)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          items.push(`<li>${formatInlineMarkdown(escapeHtml(lines[i].replace(/^\s*\d+\.\s+/, '')))}</li>`);
          i++;
        }
        out.push(`<ol>${items.join('')}</ol>`);
        continue;
      }

      const pLines = [];
      while (
        i < lines.length &&
        lines[i].trim() &&
        !/^(#{1,4}\s+|-{3,}$|\*{3,}$|\s*[-*•]\s+|\s*\d+\.\s+|\s*(?:>|&gt;))/.test(lines[i])
      ) {
        pLines.push(formatInlineMarkdown(escapeHtml(lines[i])));
        i++;
      }
      if (pLines.length) out.push(`<p>${pLines.join('<br/>')}</p>`);
      else if (i === loopStart) i++;
    }
    return out.join('');
  }

  function renderRichText(raw) {
    if (!raw) return '';
    const parts = String(raw).split(/(```[\s\S]*?```)/g);
    return parts.map((part) => {
      if (part.startsWith('```') && part.endsWith('```')) {
        const lines = part.slice(3, -3).split('\n');
        let lang = 'code';
        if (lines.length > 1 && /^[a-zA-Z0-9_+-]+$/.test(lines[0].trim())) {
          lang = lines.shift().trim();
        } else if (lines.length > 1 && !lines[0].trim()) {

        const code = escapeHtml(lines.join('\n').trim());
        return `<div class="code-card"><div class="code-hdr"><span>${escapeHtml(lang)}</span><button type="button" class="copy-code-btn">复制代码</button></div><pre><code>${code}</code></pre></div>`;
      }
      return renderMarkdownBlocks(part);
    }).join('');
  }

  function b64uToBytes(str) {
    const pad = '='.repeat((4 - (str.length % 4)) % 4);
    const b64 = (str + pad).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decryptBeaconEnvelope(env, secretToken) {
    if (!env || Number(env.v) !== 1 || !window.crypto || !window.crypto.subtle) {
      throw new Error('BEACON_UNSUPPORTED');
    }
    const salt = b64uToBytes(env.salt);
    const nonce = b64uToBytes(env.nonce);
    const ct = b64uToBytes(env.ct);
    const expectedMac = b64uToBytes(env.mac);
    const iters = Number(env.iter) || 100000;

    const baseKey = await crypto.subtle.importKey(
      'raw',
      new TextEncoder().encode(secretToken.trim()),
      'PBKDF2',
      false,
      ['deriveBits']
    );
    const derived = new Uint8Array(
      await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iters, hash: 'SHA-256' }, baseKey, 512)
    );
    const encKeyBytes = derived.slice(0, 32);
    const macKeyBytes = derived.slice(32, 64);

    const tagPrefix = new TextEncoder().encode('AGY-BEACON-V1');
    const macInput = new Uint8Array(tagPrefix.length + salt.length + nonce.length + ct.length);
    macInput.set(tagPrefix, 0);
    macInput.set(salt, tagPrefix.length);
    macInput.set(nonce, tagPrefix.length + salt.length);
    macInput.set(ct, tagPrefix.length + salt.length + nonce.length);

    const macKey = await crypto.subtle.importKey(
      'raw',
      macKeyBytes,
      { name: 'HMAC', hash: 'SHA-256' },
      false,
      ['verify']
    );
    const valid = await crypto.subtle.verify('HMAC', macKey, expectedMac, macInput);
    if (!valid) throw new Error('BEACON_MAC_MISMATCH');

    const streamKey = await crypto.subtle.importKey(
      'raw',
      encKeyBytes,
      { name: 'HMAC', hash: 'SHA-256' },
      false,
      ['sign']
    );
    const pt = new Uint8Array(ct.length);
    const blocks = Math.ceil(ct.length / 32);
    for (let idx = 0; idx < blocks; idx++) {
      const blkIn = new Uint8Array(20);
      blkIn.set(nonce, 0);
      new DataView(blkIn.buffer).setUint32(16, idx, false);
      const ks = new Uint8Array(await crypto.subtle.sign('HMAC', streamKey, blkIn));
      const start = idx * 32;
      const end = Math.min(start + 32, ct.length);
      for (let j = start; j < end; j++) pt[j] = ct[j] ^ ks[j - start];
    }
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function probePing(baseUrl, timeoutMs = 1700) {
    if (!baseUrl) return false;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(`${baseUrl.replace(/\/$/, '')}/ping?_t=${Date.now()}`, {
        cache: 'no-store',
        signal: ctrl.signal,
      });
      return res.ok;
    } catch (_) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchJsonWithTimeout(url, timeoutMs = 3500, headers = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(url, { cache: 'no-store', headers, signal: ctrl.signal });
      if (!r.ok) throw new Error(`HTTP_${r.status}`);
      return await r.json();
    } finally {
      clearTimeout(timer);
    }
  }

  async function resolveRemoteTunnelUrl(forceFresh = false) {
    let cached = '';
    try { cached = localStorage.getItem('agy_last_tunnel') || ''; } catch (_) {}
    if (cached && !forceFresh) {
      if (await probePing(cached, 1600)) return cached.replace(/\/$/, '');
    }

    // 1. Primary fast path: explicit absolute GitHub Pages `beacon.json` (100ms, never blocked in CN, immune to missing trailing slash!)
    const pagesUrls = [];
    if (beaconRepo && beaconRepo.includes('/')) {
      const [owner, repo] = beaconRepo.split('/');
      pagesUrls.push(`https://${owner.toLowerCase()}.github.io/${repo}/beacon.json?_t=${Date.now()}`);
    }
    pagesUrls.push(`./beacon.json?_t=${Date.now()}`);

    let fallbackTunnel = '';
    let sawMacMismatch = false;
    for (const pu of pagesUrls) {
      try {
        const env = await fetchJsonWithTimeout(pu, 3500);
        if (env && env.ct) {
          const dec = await decryptBeaconEnvelope(env, token);
          const cand = String(dec.tunnel_url || '').replace(/\/$/, '');
          if (cand) {
            fallbackTunnel = cand;
            if (await probePing(cand, 2200)) {
              try { localStorage.setItem('agy_last_tunnel', cand); } catch (_) {}
              return cand;
            }
          }
          break;
        }
      } catch (e) {
        if (String((e && e.message) || '') === 'BEACON_MAC_MISMATCH') sawMacMismatch = true;
      }
    }

    // 2. Secondary race (only if PC rebooted <15s ago or token was rotated while GitHub Pages CDN is still updating): strict 3.5s timeout!
    if (beaconRepo) {
      const tasks = [
        fetchJsonWithTimeout(
          `https://api.github.com/repos/${beaconRepo}/contents/beacon.json?ref=gh-pages&_t=${Date.now()}`,
          3500,
          { Accept: 'application/vnd.github.v3+json' }
        ).then((meta) => JSON.parse(atob(String(meta.content || '').replace(/\s+/g, '')))),
        fetchJsonWithTimeout(
          `https://raw.githubusercontent.com/${beaconRepo}/gh-pages/beacon.json?_t=${Date.now()}`,
          3500
        ),
      ];
      for (const p of tasks) {
        try {
          const env2 = await p;
          if (env2 && env2.ct) {
            const dec2 = await decryptBeaconEnvelope(env2, token);
            const cand2 = String(dec2.tunnel_url || '').replace(/\/$/, '');
            if (cand2 && (await probePing(cand2, 2200))) {
              try { localStorage.setItem('agy_last_tunnel', cand2); } catch (_) {}
              return cand2;
            }
            if (cand2 && !fallbackTunnel) fallbackTunnel = cand2;
          }
        } catch (e) {
          if (String((e && e.message) || '') === 'BEACON_MAC_MISMATCH') sawMacMismatch = true;
        }
      }
    }

    if (fallbackTunnel) {
      try { localStorage.setItem('agy_last_tunnel', fallbackTunnel); } catch (_) {}
      return fallbackTunnel;
    }
    if (sawMacMismatch) throw new Error('BEACON_MAC_MISMATCH');
    throw new Error('BEACON_NOT_FOUND');
  }

  function openSocketWithBase(baseOrigin) {
    clearConnectWatchdog();
    if (ws) {
      const stale = ws;
      ws = null;
      try { stale.close(); } catch (_) {}
    }
    apiBase = baseOrigin ? baseOrigin.replace(/\/$/, '') : '';
    const qs = token ? `?token=${encodeURIComponent(token)}` : '';
    let wsUrl = '';
    if (apiBase) {
      wsUrl = `${apiBase.replace(/^http/i, 'ws')}/ws${qs}`;
    } else {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      wsUrl = `${proto}//${location.host}/ws${qs}`;
    }
    const sock = new WebSocket(wsUrl);
    ws = sock;
    bindSocketEvents(sock);
    connectWatchdog = setTimeout(() => {
      if (ws === sock && sock.readyState === 0) {
        ws = null;
        try { sock.close(); } catch (_) {}
        const delay = Math.min(3500, 450 * Math.pow(1.45, reconnectAttempt++));
        subInfo.textContent = '握手超时，正在切换重连...';
        reconnectTimer = setTimeout(connect, delay);
      }
    }, 8000);
  }

  function connect() {
    clearTimeout(reconnectTimer);
    clearPongWatchdog();
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
    if (connectingBeacon) return;

    if (!isStaticShell) {
      openSocketWithBase('');
      return;
    }

    if (!token) {
      subInfo.textContent = '请扫码配对或输入访问密钥';
      $('authModal').classList.add('show');
      return;
    }

    connectingBeacon = true;
    subInfo.textContent = '正在自动寻址连接电脑...';
    resolveRemoteTunnelUrl(reconnectAttempt > 0)
      .then((tunnelOrigin) => {
        connectingBeacon = false;
        openSocketWithBase(tunnelOrigin);
      })
      .catch((err) => {
        connectingBeacon = false;
        const msg = String((err && err.message) || err || '');
        if (msg === 'BEACON_MAC_MISMATCH') {
          subInfo.textContent = '访问密钥不匹配，请重新验证';
          try { localStorage.removeItem('agy_pwa_token'); } catch (_) {}
          token = '';
          $('authModal').classList.add('show');
          return;
        }
        const delay = Math.min(4500, 900 * Math.pow(1.4, reconnectAttempt++));
        subInfo.textContent = '等待电脑端上线，自动重试中...';
        reconnectTimer = setTimeout(connect, delay);
      });
  }

  function bindSocketEvents(wsInstance) {
    wsInstance.onopen = () => {
      if (ws !== wsInstance) return;
      clearConnectWatchdog();
      reconnectAttempt = 0;
      connDot.className = 'conn-dot online';
      $('authModal').classList.remove('show');
      clearInterval(pingTimer);
      const sendPing = () => {
        if (ws === wsInstance && wsInstance.readyState === 1) {
          wsInstance.send(JSON.stringify({ type: 'ping', ts: Date.now() }));
        }
      };
      sendPing();
      pingTimer = setInterval(sendPing, 8000);
      wsInstance.send(JSON.stringify({ type: 'list_conversations' }));
      if (liveScreenOn && $('deskModal').classList.contains('show')) {
        wsInstance.send(JSON.stringify({ type: 'live_screen', enable: true, interval_ms: 1600 }));
      }
    };

    wsInstance.onmessage = (ev) => {
      if (ws !== wsInstance) return;
      clearPongWatchdog();
      const data = JSON.parse(ev.data);
      if (data.type === 'pong' && data.ts) {
        lastRttMs = Math.max(1, Date.now() - Number(data.ts));
        refreshHeaderSubtitle();
        return;
      }
      if (data.type === 'hello') {
        activeSlot = data.slot || '';
        currentModelLabel = data.model || '';
        activeConvId = data.active_conversation_id || '';
        activeConvStore = data.active_store || '';
        if (data.active_title) $('headerTitle').textContent = data.active_title;
        subInfo.dataset.wsName = (data.workspace || '').split(/[\\/]/).pop() || '';
        refreshHeaderSubtitle();
        setStreamingState(Boolean(data.busy));
        if (Array.isArray(data.history) && data.history.length) {
          renderHistoryBatch(data.history, false);
        }
        if (data.inflight) {
          restoreInflightStream(data.inflight);
        }
      } else if (data.type === 'meta_update') {
        if (data.slot) activeSlot = data.slot;
        if (data.model) currentModelLabel = data.model;
        if (typeof data.active_conversation_id === 'string') activeConvId = data.active_conversation_id;
        if (typeof data.active_store === 'string') activeConvStore = data.active_store;
        if (data.active_title) $('headerTitle').textContent = data.active_title;
        if (data.workspace) subInfo.dataset.wsName = data.workspace.split(/[\\/]/).pop() || '';
        if (typeof data.busy === 'boolean') setStreamingState(data.busy);
        refreshHeaderSubtitle();
      } else if (data.type === 'conversations_list') {
        if (typeof data.active_id === 'string') activeConvId = data.active_id;
        allConvItems = data.items || [];
        updateConvCounts();
        renderConvList();
        renderWorkspaceChips(data.workspaces || [], data.current_workspace || '');
      } else if (data.type === 'conversation_loaded') {
        activeSlot = data.slot || activeSlot;
        activeConvId = data.conversation_id || '';
        activeConvStore = data.store || '';
        hasMoreHistory = Boolean(data.has_more);
        totalConvMessages = Number(data.total_messages || 0);
        $('headerTitle').textContent = data.title || '反重力助手';
        if (data.workspace) subInfo.dataset.wsName = data.workspace.split(/[\\/]/).pop() || '';
        refreshHeaderSubtitle();
        setStreamingState(Boolean(data.busy));
        const hist = data.history || [];
        if (!hist.length && !data.inflight) {
          chatScroll.innerHTML = `<div class="empty-hero"><div class="hero-logo">✦</div><h2>${escapeHtml(data.title || '空会话')}</h2></div>`;
          renderedIds.clear();
          streamBuffers.clear();
        } else {
          renderHistoryBatch(hist, Boolean(data.silent));
        }
        if (data.inflight) {
          restoreInflightStream(data.inflight);
        }
        if (!data.silent) {
          closeDrawer();
        }
      } else if (data.type === 'clear_history') {
        clearOptimisticPlaceholder();
        setStreamingState(false);
        hasMoreHistory = false;
        totalConvMessages = 0;
        activeConvId = '';
        activeConvStore = '';
        $('headerTitle').textContent = '反重力助手';
        refreshHeaderSubtitle();
        chatScroll.innerHTML = buildHeroHtml();
        renderedIds.clear();
        streamBuffers.clear();
        rawMessageTexts.clear();
        closeDrawer();
      } else if (data.type === 'workspace_state') {
        latestWsData = data;
        renderWsInspector();
      } else if (data.type === 'workspace_diff') {
        renderDiffDetail(data);
      } else if (data.type === 'workspace_file') {
        renderFilePreview(data);
      } else if (data.type === 'user_msg') {
        if (data.slot && activeSlot && data.slot !== activeSlot) return;
        appendUserBubble(data.item);
      } else if (data.type === 'stream_start') {
        if (data.slot && activeSlot && data.slot !== activeSlot) return;
        clearOptimisticPlaceholder();
        setStreamingState(true);
        activeStreamMsgId = data.msg_id || '';
        streamBuffers.set(data.msg_id, '');
        ensureAssistantRow(data.msg_id);
        scrollToBottom(true);
      } else if (data.type === 'stream_status') {
        if (data.slot && activeSlot && data.slot !== activeSlot) return;
        ensureAssistantRow(data.msg_id);
        const cur = streamBuffers.get(data.msg_id) || '';
        if (!cur) {
          const bub = document.getElementById('bub-' + data.msg_id);
          if (bub) bub.innerHTML = `<span class="status-shimmer">${escapeHtml(data.status)}</span><span class="gpt-dot"></span>`;
        }
      } else if (data.type === 'stream_reset') {
        if (data.slot && activeSlot && data.slot !== activeSlot) return;
        streamBuffers.set(data.msg_id, '');
        const bub = document.getElementById('bub-' + data.msg_id);
        if (bub) bub.innerHTML = '<span class="gpt-dot"></span>';
      } else if (data.type === 'stream_delta') {
        if (data.slot && activeSlot && data.slot !== activeSlot) return;
        clearOptimisticPlaceholder();
        const cur = (streamBuffers.get(data.msg_id) || '') + data.delta;
        streamBuffers.set(data.msg_id, cur);
        rawMessageTexts.set(data.msg_id, cur);
        ensureAssistantRow(data.msg_id);
        const bub = document.getElementById('bub-' + data.msg_id);
        if (bub) bub.innerHTML = renderRichText(cur) + '<span class="gpt-dot"></span>';
        scrollToBottom();
      } else if (data.type === 'stream_end') {
        if (data.slot && activeSlot && data.slot !== activeSlot) return;
        clearOptimisticPlaceholder();
        setStreamingState(false);
        streamBuffers.delete(data.item.id);
        finalizeAssistantBubble(data.item);
        notifyReplyFinished(data.item.text || '');
      } else if (data.type === 'desktop_frame') {
        const sep = mediaUrl(data.media_id).includes('?') ? '&' : '?';
        const u = mediaUrl(data.media_id) + sep + '_t=' + data.ts;
        $('deskImg').src = u;
        $('deskTs').textContent = '更新于 ' + new Date(data.ts).toLocaleTimeString() + ' · 点击画面可全屏缩放';
      } else if (data.type === 'upload_done') {
        pendingAttachments.push(data);
        renderPendingAttachments();
        refreshSendBtnVisual();
        showToast(`已添加：${data.name}`);
      } else if (data.type === 'toast') {
        showToast(data.text);
      }
    };

    wsInstance.onclose = (ev) => {
      if (ws !== wsInstance) return;
      clearConnectWatchdog();
      clearInterval(pingTimer);
      clearPongWatchdog();
      ws = null;
      connDot.className = 'conn-dot offline';
      setStreamingState(false);
      if (ev.code === 4001 || ev.code === 4003) {
        subInfo.textContent = '需要验证访问密钥';
        try { localStorage.removeItem('agy_pwa_token'); } catch (_) {}
        token = '';
        syncManifestToken();
        $('authModal').classList.add('show');
        return;
      }
      const delay = Math.min(3500, 450 * Math.pow(1.45, reconnectAttempt++));
      subInfo.textContent = '正在重连...';
      reconnectTimer = setTimeout(connect, delay);
    };
  }

  function handleAppWakeup() {
    if (document.visibilityState === 'hidden') return;
    if ($('authModal').classList.contains('show')) return;
    if (!ws || ws.readyState === 2 || ws.readyState === 3) {
      reconnectAttempt = 0;
      connect();
      return;
    }
    if (ws.readyState === 1) {
      clearPongWatchdog();
      try {
        ws.send(JSON.stringify({ type: 'ping', ts: Date.now() }));
        // Never refresh/overwrite DOM while streaming!
        if (!isStreaming && (activeConvStore === 'ide' || activeConvStore === 'codex') && activeConvId) {
          ws.send(JSON.stringify({
            type: 'refresh_conversation',
            conversation_id: activeConvId,
            store: activeConvStore,
          }));
        }
      } catch (_) {}
      pongWatchdog = setTimeout(() => {
        if (ws) {
          try { ws.close(); } catch (_) {}
          ws = null;
        }
        reconnectAttempt = 0;
        connect();
      }, 2200);
    }
  }
  document.addEventListener('visibilitychange', handleAppWakeup);
  window.addEventListener('pageshow', handleAppWakeup);
  window.addEventListener('online', handleAppWakeup);
  window.addEventListener('focus', handleAppWakeup);

  function renderPendingAttachments() {
    const strip = $('attStrip');
    if (!pendingAttachments.length) {
      strip.style.display = 'none';
      strip.innerHTML = '';
      return;
    }
    strip.style.display = 'flex';
    strip.innerHTML = '';
    pendingAttachments.forEach((a, idx) => {
      const b = document.createElement('span');
      b.className = 'att-badge';
      b.innerHTML = `${a.is_image ? '🖼' : '📄'} ${escapeHtml(a.name)} <button type="button">✕</button>`;
      b.querySelector('button').onclick = () => {
        pendingAttachments.splice(idx, 1);
        renderPendingAttachments();
        refreshSendBtnVisual();
      };
      strip.appendChild(b);
    });
  }

  async function uploadFile(file) {
    if (!ws || ws.readyState !== 1) return showToast('尚未连接服务器');
    const uid = Math.random().toString(36).slice(2, 10);
    showToast(`正在上传 ${file.name}...`);
    ws.send(JSON.stringify({ type: 'upload_init', upload_id: uid, name: file.name, size: file.size }));

    const chunkSize = 384 * 1024;
    for (let offset = 0; offset < file.size; offset += chunkSize) {
      const slice = file.slice(offset, offset + chunkSize);
      const buf = await slice.arrayBuffer();
      let binary = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      ws.send(JSON.stringify({ type: 'upload_chunk', upload_id: uid, data: btoa(binary) }));
    }
    ws.send(JSON.stringify({ type: 'upload_complete', upload_id: uid }));
  }

    if (optimisticWaitRowId) {

    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = optimisticWaitRowId;

    chatScroll.appendChild(row);

  function sendChat(overrideText = null) {
    setPlusOpen(false);
    if (!ws || ws.readyState !== 1) {
      handleAppWakeup();
      return showToast('正在重连，请稍候...');
    }
    if (isStreaming && overrideText === null) {
      // Stop ONLY the current conversation's stream without losing any text typed in msgInput!
      ws.send(JSON.stringify({ type: 'cancel', slot: activeSlot, msg_id: activeStreamMsgId }));
      return;
    }
    const text = overrideText !== null ? overrideText : msgInput.value.trim();
    if (!text && !pendingAttachments.length) return;
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
    const clientId = 'u-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const atts = pendingAttachments.splice(0, pendingAttachments.length);

    appendUserBubble({ id: clientId, role: 'user', text, attachments: atts });
    showOptimisticPlaceholder();
    setStreamingState(true);

    ws.send(JSON.stringify({
      type: 'chat',
      slot: activeSlot,
      client_id: clientId,
      text,
      attachments: atts,
    }));
    renderPendingAttachments();
    if (overrideText === null) {
      msgInput.value = '';
      msgInput.style.height = 'auto';
      try { localStorage.removeItem('agy_pwa_draft'); } catch (_) {}
      refreshSendBtnVisual();
    }
  }

    let rec = null;
    let listening = false;
    voiceBtn.onclick = () => {
      if (listening && rec) {
        rec.stop();
        return;
      }
      rec = new SpeechRec();
      rec.lang = 'zh-CN';
      rec.interimResults = false;
      rec.onstart = () => {
        listening = true;
        voiceBtn.classList.add('recording');
        showToast('正在聆听...');
      };
      rec.onresult = (ev) => {
        const transcript = Array.from(ev.results).map((r) => r[0].transcript).join('');
        if (transcript) {
          msgInput.value = (msgInput.value ? msgInput.value + ' ' : '') + transcript;
          msgInput.dispatchEvent(new Event('input'));
        }
      };
      rec.onend = () => { listening = false; voiceBtn.classList.remove('recording'); };
      rec.onerror = () => { listening = false; voiceBtn.classList.remove('recording'); };
      try { rec.start(); } catch (_) {}
    };
  }
