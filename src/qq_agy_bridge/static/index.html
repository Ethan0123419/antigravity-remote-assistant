<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#060A13" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Antigravity" />
<link id="manifestLink" rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" href="/icon-192.png" />
<title>Antigravity · 私人助理</title>
<style>
  :root {
    --bg: #060a13;
    --glass: rgba(16, 26, 44, 0.62);
    --glass-strong: rgba(13, 21, 36, 0.84);
    --glass-border: rgba(125, 211, 252, 0.16);
    --glass-border-soft: rgba(148, 163, 184, 0.12);
    --user-bubble: linear-gradient(135deg, rgba(2, 132, 199, 0.88), rgba(14, 116, 144, 0.88));
    --ai-bubble: rgba(20, 31, 51, 0.68);
    --text: #f1f5f9;
    --text-sec: #94a3b8;
    --text-muted: #64748b;
    --cyan: #38bdf8;
    --emerald: #34d399;
    --amber: #fbbf24;
    --rose: #fb7185;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --app-h: 100dvh;
    --kb-open: 0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }

  /* Ambient Aurora Background */
  .aurora {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.34;
    animation: floatOrb 18s ease-in-out infinite alternate;
  }
  .orb-1 { width: 340px; height: 340px; background: #0284c7; top: -90px; left: -70px; }
  .orb-2 { width: 300px; height: 300px; background: #0d9488; bottom: 8%; right: -80px; animation-delay: -6s; }
  .orb-3 { width: 260px; height: 260px; background: #4f46e5; top: 38%; left: 25%; opacity: 0.18; animation-delay: -11s; }
  @keyframes floatOrb {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(24px, -28px, 0) scale(1.08); }
  }

  /* App Layout — tracks visualViewport so iOS/Android virtual keyboard never covers input */
  .app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: var(--app-h, 100dvh); max-width: 860px; margin: 0 auto;
  }

  /* Frosted Top Header */
  .topbar {
    padding: calc(var(--safe-top) + 10px) 14px 10px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(170%);
    -webkit-backdrop-filter: blur(24px) saturate(170%);
    border-bottom: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    background: var(--amber); box-shadow: 0 0 10px var(--amber);
    transition: all 0.3s ease;
  }
  .status-dot.online { background: var(--emerald); box-shadow: 0 0 12px var(--emerald); }
  .status-dot.offline { background: var(--rose); box-shadow: 0 0 10px var(--rose); }
  .brand-title { font-size: 15.5px; font-weight: 700; letter-spacing: 0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 11px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .glass-pill {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--glass-border);
    color: var(--text); font-size: 12px; font-weight: 600;
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: inline-flex; align-items: center; gap: 5px;
    transition: background 0.2s, transform 0.12s;
  }
  .glass-pill:active { transform: scale(0.96); background: rgba(56, 189, 248, 0.18); }

  /* Chat Stream Area */
  .chat-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-scroll {
    flex: 1; overflow-y: auto; padding: 16px 14px 12px;
    display: flex; flex-direction: column; gap: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .jump-bottom-btn {
    position: absolute; right: 16px; bottom: 12px; z-index: 12;
    padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: rgba(13, 23, 40, 0.9); color: #7dd3fc;
    border: 1px solid rgba(56, 189, 248, 0.38);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    cursor: pointer; display: none;
  }
  .jump-bottom-btn.show { display: inline-flex; align-items: center; gap: 4px; }

  .empty-hero {
    margin: auto 12px; padding: 26px 22px; text-align: center;
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 22px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .empty-hero h2 { margin: 8px 0 6px; font-size: 19px; font-weight: 700; }
  .empty-hero p { margin: 0; font-size: 13px; color: var(--text-sec); line-height: 1.6; }

  .msg-row { display: flex; flex-direction: column; max-width: 88%; animation: fadeUp 0.16s ease-out; }
  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.assistant { align-self: flex-start; align-items: flex-start; max-width: 94%; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    padding: 11px 15px; border-radius: 18px;
    font-size: 15px; line-height: 1.6; word-break: break-word;
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    max-width: 100%;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(125, 211, 252, 0.28);
    border-bottom-right-radius: 5px; color: #fff;
    white-space: pre-wrap;
  }
  .msg-row.assistant .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--glass-border-soft);
    border-top-color: rgba(125, 211, 252, 0.24);
    border-bottom-left-radius: 5px;
  }
  .msg-footer {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--text-muted); margin-top: 4px; padding: 0 4px;
  }
  .copy-msg-btn {
    background: none; border: none; color: var(--text-muted);
    font-size: 11px; padding: 0; cursor: pointer;
  }
  .copy-msg-btn:active { color: var(--cyan); }

  /* Rich formatting inside assistant bubble */
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    margin: 10px 0 6px; font-weight: 700; line-height: 1.35; color: #f8fafc;
  }
  .bubble h1 { font-size: 17.5px; }
  .bubble h2 { font-size: 16.5px; }
  .bubble h3, .bubble h4 { font-size: 15.2px; color: #bae6fd; }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 6px 0 8px; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble blockquote {
    margin: 8px 0; padding: 6px 11px;
    border-left: 3px solid var(--cyan);
    background: rgba(56, 189, 248, 0.08);
    border-radius: 0 8px 8px 0; color: #cbd5e1; font-size: 14px;
  }
  .bubble hr {
    border: none; border-top: 1px solid rgba(148, 163, 184, 0.18); margin: 10px 0;
  }
  .bubble a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed rgba(56,189,248,0.5); }
  .bubble pre {
    margin: 8px 0; padding: 28px 12px 10px; border-radius: 12px;
    background: rgba(6, 10, 19, 0.82); border: 1px solid rgba(148,163,184,0.16);
    overflow-x: auto; font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px;
    position: relative; line-height: 1.5;
  }
  .code-lang {
    position: absolute; top: 6px; left: 11px;
    font-size: 10.5px; color: var(--text-muted); text-transform: lowercase;
  }
  .copy-code-btn {
    position: absolute; top: 5px; right: 8px;
    background: rgba(255,255,255,0.1); border: none; color: var(--text-sec);
    font-size: 11px; padding: 2px 9px; border-radius: 6px; cursor: pointer;
  }
  .bubble code:not(pre code) {
    background: rgba(56, 189, 248, 0.13); color: #bae6fd;
    padding: 1px 6px; border-radius: 5px; font-size: 13.5px;
  }
  .table-wrap {
    width: 100%; overflow-x: auto; margin: 8px 0; border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, 0.18);
  }
  .bubble table {
    width: 100%; border-collapse: collapse; font-size: 13px; background: rgba(8, 14, 26, 0.6);
  }
  .bubble th, .bubble td {
    padding: 6px 10px; border-bottom: 1px solid rgba(148, 163, 184, 0.14); text-align: left;
  }
  .bubble th { background: rgba(56, 189, 248, 0.1); color: #e0f2fe; font-weight: 600; }

  .stream-cursor {
    display: inline-block; width: 7px; height: 15px; margin-left: 3px;
    background: var(--cyan); border-radius: 2px; vertical-align: text-bottom;
    animation: blink 0.9s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.18; } }

  .media-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chat-img {
    max-width: min(100%, 340px); max-height: 280px; border-radius: 13px;
    border: 1px solid var(--glass-border); cursor: zoom-in; object-fit: cover;
    display: block;
  }
  .file-card {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 9px 13px; border-radius: 12px;
    background: rgba(15, 23, 42, 0.75); border: 1px solid var(--glass-border);
    color: var(--text); text-decoration: none; font-size: 13px;
  }

  /* Quick Chips + Composer Dock */
  .bottom-dock {
    flex-shrink: 0;
    padding: 6px 12px calc((1 - var(--kb-open, 0)) * var(--safe-bottom) + 8px);
    background: linear-gradient(to top, rgba(6,10,19,0.95) 65%, rgba(6,10,19,0));
  }
  .chips-bar {
    display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 8px;
    scrollbar-width: none;
  }
  .chips-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 6px 12px; border-radius: 999px;
    background: rgba(19, 31, 51, 0.68); border: 1px solid var(--glass-border-soft);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--text-sec); font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all 0.15s;
  }
  .chip:active { background: rgba(56, 189, 248, 0.2); color: #fff; border-color: var(--cyan); }

  /* Pending Attachments Strip */
  .att-strip {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 0 4px 8px;
  }
  .att-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(2, 132, 199, 0.22); border: 1px solid rgba(56,189,248,0.35);
    padding: 4px 10px; border-radius: 999px; font-size: 12px; color: #e0f2fe;
  }
  .att-badge button {
    background: none; border: none; color: var(--rose); font-size: 14px; cursor: pointer; padding: 0;
  }

  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 7px 9px 7px 12px; border-radius: 24px;
    background: var(--glass-strong);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none; flex-shrink: 0;
    background: rgba(255,255,255,0.07); color: var(--text-sec);
    font-size: 17px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:active { background: rgba(255,255,255,0.16); color: #fff; }
  textarea#msgInput {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--text); font-size: 16px; line-height: 1.42;
    max-height: 120px; padding: 7px 2px; font-family: inherit;
  }
  textarea#msgInput::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; flex-shrink: 0;
    background: linear-gradient(135deg, #0284c7, #0ea5e9);
    color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
  }
  .send-btn.stop { background: linear-gradient(135deg, #be123c, #f43f5e); box-shadow: 0 4px 14px rgba(244,63,94,0.4); }

  /* Glass Modals / Sheets */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(3, 7, 15, 0.72);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .sheet {
    width: 100%; max-width: 560px; border-radius: 22px; padding: 18px;
    background: rgba(14, 23, 39, 0.9);
    border: 1px solid var(--glass-border);
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    max-height: 88dvh; display: flex; flex-direction: column;
  }
  .sheet-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .sheet-hdr h3 { margin: 0; font-size: 15.5px; }
  .screen-frame {
    width: 100%; border-radius: 12px; border: 1px solid var(--glass-border-soft);
    background: #04070e; min-height: 180px; max-height: 62dvh; object-fit: contain; display: block;
  }
  .model-opt {
    width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
    border-radius: 14px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border-soft); color: var(--text); cursor: pointer;
  }
  .model-opt:active, .model-opt.active { border-color: var(--cyan); background: rgba(56,189,248,0.14); }
  .token-input {
    width: 100%; padding: 11px 13px; border-radius: 12px; margin: 10px 0;
    background: rgba(6,10,19,0.8); border: 1px solid var(--glass-border);
    color: var(--text); font-size: 15px; outline: none;
  }
  .toast {
    position: fixed; top: calc(var(--safe-top) + 64px); left: 50%; transform: translateX(-50%);
    z-index: 90; padding: 8px 16px; border-radius: 999px; font-size: 13px;
    background: rgba(15, 23, 42, 0.92); border: 1px solid var(--glass-border);
    backdrop-filter: blur(16px); display: none; max-width: 88vw; text-align: center;
  }

  /* Conversation Switcher List */
  .conv-search {
    width: 100%; padding: 9px 12px; border-radius: 11px; margin-bottom: 9px;
    background: rgba(6, 10, 19, 0.78); border: 1px solid var(--glass-border-soft);
    color: var(--text); font-size: 13.5px; outline: none;
  }
  .conv-search:focus { border-color: var(--cyan); }
  .conv-filter-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .conv-list {
    max-height: 48dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    padding-right: 2px; -webkit-overflow-scrolling: touch;
  }
  .conv-card {
    width: 100%; text-align: left; padding: 11px 13px; border-radius: 15px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--glass-border-soft);
    color: var(--text); cursor: pointer; transition: all 0.15s;
  }
  .conv-card:active, .conv-card.active {
    background: rgba(56, 189, 248, 0.14); border-color: var(--cyan);
  }
  .conv-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .conv-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-badge {
    font-size: 10.5px; padding: 2px 7px; border-radius: 999px; flex-shrink: 0;
    background: rgba(56, 189, 248, 0.16); color: #7dd3fc;
  }
  .conv-badge.cli { background: rgba(52, 211, 153, 0.16); color: #6ee7b7; }
  .conv-badge.run { background: rgba(251, 191, 36, 0.2); color: #fde68a; }
  .conv-sub {
    font-size: 11.5px; color: var(--text-muted); display: flex; justify-content: space-between; gap: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ws-picker {
    margin-bottom: 10px; padding: 10px 12px; border-radius: 14px;
    background: rgba(6, 10, 19, 0.65); border: 1px solid var(--glass-border-soft); display: none;
  }
  .ws-picker.show { display: block; }
</style>
</head>
<body>
  <div class="aurora">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div id="toast" class="toast"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <button id="chatsBtn" class="glass-pill" title="查看已有聊天框或新建对话" style="padding:6px 10px">☰ 会话</button>
        <div id="connDot" class="status-dot"></div>
        <div style="min-width:0">
          <div id="headerTitle" class="brand-title" style="max-width:42vw">Antigravity 助理</div>
          <div id="subInfo" class="brand-sub">正在连接加密通道...</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="newChatTopBtn" class="glass-pill" title="新建空白对话">＋</button>
        <button id="modelBtn" class="glass-pill" title="切换模型">✦ <span id="modelShort">均衡</span></button>
        <button id="liveDeskBtn" class="glass-pill" title="查看实时电脑桌面">🖥</button>
      </div>
    </header>

    <div class="chat-wrap">
      <main id="chatScroll" class="chat-scroll">
        <div id="emptyHero" class="empty-hero">
          <div style="font-size:28px">✦</div>
          <h2>随时随地，直连你的电脑</h2>
          <p>支持逐字流式对话、电脑端 IDE 聊天实时同步查看与续聊、实时电脑屏幕预览、任意大文件互传。<br/>在手机浏览器菜单点击「添加到主屏幕」即可免密像独立 App 一样打开。</p>
        </div>
      </main>
      <button id="jumpBottomBtn" class="jump-bottom-btn">↓ 最新回复</button>
    </div>

    <section class="bottom-dock">
      <div id="attStrip" class="att-strip" style="display:none"></div>
      <div class="chips-bar">
        <button id="syncIdeChip" class="chip" style="display:none;border-color:rgba(52,211,153,0.45);color:#6ee7b7">● 自动同步电脑回复 (点此立即刷新)</button>
        <button class="chip" data-open="chats">💬 切换聊天框</button>
        <button class="chip" data-open="desktop">🖥 实时画面</button>
        <button class="chip" data-cmd="/screen">📸 秒截桌面</button>
        <button class="chip" data-open="newchat">✨ 新建对话</button>
        <button class="chip" data-cmd="/status">📊 状态与额度</button>
      </div>
      <div class="composer">
        <input type="file" id="filePicker" multiple style="display:none" />
        <button id="attachBtn" class="icon-btn" title="发送照片或文件">＋</button>
        <textarea id="msgInput" rows="1" placeholder="像平时聊天一样说就行..."></textarea>
        <button id="sendBtn" class="send-btn" title="发送">↑</button>
      </div>
    </section>
  </div>

  <!-- Token Unlock Modal -->
  <div id="authModal" class="overlay">
    <div class="sheet" style="max-width:400px; text-align:center">
      <div style="font-size:26px; margin-bottom:6px">🔒</div>
      <h3 style="margin:0 0 6px">输入私密访问密钥</h3>
      <div style="font-size:12.5px; color:var(--text-sec)">在电脑端毛玻璃启动器点击「📱 手机端专属 App」扫码可直接免输登录</div>
      <input id="tokenInput" class="token-input" type="password" placeholder="粘贴 WEB_ACCESS_TOKEN" />
      <button id="saveTokenBtn" class="glass-pill" style="width:100%; justify-content:center; padding:11px; background:#0284c7; border:none">解锁并连接</button>
    </div>
  </div>

  <!-- Live Desktop Preview Sheet -->
  <div id="deskModal" class="overlay">
    <div class="sheet">
      <div class="sheet-hdr">
        <h3>🖥 电脑实时桌面预览</h3>
        <div style="display:flex; gap:8px">
          <button id="toggleLiveBtn" class="glass-pill">▶ 实时跟随</button>
          <button id="refreshDeskBtn" class="glass-pill">↻ 刷新</button>
          <button id="closeDeskBtn" class="glass-pill">✕</button>
        </div>
      </div>

<script>
(() => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  const $ = (id) => document.getElementById(id);
  const chatScroll = $('chatScroll');
  const msgInput = $('msgInput');
  const sendBtn = $('sendBtn');
  const connDot = $('connDot');
  const subInfo = $('subInfo');
  const jumpBottomBtn = $('jumpBottomBtn');

  // Extract ?token= from QR scan URL & clean address bar immediately
  const urlParams = new URLSearchParams(location.search);
  const urlToken = urlParams.get('token');
  if (urlToken) {
    try { localStorage.setItem('agy_pwa_token', urlToken.trim()); } catch (_) {}
    history.replaceState({}, '', location.pathname);
  }

  let token = '';
  try { token = localStorage.getItem('agy_pwa_token') || ''; } catch (_) {}

  function syncManifestToken() {
    const link = $('manifestLink');
    if (link) {
      link.href = token ? `/manifest.json?token=${encodeURIComponent(token)}` : '/manifest.json';
    }
  }
  syncManifestToken();

  // Restore unsent draft so accidental refresh never loses typed input
  try {
    const savedDraft = localStorage.getItem('agy_pwa_draft');
    if (savedDraft) msgInput.value = savedDraft;
  } catch (_) {}

  // Mobile Virtual Keyboard Viewport Adaptation (fixes iOS standalone PWA 100dvh overlap bug)
  function updateVisualViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    const h = Math.round(vv.height);
    const kbOpen = (window.innerHeight - h) > 110 ? 1 : 0;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    document.documentElement.style.setProperty('--kb-open', String(kbOpen));
    if (window.scrollY !== 0) window.scrollTo(0, 0);
    if (kbOpen) scrollToBottom(false);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateVisualViewport);
    window.visualViewport.addEventListener('scroll', updateVisualViewport);
    updateVisualViewport();
  }
  msgInput.addEventListener('blur', () => {
    setTimeout(() => {
      if (window.scrollY !== 0) window.scrollTo(0, 0);
      updateVisualViewport();
    }, 80);
  });

  let ws = null;
  let reconnectTimer = null;
  let reconnectAttempt = 0;
  let pongWatchdog = null;
  let isStreaming = false;
  let liveScreenOn = false;
  let pendingAttachments = [];
  let pingTimer = null;
  let lastRttMs = null;
  let optimisticWaitRowId = null;
  let activeConvId = '';
  let activeConvStore = '';
  let allConvItems = [];
  let convFilter = 'all';
  let convQuery = '';
  const streamBuffers = new Map();
  const rawMessageTexts = new Map();
  const renderedIds = new Set();

  function showToast(text, ms = 2600) {
    const el = $('toast');
    el.textContent = text;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, ms);
  }

  // Works on BOTH HTTPS tunnels AND non-HTTPS Wi-Fi LAN (http://192.168.x.x / 172.x)
  async function copyTextSafe(text, btnEl, okLabel = '已复制') {
    const orig = btnEl ? btnEl.textContent : '';
    let copied = false;
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (_) {}
    }
    if (!copied) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        copied = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (_) {}
    }
    if (copied && btnEl) {
      btnEl.textContent = okLabel;
      setTimeout(() => { btnEl.textContent = orig; }, 1600);
    } else if (!copied) {
      showToast('复制失败，请长按文本选择复制');
    }
  }

  function mediaUrl(mediaId) {
    const base = `/dl/${encodeURIComponent(mediaId)}`;
    return token ? `${base}?token=${encodeURIComponent(token)}` : base;
  }

  function shortModelName(m) {
    if (!m) return '默认';
    if (m.includes('电脑端')) return m;
    if (m.includes('sonnet') && m.includes('low')) return '极速';
    if (m.includes('sonnet')) return '均衡';
    if (m.includes('opus')) return 'Opus';
    if (m.includes('gemini-4')) return 'Gemini 4';
    if (m.includes('flash')) return 'Flash';
    return m.split('-').slice(0, 2).join('-');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatInlineMarkdown(escapedLine) {
    const codeSlots = [];
    let s = escapedLine.replace(/`([^`\n]+)`/g, (_, code) => {
      const idx = codeSlots.push(`<code>${code}</code>`) - 1;
      return `\x00C${idx}\x00`;
    });
    // Safe Markdown links [label](https://...) — strictly http/https only
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
      const idx = codeSlots.push(`<a href="${url}" target="_blank" rel="noopener">${label}</a>`) - 1;
      return `\x00C${idx}\x00`;
    });
    // Bare URLs
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\x00C(\d+)\x00/g, (_, idx) => codeSlots[Number(idx)] || '');
    return s;
  }

  function renderMarkdownBlocks(textBlock) {
    const lines = textBlock.split('\n');
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const rawLine = lines[i];
      const trimmed = rawLine.trim();

      if (!trimmed) { i++; continue; }

      // Horizontal rule
      if (/^(-{3,}|\*{3,})$/.test(trimmed)) {
        out.push('<hr/>');
        i++;
        continue;
      }

      // Headings #..####
      const hm = trimmed.match(/^(#{1,4})\s+(.+)$/);
      if (hm) {
        const lvl = hm[1].length;
        out.push(`<h${lvl}>${formatInlineMarkdown(escapeHtml(hm[2]))}</h${lvl}>`);
        i++;
        continue;
      }

      // Markdown Table
      if (trimmed.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i + 1])) {
        const parseCells = (rowStr) => rowStr.trim().replace(/^\||\|$/g, '').split('|').map((c) => formatInlineMarkdown(escapeHtml(c.trim())));
        const headers = parseCells(rawLine);
        i += 2;
        const bodyRows = [];
        while (i < lines.length && lines[i].trim().includes('|')) {
          bodyRows.push(parseCells(lines[i]));
          i++;
        }
        const thHtml = headers.map((h) => `<th>${h}</th>`).join('');
        const tbHtml = bodyRows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
        out.push(`<div class="table-wrap"><table><thead><tr>${thHtml}</tr></thead><tbody>${tbHtml}</tbody></table></div>`);
        continue;
      }

      // Blockquote
      if (trimmed.startsWith('&gt;') || trimmed.startsWith('>')) {
        const qLines = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          qLines.push(formatInlineMarkdown(escapeHtml(lines[i].replace(/^\s*>\s?/, ''))));
          i++;
        }
        out.push(`<blockquote>${qLines.join('<br/>')}</blockquote>`);
        continue;
      }

      // Unordered list
      if (/^\s*[-*•]\s+/.test(rawLine)) {
        const items = [];
        while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
          items.push(`<li>${formatInlineMarkdown(escapeHtml(lines[i].replace(/^\s*[-*•]\s+/, '')))}</li>`);
          i++;
        }
        out.push(`<ul>${items.join('')}</ul>`);
        continue;
      }

      // Ordered list
      if (/^\s*\d+\.\s+/.test(rawLine)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          items.push(`<li>${formatInlineMarkdown(escapeHtml(lines[i].replace(/^\s*\d+\.\s+/, '')))}</li>`);
          i++;
        }
        out.push(`<ol>${items.join('')}</ol>`);
        continue;
      }

      // Normal paragraph
      const pLines = [];
      while (
        i < lines.length &&
        lines[i].trim() &&
        !/^(#{1,4}\s+|-{3,}$|\*{3,}$|\s*[-*•]\s+|\s*\d+\.\s+|\s*>)/.test(lines[i])
      ) {
        pLines.push(formatInlineMarkdown(escapeHtml(lines[i])));
        i++;
      }
      if (pLines.length) out.push(`<p>${pLines.join('<br/>')}</p>`);
      else i++;
    }
    return out.join('');
  }

  function renderRichText(raw) {
    if (!raw) return '';
    const parts = String(raw).split(/(```[\s\S]*?```)/g);
    return parts.map((part) => {
      if (part.startsWith('```') && part.endsWith('```')) {
        const lines = part.slice(3, -3).split('\n');
        let lang = '';
        if (lines.length > 1 && /^[a-zA-Z0-9_+-]*$/.test(lines[0].trim())) {
          lang = lines.shift().trim();
        }
        const code = escapeHtml(lines.join('\n').trim());
        const langTag = lang ? `<span class="code-lang">${escapeHtml(lang)}</span>` : '';
        return `<pre>${langTag}<button type="button" class="copy-code-btn">复制</button><code>${code}</code></pre>`;
      }
      return renderMarkdownBlocks(part);
    }).join('');
  }

  // Event delegation for code-block copy and whole-message copy
  chatScroll.addEventListener('click', (e) => {
    const codeBtn = e.target.closest('.copy-code-btn');
    if (codeBtn) {
      const codeEl = codeBtn.parentElement && codeBtn.parentElement.querySelector('code');
      if (codeEl) copyTextSafe(codeEl.innerText, codeBtn, '已复制');
      return;
    }
    const msgBtn = e.target.closest('.copy-msg-btn');
    if (msgBtn && msgBtn.dataset.mid) {
      const rawTxt = rawMessageTexts.get(msgBtn.dataset.mid) || '';
      if (rawTxt) copyTextSafe(rawTxt, msgBtn, '✓ 已复制全文');
    }
  });

  function isNearBottom(threshold = 150) {
    return chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < threshold;
  }

  function updateJumpButton() {
    if (isNearBottom(220)) jumpBottomBtn.classList.remove('show');
    else jumpBottomBtn.classList.add('show');
  }
  chatScroll.addEventListener('scroll', updateJumpButton, { passive: true });
  jumpBottomBtn.onclick = () => {
    chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: 'smooth' });
  };

  function scrollToBottom(force = false) {
    if (force || isNearBottom(160)) {
      chatScroll.scrollTop = chatScroll.scrollHeight;
      jumpBottomBtn.classList.remove('show');
    } else {
      updateJumpButton();
    }
  }

  function hideHero() {
    const hero = $('emptyHero');
    if (hero) hero.style.display = 'none';
  }

  function appendUserBubble(item, autoScroll = true) {
    if (item.id && renderedIds.has(item.id)) return;
    if (item.id) renderedIds.add(item.id);
    hideHero();
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = item.text || '';
    if (item.attachments && item.attachments.length) {
      const grid = document.createElement('div');
      grid.className = 'media-grid';
      item.attachments.forEach((a) => {
        if (a.is_image && a.media_id) {
          const img = document.createElement('img');
          img.className = 'chat-img';
          img.src = mediaUrl(a.media_id);
          img.onclick = () => openLightbox(img.src);
          grid.appendChild(img);
        } else if (a.media_id) {
          const link = document.createElement('a');
          link.className = 'file-card';
          link.href = mediaUrl(a.media_id);
          link.textContent = '📎 ' + (a.name || '附件');
          grid.appendChild(link);
        }
      });
      b.appendChild(grid);
    }
    row.appendChild(b);
    chatScroll.appendChild(row);
    if (autoScroll) scrollToBottom(true);
  }

  function ensureAssistantRow(id, model) {
    let row = document.getElementById('row-' + id);
    if (!row) {
      hideHero();
      row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.id = 'row-' + id;
      row.innerHTML = `<div class="bubble" id="bub-${id}"><span class="stream-cursor"></span></div><div class="msg-footer"><span id="meta-${id}">${escapeHtml(shortModelName(model))}</span><button type="button" class="copy-msg-btn" data-mid="${escapeHtml(id)}">复制</button></div>`;
      chatScroll.appendChild(row);
    }
    return row;
  }

  function finalizeAssistantBubble(item, autoScroll = true) {
    renderedIds.add(item.id);
    rawMessageTexts.set(item.id, item.text || '');
    ensureAssistantRow(item.id, item.model);
    const bub = document.getElementById('bub-' + item.id);
    const meta = document.getElementById('meta-' + item.id);
    bub.innerHTML = renderRichText(item.text || '');

    if (item.images && item.images.length) {
      const grid = document.createElement('div');
      grid.className = 'media-grid';
      item.images.forEach((im) => {
        const img = document.createElement('img');
        img.className = 'chat-img';
        img.src = mediaUrl(im.media_id);
        img.onclick = () => openLightbox(img.src);
        grid.appendChild(img);
      });
      bub.appendChild(grid);
    }
    if (item.files && item.files.length) {
      item.files.forEach((f) => {
        const a = document.createElement('a');
        a.className = 'file-card';
        a.href = mediaUrl(f.media_id);
        a.download = f.name || '';
        const kb = f.size ? ` (${(f.size / 1024).toFixed(1)} KB)` : '';
        a.textContent = `📥 下载 ${f.name || '文件'}${kb}`;
        bub.appendChild(a);
      });
    }
    if (meta && item.model) meta.textContent = shortModelName(item.model);
    if (autoScroll) scrollToBottom();
  }

  function setStreamingState(active) {
    isStreaming = active;
    if (active) {
      sendBtn.classList.add('stop');
      sendBtn.textContent = '■';
      sendBtn.title = '停止生成';
    } else {
      sendBtn.classList.remove('stop');
      sendBtn.textContent = '↑';
      sendBtn.title = '发送';
    }
  }

  function renderHistoryBatch(hist, preserveScroll = false) {
    const wasNearBottom = isNearBottom(180);
    const prevScrollTop = chatScroll.scrollTop;
    chatScroll.innerHTML = '';
    renderedIds.clear();
    streamBuffers.clear();
    rawMessageTexts.clear();
    if (!hist || !hist.length) {
      return;
    }
    hist.forEach((h) => {
      if (h.role === 'user') appendUserBubble(h, false);
      else finalizeAssistantBubble(h, false);
    });
    if (!preserveScroll || wasNearBottom) {
      scrollToBottom(true);
    } else {
      chatScroll.scrollTop = prevScrollTop;
      updateJumpButton();
    }
  }

  function restoreInflightStream(inf) {
    if (!inf || !inf.msg_id) return;
    clearOptimisticPlaceholder();
    setStreamingState(true);
    const curText = inf.text || '';
    streamBuffers.set(inf.msg_id, curText);
    rawMessageTexts.set(inf.msg_id, curText);
    ensureAssistantRow(inf.msg_id, inf.model || '');
    const bub = document.getElementById('bub-' + inf.msg_id);
    if (bub) {
      if (curText) {
        bub.innerHTML = renderRichText(curText) + '<span class="stream-cursor"></span>';
      } else if (inf.status) {
        bub.innerHTML = `<span style="color:var(--text-sec);font-size:13.5px">${escapeHtml(inf.status)}</span><span class="stream-cursor"></span>`;
      }
    }
    scrollToBottom(true);
  }

  function clearPongWatchdog() {
    if (pongWatchdog) {
      clearTimeout(pongWatchdog);
      pongWatchdog = null;
    }
  }

  function connect() {
    clearTimeout(reconnectTimer);
    clearPongWatchdog();
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const qs = token ? `?token=${encodeURIComponent(token)}` : '';
    ws = new WebSocket(`${proto}//${location.host}/ws${qs}`);

    ws.onopen = () => {
      reconnectAttempt = 0;
      connDot.className = 'status-dot online';
      subInfo.textContent = '已加密直连你的电脑';
      $('authModal').classList.remove('show');
      clearInterval(pingTimer);
      const sendPing = () => {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'ping', ts: Date.now() }));
        }
      };
      sendPing();
      pingTimer = setInterval(sendPing, 8000);
      if (liveScreenOn && $('deskModal').classList.contains('show')) {
        ws.send(JSON.stringify({ type: 'live_screen', enable: true, interval_ms: 1600 }));
      }
    };

    ws.onmessage = (ev) => {
      clearPongWatchdog();
      const data = JSON.parse(ev.data);
      if (data.type === 'pong' && data.ts) {
        lastRttMs = Math.max(1, Date.now() - Number(data.ts));
        const base = subInfo.dataset.wsName || '已加密直连';
        subInfo.textContent = `${base} · 延迟 ${lastRttMs}ms`;
        return;
      }
      if (data.type === 'hello') {
        $('modelShort').textContent = shortModelName(data.model);
        activeConvId = data.active_conversation_id || '';
        activeConvStore = data.active_store || '';
        $('syncIdeChip').style.display = activeConvStore === 'ide' ? 'inline-block' : 'none';
        if (data.active_title) $('headerTitle').textContent = data.active_title;
        const wsName = data.workspace.split(/[\\/]/).pop() || data.workspace;
        subInfo.dataset.wsName = wsName;
        subInfo.textContent = lastRttMs ? `${wsName} · 延迟 ${lastRttMs}ms` : wsName;
        setStreamingState(Boolean(data.busy));
        if (Array.isArray(data.history) && data.history.length) {
          renderHistoryBatch(data.history, false);
        }
        if (data.inflight) {
          restoreInflightStream(data.inflight);
        }
      } else if (data.type === 'meta_update') {
        $('modelShort').textContent = shortModelName(data.model);
        if (typeof data.active_conversation_id === 'string') activeConvId = data.active_conversation_id;
        if (typeof data.active_store === 'string') {
          activeConvStore = data.active_store;
          $('syncIdeChip').style.display = activeConvStore === 'ide' ? 'inline-block' : 'none';
        }
        if (data.active_title) $('headerTitle').textContent = data.active_title;
        if (data.workspace) {
          const wsName = data.workspace.split(/[\\/]/).pop() || data.workspace;
          subInfo.dataset.wsName = wsName;
          subInfo.textContent = lastRttMs ? `${wsName} · 延迟 ${lastRttMs}ms` : wsName;
        }
      } else if (data.type === 'conversations_list') {
        activeConvId = data.active_id || activeConvId;
        allConvItems = data.items || [];
        renderConvList();
        renderWorkspaceChips(data.workspaces || [], data.current_workspace || '');
      } else if (data.type === 'conversation_loaded') {
        activeConvId = data.conversation_id || '';
        activeConvStore = data.store || '';
        $('headerTitle').textContent = data.title || 'Antigravity 助理';
        $('syncIdeChip').style.display = activeConvStore === 'ide' ? 'inline-block' : 'none';
        if (data.workspace) {
          const wsName = data.workspace.split(/[\\/]/).pop() || data.workspace;
          subInfo.dataset.wsName = wsName;
          subInfo.textContent = lastRttMs ? `${wsName} · 延迟 ${lastRttMs}ms` : wsName;
        }
        const hist = data.history || [];
        if (!hist.length) {
          chatScroll.innerHTML = `<div class="empty-hero"><h2>${escapeHtml(data.title || '空对话')}</h2><p>已连接到该对话，直接发消息即可接着往下聊。</p></div>`;
          renderedIds.clear();
          streamBuffers.clear();
        } else {
          renderHistoryBatch(hist, Boolean(data.silent));
        }
        if (!data.silent) {
          $('chatsModal').classList.remove('show');
          showToast(`已载入：${data.title}`);
        }
      } else if (data.type === 'clear_history') {
        clearOptimisticPlaceholder();
        setStreamingState(false);
        chatScroll.innerHTML = `<div id="emptyHero" class="empty-hero"><div style="font-size:28px">✦</div><h2>新对话已就绪</h2><p>直接输入任何任务、问题或电脑操控指令；也可点左上角「☰ 会话」随时切回电脑上的已有聊天框。</p></div>`;
        renderedIds.clear();
        streamBuffers.clear();
        rawMessageTexts.clear();
      } else if (data.type === 'user_msg') {
        appendUserBubble(data.item);
      } else if (data.type === 'stream_start') {
        clearOptimisticPlaceholder();
        setStreamingState(true);
        streamBuffers.set(data.msg_id, '');
        ensureAssistantRow(data.msg_id, data.model);
        scrollToBottom(true);
      } else if (data.type === 'stream_status') {
        ensureAssistantRow(data.msg_id, '');
        const cur = streamBuffers.get(data.msg_id) || '';
        if (!cur) {
          const bub = document.getElementById('bub-' + data.msg_id);
          if (bub) bub.innerHTML = `<span style="color:var(--text-sec);font-size:13.5px">${escapeHtml(data.status)}</span><span class="stream-cursor"></span>`;
        }
      } else if (data.type === 'stream_reset') {
        streamBuffers.set(data.msg_id, '');
        const bub = document.getElementById('bub-' + data.msg_id);
        if (bub) bub.innerHTML = '<span class="stream-cursor"></span>';
      } else if (data.type === 'stream_delta') {
        clearOptimisticPlaceholder();
        const cur = (streamBuffers.get(data.msg_id) || '') + data.delta;
        streamBuffers.set(data.msg_id, cur);
        rawMessageTexts.set(data.msg_id, cur);
        ensureAssistantRow(data.msg_id, '');
        const bub = document.getElementById('bub-' + data.msg_id);
        if (bub) bub.innerHTML = renderRichText(cur) + '<span class="stream-cursor"></span>';
        scrollToBottom();
      } else if (data.type === 'stream_end') {
        clearOptimisticPlaceholder();
        setStreamingState(false);
        streamBuffers.delete(data.item.id);
        finalizeAssistantBubble(data.item);
      } else if (data.type === 'desktop_frame') {
        const sep = mediaUrl(data.media_id).includes('?') ? '&' : '?';
        const u = mediaUrl(data.media_id) + sep + '_t=' + data.ts;
        $('deskImg').src = u;
        $('deskTs').textContent = '更新于 ' + new Date(data.ts).toLocaleTimeString() + ' · 点击画面可全屏放大';
      } else if (data.type === 'upload_done') {
        pendingAttachments.push(data);
        renderPendingAttachments();
        showToast(`已就绪：${data.name}`);
      } else if (data.type === 'toast') {
        showToast(data.text);
      }
    };

    ws.onclose = (ev) => {
      clearInterval(pingTimer);
      clearPongWatchdog();
      ws = null;
      connDot.className = 'status-dot offline';
      setStreamingState(false);
      if (ev.code === 4001) {
        subInfo.textContent = '请输入访问密钥或重新扫码';
        try { localStorage.removeItem('agy_pwa_token'); } catch (_) {}
        token = '';
        syncManifestToken();
        $('authModal').classList.add('show');
        return;
      }
      const delay = Math.min(3500, 450 * Math.pow(1.45, reconnectAttempt++));
      subInfo.textContent = '连接中断，正在极速重连...';
      reconnectTimer = setTimeout(connect, delay);
    };
  }

  // Instant wakeup check when unlocking phone or switching back from another App
  function handleAppWakeup() {
    if (document.visibilityState === 'hidden') return;
    if ($('authModal').classList.contains('show')) return;
    if (!ws || ws.readyState === 2 || ws.readyState === 3) {
      reconnectAttempt = 0;
      connect();
      return;
    }
    if (ws.readyState === 1) {
      clearPongWatchdog();
      try {
        ws.send(JSON.stringify({ type: 'ping', ts: Date.now() }));
        if (activeConvStore === 'ide' && activeConvId) {
          ws.send(JSON.stringify({ type: 'refresh_conversation', conversation_id: activeConvId }));
        }
      } catch (_) {}
      pongWatchdog = setTimeout(() => {
        if (ws) {
          try { ws.close(); } catch (_) {}
          ws = null;
        }
        reconnectAttempt = 0;
        connect();
      }, 2200);
    }
  }
  document.addEventListener('visibilitychange', handleAppWakeup);
  window.addEventListener('pageshow', handleAppWakeup);
  window.addEventListener('online', handleAppWakeup);
  window.addEventListener('focus', handleAppWakeup);

  function renderPendingAttachments() {
    const strip = $('attStrip');
    if (!pendingAttachments.length) {
      strip.style.display = 'none';
      strip.innerHTML = '';
      return;
    }
    strip.style.display = 'flex';
    strip.innerHTML = '';
    pendingAttachments.forEach((a, idx) => {
      const b = document.createElement('span');
      b.className = 'att-badge';
      b.innerHTML = `${a.is_image ? '🖼' : '📄'} ${escapeHtml(a.name)} <button type="button">✕</button>`;
      b.querySelector('button').onclick = () => {
        pendingAttachments.splice(idx, 1);
        renderPendingAttachments();
      };
      strip.appendChild(b);
    });
  }

  async function uploadFile(file) {
    if (!ws || ws.readyState !== 1) return showToast('尚未连接服务器');
    const uid = Math.random().toString(36).slice(2, 10);
    showToast(`正在上传 ${file.name}...`);
    ws.send(JSON.stringify({ type: 'upload_init', upload_id: uid, name: file.name, size: file.size }));

    const chunkSize = 384 * 1024;
    for (let offset = 0; offset < file.size; offset += chunkSize) {
      const slice = file.slice(offset, offset + chunkSize);
      const buf = await slice.arrayBuffer();
      let binary = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      ws.send(JSON.stringify({ type: 'upload_chunk', upload_id: uid, data: btoa(binary) }));
    }
    ws.send(JSON.stringify({ type: 'upload_complete', upload_id: uid }));
  }

  function clearOptimisticPlaceholder() {
    if (optimisticWaitRowId) {
      const el = document.getElementById(optimisticWaitRowId);
      if (el) el.remove();
      optimisticWaitRowId = null;
    }
  }

  function showOptimisticPlaceholder() {
    clearOptimisticPlaceholder();
    optimisticWaitRowId = 'opt-wait-' + Date.now();
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = optimisticWaitRowId;
    row.innerHTML = `<div class="bubble"><span style="color:var(--text-sec);font-size:13.5px">正在响应...</span><span class="stream-cursor"></span></div>`;
    chatScroll.appendChild(row);
    scrollToBottom(true);
  }

  function sendChat(overrideText = null) {
    if (!ws || ws.readyState !== 1) {
      handleAppWakeup();
      return showToast('正在重连，请稍候...');
    }
    if (isStreaming && overrideText === null) {
      ws.send(JSON.stringify({ type: 'cancel' }));
      return;
    }
    const text = overrideText !== null ? overrideText : msgInput.value.trim();
    if (!text && !pendingAttachments.length) return;
    const clientId = 'u-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const atts = pendingAttachments.splice(0, pendingAttachments.length);

    appendUserBubble({ id: clientId, role: 'user', text, attachments: atts });
    showOptimisticPlaceholder();
    setStreamingState(true);

    ws.send(JSON.stringify({
      type: 'chat',
      client_id: clientId,
      text,
      attachments: atts,
    }));
    renderPendingAttachments();
    if (overrideText === null) {
      msgInput.value = '';
      msgInput.style.height = 'auto';
      try { localStorage.removeItem('agy_pwa_draft'); } catch (_) {}
    }
  }

  function openLightbox(src) {
    if (!src) return;
    $('lightboxImg').src = src;
    $('lightbox').classList.add('show');
  }

  // Event bindings
  $('saveTokenBtn').onclick = () => {
    const v = $('tokenInput').value.trim();
    if (!v) return;
    token = v;
    try { localStorage.setItem('agy_pwa_token', token); } catch (_) {}
    syncManifestToken();
    connect();
  };

  sendBtn.onclick = () => sendChat();
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
    try { localStorage.setItem('agy_pwa_draft', msgInput.value); } catch (_) {}
  });
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) {
      e.preventDefault();
      sendChat();
    }
  });

  $('attachBtn').onclick = () => $('filePicker').click();
  $('filePicker').onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    for (const f of files) await uploadFile(f);
  };

  document.querySelectorAll('.chip').forEach((c) => {
    c.onclick = () => {
      if (c.dataset.open === 'desktop') openDesktopModal();
      else if (c.dataset.open === 'chats') openChatsModal();
      else if (c.dataset.open === 'newchat') startNewConversation('');
      else if (c.dataset.cmd) sendChat(c.dataset.cmd);
    };
  });

  $('syncIdeChip').onclick = () => {
    if (ws && ws.readyState === 1) {
      showToast('已同步电脑端最新记录');
      ws.send(JSON.stringify({ type: 'refresh_conversation', conversation_id: activeConvId }));
    }
  };

  function openChatsModal() {
    $('chatsModal').classList.add('show');
    $('wsPicker').classList.remove('show');
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'list_conversations' }));
    }
  }

  function startNewConversation(workspacePath = '') {
    if (!ws || ws.readyState !== 1) return showToast('尚未连接服务器');
    $('chatsModal').classList.remove('show');
    ws.send(JSON.stringify({ type: 'new_conversation', workspace: workspacePath }));
  }

  function renderWorkspaceChips(workspaces, currentWs) {
    const box = $('wsChips');
    box.innerHTML = '';
    workspaces.forEach((w) => {
      const name = w.split(/[\\/]/).pop() || w;
      const b = document.createElement('button');
      b.className = 'chip';
      if (w === currentWs) b.style.borderColor = 'var(--cyan)';
      b.textContent = '📁 ' + name;
      b.title = w;
      b.onclick = () => startNewConversation(w);
      box.appendChild(b);
    });
  }

  function renderConvList() {
    const listEl = $('convList');
    const q = convQuery.trim().toLowerCase();
    const filtered = allConvItems.filter((it) => {
      if (convFilter !== 'all' && it.store !== convFilter) return false;
      if (!q) return true;
      const hay = `${it.title || ''} ${it.preview || ''} ${it.workspace || ''}`.toLowerCase();
      return hay.includes(q);
    });
    if (!filtered.length) {
      listEl.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px">暂无匹配的聊天记录</div>';
      return;
    }
    listEl.innerHTML = '';
    filtered.forEach((it) => {
      const btn = document.createElement('button');
      btn.className = 'conv-card' + (it.conversation_id === activeConvId ? ' active' : '');
      const badgeCls = it.store === 'cli' ? 'conv-badge cli' : 'conv-badge';
      const badgeTxt = it.store === 'cli' ? '📱 手机/QQ' : '💻 电脑端 IDE';
      const runBadge = it.running ? '<span class="conv-badge run">● 运行中</span>' : '';
      const wsShort = it.workspace ? ('📁 ' + (it.workspace.split(/[\\/]/).pop() || '')) : '';
      btn.innerHTML = `
        <div class="conv-top">
          <div class="conv-title">${escapeHtml(it.title || '未命名对话')}</div>
          <div style="display:flex;gap:5px;flex-shrink:0">${runBadge}<span class="${badgeCls}">${badgeTxt}</span></div>
        </div>
        <div class="conv-sub">
          <span style="overflow:hidden;text-overflow:ellipsis">${escapeHtml(wsShort || it.preview || '')}</span>
          <span style="flex-shrink:0">${escapeHtml(it.updated_human || '')}</span>
        </div>
      `;
      btn.onclick = () => {
        if (!ws || ws.readyState !== 1) return;
        showToast('正在加载聊天内容...');
        ws.send(JSON.stringify({
          type: 'select_conversation',
          conversation_id: it.conversation_id,
          store: it.store,
        }));
      };
      listEl.appendChild(btn);
    });
  }

  $('convSearchInput').addEventListener('input', (e) => {
    convQuery = e.target.value || '';
    renderConvList();
  });

  $('chatsBtn').onclick = openChatsModal;
  $('newChatTopBtn').onclick = () => startNewConversation('');
  $('closeChatsBtn').onclick = () => $('chatsModal').classList.remove('show');
  $('refreshChatsBtn').onclick = () => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'list_conversations' }));
  };
  $('toggleNewWsBtn').onclick = () => $('wsPicker').classList.toggle('show');
  $('confirmNewChatBtn').onclick = () => startNewConversation($('customWsInput').value.trim());

  document.querySelectorAll('.conv-flt').forEach((fb) => {
    fb.onclick = () => {
      convFilter = fb.dataset.f;
      document.querySelectorAll('.conv-flt').forEach((x) => {
        x.style.background = x === fb ? 'rgba(56,189,248,0.22)' : 'rgba(255,255,255,0.06)';
      });
      renderConvList();
    };
  });

  function openDesktopModal() {
    $('deskModal').classList.add('show');
    $('deskTs').textContent = '⏳ 正在抓取高清画面...';
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'desktop_frame' }));
  }
  function closeDesktopModal() {
    $('deskModal').classList.remove('show');
    if (liveScreenOn) {
      liveScreenOn = false;
      $('toggleLiveBtn').textContent = '▶ 实时跟随';
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'live_screen', enable: false }));
    }
  }
  $('liveDeskBtn').onclick = openDesktopModal;
  $('closeDeskBtn').onclick = closeDesktopModal;
  $('refreshDeskBtn').onclick = () => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'desktop_frame' }));
  };
  $('toggleLiveBtn').onclick = () => {
    liveScreenOn = !liveScreenOn;
    $('toggleLiveBtn').textContent = liveScreenOn ? '⏸ 暂停跟随' : '▶ 实时跟随';
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'live_screen', enable: liveScreenOn, interval_ms: 1600 }));
  };
  $('deskImg').onclick = () => openLightbox($('deskImg').src);
  $('lightbox').onclick = () => $('lightbox').classList.remove('show');

  // Tap outside sheet on overlay backdrop to dismiss modals cleanly
  ['deskModal', 'modelModal', 'chatsModal'].forEach((mid) => {
    const el = $(mid);
    el.addEventListener('click', (e) => {
      if (e.target === el) {
        if (mid === 'deskModal') closeDesktopModal();
        else el.classList.remove('show');
      }
    });
  });

  $('modelBtn').onclick = () => $('modelModal').classList.add('show');
  $('closeModelBtn').onclick = () => $('modelModal').classList.remove('show');
  document.querySelectorAll('.model-opt').forEach((opt) => {
    opt.onclick = () => {
      $('modelModal').classList.remove('show');
      sendChat('/model ' + opt.dataset.m);
    };
  });

  if (msgInput.value) {
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  }
  connect();
})();
</script>
</body>
</html>
