<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#212121" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="反重力助手" />
  <link id="manifestLink" rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>反重力助手</title>
  <style>
    :root {
      /* Authentic ChatGPT iOS / Android Dark Palette */
      --bg-main: #212121;
      --bg-sidebar: #171717;
      --bg-surface: #2f2f2f;
      --bg-surface-hover: #3a3a3a;
      --bg-code: #0d0d0d;
      --bg-code-hdr: #2f2f2f;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-med: rgba(255, 255, 255, 0.14);
      --text-pri: #ececec;
      --text-sec: #b4b4b4;
      --text-muted: #8e8ea0;
      --accent-green: #10a37f;
      --danger: #ef4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --app-h: 100dvh;
      --kb-open: 0;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-h, 100dvh);
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg-main);
      color: var(--text-pri);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; }

    /* ── ChatGPT Mobile Minimalist Top Bar ── */
    .topbar {
      height: calc(var(--safe-top) + 52px);
      padding: var(--safe-top) 10px 0;
      background: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
      flex-shrink: 0;
    }

    .nav-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-pri);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.15s;
    }
    .nav-icon-btn:hover { background: rgba(255, 255, 255, 0.06); }
    .nav-icon-btn:active { background: rgba(255, 255, 255, 0.1); }

    .conn-dot {
      position: absolute;
      top: 9px;
      right: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
    }
    .conn-dot.online { background: var(--accent-green); }
    .conn-dot.offline { background: var(--danger); }

    .center-model-btn {
      border: none;
      background: transparent;
      color: var(--text-pri);
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      max-width: 68vw;
      transition: background 0.15s;
    }
    .center-model-btn:hover { background: rgba(255, 255, 255, 0.06); }

    .header-title-row {
      display: flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
    }
    .header-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-chevron {
      color: var(--text-muted);
      font-size: 12px;
      flex-shrink: 0;
    }
    .header-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      margin-top: 1px;
    }

    .right-nav-group { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }

    /* ── Slide-Over Left Drawer Sidebar (Authentic ChatGPT Mobile) ── */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .drawer-backdrop.show { opacity: 1; pointer-events: auto; }

    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(84vw, 316px);
      background: var(--bg-sidebar);
      z-index: 46;
      transform: translateX(-102%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 12px) 10px calc(var(--safe-bot) + 12px);
      border-right: 1px solid var(--border-subtle);
    }
    .sidebar-drawer.show { transform: translateX(0); }

    .drawer-search-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 0 4px 10px;
    }
    .drawer-search {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text-pri);
      font-size: 14px;
      outline: none;
    }
    .drawer-search::placeholder { color: var(--text-muted); }
    .drawer-search:focus { border-color: var(--border-med); }

    .drawer-menu-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 10px;
    }
    .drawer-menu-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-pri);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
    }
    .drawer-menu-item:hover, .drawer-menu-item:active { background: var(--bg-surface); }
    .drawer-menu-icon {
      width: 22px;
      text-align: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .drawer-tabs {
      display: flex;
      gap: 5px;
      padding: 0 4px 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .drawer-tabs::-webkit-scrollbar { display: none; }
    .drawer-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .drawer-tab.active {
      background: var(--bg-surface);
      color: var(--text-pri);
    }

    .drawer-conv-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .drawer-conv-list::-webkit-scrollbar { width: 4px; }
    .drawer-conv-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }

    .conv-group-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 10px 12px 4px;
    }

    .conv-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-pri);
      padding: 9px 12px;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .conv-item:hover { background: rgba(255, 255, 255, 0.05); }
    .conv-item.active { background: var(--bg-surface); }

    .conv-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .conv-item-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-sec);
      flex-shrink: 0;
    }
    .conv-tag.codex { color: #6ee7b7; background: rgba(16, 163, 127, 0.16); }
    .conv-tag.ide { color: #93c5fd; background: rgba(59, 130, 246, 0.15); }
    .conv-tag.run { color: #34d399; background: rgba(16, 185, 129, 0.2); }
    .conv-item-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
    }

    /* ── Main Chat Stream (Authentic ChatGPT Mobile Editorial Flow) ── */
    .chat-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      -webkit-overflow-scrolling: touch;
    }
    .chat-scroll > * {
      width: 100%;
      max-width: 768px;
      margin-left: auto;
      margin-right: auto;
    }
    .chat-scroll::-webkit-scrollbar { width: 5px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 999px; }

    .load-more-bar { text-align: center; }
    .load-more-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-sec);
      font-size: 12.5px;
      padding: 7px 16px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* ChatGPT Minimalist Empty State */
    .empty-hero {
      margin-top: auto;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 12px;
    }
    .hero-logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #ffffff;
      color: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .empty-hero h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-pri);
      margin: 0 0 22px;
      letter-spacing: -0.2px;
    }
    .suggestion-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 480px;
    }
    .suggest-pill {
      border: 1px solid var(--border-med);
      background: transparent;
      color: var(--text-sec);
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .suggest-pill:hover, .suggest-pill:active {
      background: var(--bg-surface);
      color: var(--text-pri);
    }

    /* User Message: Right-aligned #2F2F2F Pill */
    .msg-row { display: flex; flex-direction: column; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.user .user-pill {
      max-width: min(80%, 540px);
      background: var(--bg-surface);
      color: var(--text-pri);
      padding: 10px 16px;
      border-radius: 22px;
      font-size: 15.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    /* Assistant Message: Full-width Borderless Editorial Flow (True ChatGPT Mobile!) */
    .msg-row.assistant { align-items: flex-start; }
    .asst-body {
      width: 100%;
      color: var(--text-pri);
      font-size: 15.5px;
      line-height: 1.68;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .asst-body p { margin: 0 0 12px; }
    .asst-body p:last-child { margin-bottom: 0; }
    .asst-body h1, .asst-body h2, .asst-body h3, .asst-body h4 {
      margin: 18px 0 8px;
      line-height: 1.35;
      font-weight: 600;
      color: #ffffff;
    }
    .asst-body h1 { font-size: 20px; }
    .asst-body h2 { font-size: 18px; }
    .asst-body h3, .asst-body h4 { font-size: 16px; }
    .asst-body ul, .asst-body ol { margin: 8px 0 12px; padding-left: 22px; }
    .asst-body li { margin: 5px 0; }
    .asst-body blockquote {
      margin: 10px 0;
      padding: 4px 0 4px 14px;
      border-left: 3px solid rgba(255, 255, 255, 0.25);
      color: var(--text-sec);
    }
    .asst-body hr { border: none; border-top: 1px solid var(--border-subtle); margin: 16px 0; }
    .asst-body a { color: #60a5fa; text-decoration: underline; text-underline-offset: 3px; }
    .asst-body strong { color: #ffffff; font-weight: 600; }

    .asst-body code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 5px;
      font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 13.5px;
      color: #ececec;
    }

    /* ChatGPT Code Block with #2F2F2F Header Bar */
    .code-card {
      margin: 12px 0;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-code);
      border: 1px solid var(--border-subtle);
    }
    .code-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      background: var(--bg-code-hdr);
      color: var(--text-sec);
      font-size: 12px;
    }
    .copy-code-btn {
      background: none;
      border: none;
      color: var(--text-sec);
      font-size: 12px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .copy-code-btn:active { color: #fff; background: rgba(255,255,255,0.1); }
    .code-card pre {
      margin: 0;
      padding: 12px 14px;
      overflow-x: auto;
    }
    .code-card pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.55;
      color: #e5e7eb;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid var(--border-med);
      -webkit-overflow-scrolling: touch;
    }
    .asst-body table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 260px; }
    .asst-body th, .asst-body td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }
    .asst-body th { background: var(--bg-surface); font-weight: 600; white-space: nowrap; }
    .asst-body tr:last-child td { border-bottom: none; }

    /* Inline Screenshots & Attachments */
    .media-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    .chat-img {
      max-width: min(100%, 520px);
      max-height: 380px;
      border-radius: 14px;
      border: 1px solid var(--border-med);
      cursor: zoom-in;
      object-fit: contain;
      background: #0d0d0d;
      display: block;
    }
    .file-card {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-med);
      border-radius: 12px;
      color: var(--text-pri);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
    }

    /* Subtle ChatGPT Action Row under Assistant Turn */
    .msg-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .msg-act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .msg-act-btn:hover, .msg-act-btn:active {
      color: var(--text-pri);
      background: rgba(255, 255, 255, 0.06);
    }

    /* ChatGPT Pulsing Dot Cursor */
    .gpt-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--text-pri);
      margin-left: 4px;
      vertical-align: middle;
      animation: pulseDot 1s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(0.75); opacity: 0.45; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    /* Floating Down Arrow Pill (ChatGPT Mobile Exact Style) */
    .jump-bottom-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      z-index: 15;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--border-med);
      color: var(--text-pri);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .jump-bottom-btn.show { display: inline-flex; }

    /* ── Pending Attachments Strip ── */
    .att-strip {
      display: none;
      gap: 8px;
      padding: 6px 14px 2px;
      overflow-x: auto;
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      flex-shrink: 0;
    }
    .att-badge {
      background: var(--bg-surface);
      border: 1px solid var(--border-med);
      color: var(--text-pri);
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .att-badge button {
      background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 0;
    }

    /* ── Authentic ChatGPT Mobile Bottom Composer ── */
    .composer-outer {
      padding: 6px 12px calc((1 - var(--kb-open, 0)) * var(--safe-bot) + 10px);
      background: var(--bg-main);
      flex-shrink: 0;
      position: relative;
    }
    .composer-row {
      max-width: 768px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .plus-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--bg-surface);
      color: var(--text-pri);
      font-size: 22px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-bottom: 2px;
      transition: background 0.15s, transform 0.14s;
    }
    .plus-btn:active { transform: scale(0.94); background: var(--bg-surface-hover); }

    .composer-pill {
      flex: 1;
      min-width: 0;
      background: var(--bg-surface);
      border-radius: 24px;
      padding: 5px 6px 5px 16px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .input-box {
      flex: 1;
      background: transparent;
      border: none;
      padding: 7px 0;
      color: var(--text-pri);
      font-size: 16px; /* Prevents iOS auto-zoom */
      line-height: 1.42;
      max-height: 136px;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    .input-box::placeholder { color: var(--text-muted); }

    .mic-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-sec);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mic-btn.recording {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.12s;
    }
    .send-btn.empty:not(.stop) {
      opacity: 0.32;
    }
    .send-btn:active { transform: scale(0.92); }

    /* Plus Action Popover Menu */
    .plus-popover {
      position: fixed;
      left: 12px;
      bottom: calc((1 - var(--kb-open, 0)) * var(--safe-bot) + 62px);
      width: 230px;
      background: #2a2a2a;
      border: 1px solid var(--border-med);
      border-radius: 18px;
      padding: 6px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55);
      z-index: 42;
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .plus-popover.show { display: flex; }
    .pop-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-pri);
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 14.5px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
    }
    .pop-item:hover, .pop-item:active { background: rgba(255, 255, 255, 0.08); }

    /* ── Clean Modals & Bottom Sheets ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

<script>
(() => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  const $ = (id) => document.getElementById(id);
  const chatScroll = $('chatScroll');
  const msgInput = $('msgInput');
  const sendBtn = $('sendBtn');
  const connDot = $('connDot');
  const subInfo = $('subInfo');
  const jumpBottomBtn = $('jumpBottomBtn');
  const sidebarDrawer = $('sidebarDrawer');
  const drawerBackdrop = $('drawerBackdrop');
  const plusPopover = $('plusPopover');

  // Extract ?token= from QR scan URL & clean address bar immediately
  const urlParams = new URLSearchParams(location.search);
  const urlToken = urlParams.get('token');
  if (urlToken) {
    try { localStorage.setItem('agy_pwa_token', urlToken.trim()); } catch (_) {}
    history.replaceState({}, '', location.pathname);
  }

  let token = '';
  try { token = localStorage.getItem('agy_pwa_token') || ''; } catch (_) {}

  function syncManifestToken() {
    const link = $('manifestLink');
    if (link) {
      link.href = token ? `/manifest.json?token=${encodeURIComponent(token)}` : '/manifest.json';
    }
  }
  syncManifestToken();

  try {
    const savedDraft = localStorage.getItem('agy_pwa_draft');
    if (savedDraft) msgInput.value = savedDraft;
  } catch (_) {}

  // Mobile Virtual Keyboard Viewport Adaptation
  function updateVisualViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    const h = Math.round(vv.height);
    const kbOpen = (window.innerHeight - h) > 110 ? 1 : 0;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    document.documentElement.style.setProperty('--kb-open', String(kbOpen));
    if (window.scrollY !== 0) window.scrollTo(0, 0);
    if (kbOpen) scrollToBottom(false);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateVisualViewport);
    window.visualViewport.addEventListener('scroll', updateVisualViewport);
    updateVisualViewport();
  }
  msgInput.addEventListener('blur', () => {
    setTimeout(() => {
      if (window.scrollY !== 0) window.scrollTo(0, 0);
      updateVisualViewport();
    }, 80);
  });

  let ws = null;
  let reconnectTimer = null;
  let reconnectAttempt = 0;
  let pongWatchdog = null;
  let isStreaming = false;
  let liveScreenOn = false;
  let pendingAttachments = [];
  let pingTimer = null;
  let lastRttMs = null;
  let optimisticWaitRowId = null;
  let activeSlot = '';
  let activeConvId = '';
  let activeConvStore = '';
  let currentModelLabel = '';
  let hasMoreHistory = false;
  let totalConvMessages = 0;
  let allConvItems = [];
  let convFilter = 'all';
  let convQuery = '';

  let wsTab = 'git';
  let currentRelDir = '';
  let latestWsData = null;

  const streamBuffers = new Map();
  const rawMessageTexts = new Map();
  const renderedIds = new Set();

  function showToast(text, ms = 2400) {
    const el = $('toast');
    el.textContent = text;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, ms);
  }

  function openDrawer() {
    plusPopover.classList.remove('show');
    sidebarDrawer.classList.add('show');
    drawerBackdrop.classList.add('show');
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'list_conversations' }));
    }
  }
  function closeDrawer() {
    sidebarDrawer.classList.remove('show');
    drawerBackdrop.classList.remove('show');
  }

  // Edge swipe gesture to open/close left sidebar drawer (like native ChatGPT iOS/Android)
  let touchStartX = 0;
  let touchStartY = 0;
  document.addEventListener('touchstart', (e) => {
    if (!e.touches || e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!e.changedTouches || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (dy > 60) return;
    if (!sidebarDrawer.classList.contains('show') && touchStartX < 28 && dx > 65) {
      openDrawer();
    } else if (sidebarDrawer.classList.contains('show') && dx < -65) {
      closeDrawer();
    }
  }, { passive: true });

  async function copyTextSafe(text, btnEl, okLabel = '已复制') {
    const orig = btnEl ? btnEl.textContent : '';
    let copied = false;
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (_) {}
    }
    if (!copied) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        copied = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (_) {}
    }
    if (copied && btnEl) {
      btnEl.textContent = okLabel;
      setTimeout(() => { btnEl.textContent = orig; }, 1600);
    } else if (!copied) {
      showToast('复制失败，请长按文本复制');
    }
  }

  function mediaUrl(mediaId) {
    const base = `/dl/${encodeURIComponent(mediaId)}`;
    return token ? `${base}?token=${encodeURIComponent(token)}` : base;
  }

  function shortModelName(m) {
    if (!m) return 'Sonnet 5.5';
    if (m.includes('电脑端')) return m;
    if (m.includes('sonnet') && m.includes('low')) return 'Sonnet 极速';
    if (m.includes('sonnet')) return 'Sonnet 5.5';
    if (m.includes('opus')) return 'Opus 5.5';
    if (m.includes('gemini-4')) return 'Gemini 4';
    if (m.includes('flash')) return 'Flash';
    return m.split('-').slice(0, 2).join(' ');
  }

  function refreshHeaderSubtitle() {
    const wsName = subInfo.dataset.wsName || '';
    const mShort = shortModelName(currentModelLabel);
    const storeTag = activeConvStore === 'ide' ? 'Antigravity 电脑端 · ' : (activeConvStore === 'codex' ? 'Codex 电脑端 · ' : '');
    const rttTag = lastRttMs ? ` · ${lastRttMs}ms` : '';
    subInfo.textContent = `${storeTag}${mShort}${wsName ? ' · ' + wsName : ''}${rttTag}`;

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatInlineMarkdown(escapedLine) {
    const codeSlots = [];
    let s = escapedLine.replace(/`([^`\n]+)`/g, (_, code) => {
      const idx = codeSlots.push(`<code>${code}</code>`) - 1;
      return `\x00C${idx}\x00`;
    });
    // Markdown images pointing to http/https or /dl/
    s = s.replace(/!\[([^\]]*)\]\(((?:https?:\/\/|\/dl\/)[^\s)]+)\)/g, (_, alt, url) => {
      const idx = codeSlots.push(`<img class="chat-img" src="${url}" alt="${alt}" />`) - 1;
      return `\x00C${idx}\x00`;
    });
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
      const idx = codeSlots.push(`<a href="${url}" target="_blank" rel="noopener">${label}</a>`) - 1;
      return `\x00C${idx}\x00`;
    });
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\x00C(\d+)\x00/g, (_, idx) => codeSlots[Number(idx)] || '');
    return s;
  }

  function renderMarkdownBlocks(textBlock) {
    const lines = textBlock.split('\n');
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const rawLine = lines[i];
      const trimmed = rawLine.trim();
      if (!trimmed) { i++; continue; }

      if (/^(-{3,}|\*{3,})$/.test(trimmed)) {
        out.push('<hr/>');
        i++;
        continue;
      }

      const hm = trimmed.match(/^(#{1,4})\s+(.+)$/);
      if (hm) {
        const lvl = hm[1].length;
        out.push(`<h${lvl}>${formatInlineMarkdown(escapeHtml(hm[2]))}</h${lvl}>`);
        i++;
        continue;
      }

      if (trimmed.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i + 1])) {
        const parseCells = (rowStr) => rowStr.trim().replace(/^\||\|$/g, '').split('|').map((c) => formatInlineMarkdown(escapeHtml(c.trim())));
        const headers = parseCells(rawLine);
        i += 2;
        const bodyRows = [];
        while (i < lines.length && lines[i].trim().includes('|')) {
          bodyRows.push(parseCells(lines[i]));
          i++;
        }
        const thHtml = headers.map((h) => `<th>${h}</th>`).join('');
        const tbHtml = bodyRows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
        out.push(`<div class="table-wrap"><table><thead><tr>${thHtml}</tr></thead><tbody>${tbHtml}</tbody></table></div>`);
        continue;
      }

      if (trimmed.startsWith('&gt;') || trimmed.startsWith('>')) {
        const qLines = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          qLines.push(formatInlineMarkdown(escapeHtml(lines[i].replace(/^\s*>\s?/, ''))));
          i++;
        }
        out.push(`<blockquote>${qLines.join('<br/>')}</blockquote>`);
        continue;
      }

      if (/^\s*[-*•]\s+/.test(rawLine)) {
        const items = [];
        while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
          items.push(`<li>${formatInlineMarkdown(escapeHtml(lines[i].replace(/^\s*[-*•]\s+/, '')))}</li>`);
          i++;
        }
        out.push(`<ul>${items.join('')}</ul>`);
        continue;
      }

      if (/^\s*\d+\.\s+/.test(rawLine)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          items.push(`<li>${formatInlineMarkdown(escapeHtml(lines[i].replace(/^\s*\d+\.\s+/, '')))}</li>`);
          i++;
        }
        out.push(`<ol>${items.join('')}</ol>`);
        continue;
      }

      const pLines = [];
      while (
        i < lines.length &&
        lines[i].trim() &&
        !/^(#{1,4}\s+|-{3,}$|\*{3,}$|\s*[-*•]\s+|\s*\d+\.\s+|\s*>)/.test(lines[i])
      ) {
        pLines.push(formatInlineMarkdown(escapeHtml(lines[i])));
        i++;
      }
      if (pLines.length) out.push(`<p>${pLines.join('<br/>')}</p>`);
      else i++;
    }
    return out.join('');
  }

  function renderRichText(raw) {
    if (!raw) return '';
    const parts = String(raw).split(/(```[\s\S]*?```)/g);
    return parts.map((part) => {
      if (part.startsWith('```') && part.endsWith('```')) {
        const lines = part.slice(3, -3).split('\n');
        let lang = 'code';
        if (lines.length > 1 && /^[a-zA-Z0-9_+-]+$/.test(lines[0].trim())) {
          lang = lines.shift().trim();
        } else if (lines.length > 1 && !lines[0].trim()) {
          lines.shift();
        }
        const code = escapeHtml(lines.join('\n').trim());
        return `<div class="code-card"><div class="code-hdr"><span>${escapeHtml(lang)}</span><button type="button" class="copy-code-btn">复制代码</button></div><pre><code>${code}</code></pre></div>`;
      }
      return renderMarkdownBlocks(part);
    }).join('');
  }

  chatScroll.addEventListener('click', (e) => {
    const sug = e.target.closest('.suggest-pill');
    if (sug) {
      if (sug.dataset.cmd) sendChat(sug.dataset.cmd);
      else if (sug.dataset.act === 'chats') openDrawer();
      else if (sug.dataset.act === 'files') openWsModal();
      else if (sug.dataset.act === 'desktop') openDesktopModal();
      return;
    }
    const zoomImg = e.target.closest('.chat-img');
    if (zoomImg && zoomImg.src) {
      openLightbox(zoomImg.src);
      return;
    }
    const codeBtn = e.target.closest('.copy-code-btn');
    if (codeBtn) {
      const card = codeBtn.closest('.code-card');
      const codeEl = card && card.querySelector('code');
      if (codeEl) copyTextSafe(codeEl.innerText, codeBtn, '已复制');
      return;
    }
    const msgBtn = e.target.closest('.copy-msg-btn');
    if (msgBtn && msgBtn.dataset.mid) {
      const rawTxt = rawMessageTexts.get(msgBtn.dataset.mid) || '';
      if (rawTxt) copyTextSafe(rawTxt, msgBtn, '已复制');
    }
  });

  function isNearBottom(threshold = 150) {
    return chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < threshold;
  }

  function updateJumpButton() {
    if (isNearBottom(220)) jumpBottomBtn.classList.remove('show');
    else jumpBottomBtn.classList.add('show');
  }
  chatScroll.addEventListener('scroll', updateJumpButton, { passive: true });
  jumpBottomBtn.onclick = () => {
    chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: 'smooth' });
  };

  function scrollToBottom(force = false) {
    if (force || isNearBottom(160)) {
      chatScroll.scrollTop = chatScroll.scrollHeight;
      jumpBottomBtn.classList.remove('show');
    } else {
      updateJumpButton();
    }
  }

  function hideHero() {
    const hero = $('emptyHero');
    if (hero) hero.style.display = 'none';
  }

  function buildHeroHtml() {
    return `
      <div id="emptyHero" class="empty-hero">
        <div class="hero-logo">✦</div>
        <h2>有什么可以帮你的？</h2>
        <div class="suggestion-pills">
          <button class="suggest-pill" data-act="chats">💬 接力电脑会话</button>
          <button class="suggest-pill" data-cmd="/screen">📸 截取电脑画面</button>
          <button class="suggest-pill" data-act="files">📂 查看代码改动</button>
          <button class="suggest-pill" data-act="desktop">🖥 实时远程桌面</button>
        </div>
      </div>`;
  }

  function refreshSendBtnVisual() {
    const hasText = Boolean(msgInput.value.trim()) || pendingAttachments.length > 0;
    $('sendIconUp').style.display = isStreaming ? 'none' : 'block';
    $('sendIconStop').style.display = isStreaming ? 'block' : 'none';
    if (isStreaming) {
      sendBtn.classList.add('stop');
      sendBtn.classList.remove('empty');
      sendBtn.title = '停止生成';
    } else {
      sendBtn.classList.remove('stop');
      sendBtn.classList.toggle('empty', !hasText);
      sendBtn.title = '发送';
    }
  }

  function setStreamingState(active) {
    isStreaming = active;
    refreshSendBtnVisual();
  }

  function appendUserBubble(item, autoScroll = true) {
    if (item.id && renderedIds.has(item.id)) return;
    if (item.id) renderedIds.add(item.id);
    hideHero();
    const row = document.createElement('div');
    row.className = 'msg-row user';
    if (item.attachments && item.attachments.length) {
      const grid = document.createElement('div');
      grid.className = 'media-grid';
      grid.style.marginBottom = item.text ? '8px' : '0';
      item.attachments.forEach((a) => {
        if (a.is_image && a.media_id) {
          const img = document.createElement('img');
          img.className = 'chat-img';
          img.src = mediaUrl(a.media_id);
          grid.appendChild(img);
        } else if (a.media_id) {
          const link = document.createElement('a');
          link.className = 'file-card';
          link.href = mediaUrl(a.media_id);
          link.textContent = '📎 ' + (a.name || '附件');
          grid.appendChild(link);
        }
      });
      row.appendChild(grid);
    }
    if (item.text) {
      const pill = document.createElement('div');
      pill.className = 'user-pill';
      pill.textContent = item.text;
      row.appendChild(pill);
    }
    chatScroll.appendChild(row);
    if (autoScroll) scrollToBottom(true);
  }

  function ensureAssistantRow(id) {
    let row = document.getElementById('row-' + id);
    if (!row) {
      hideHero();
      row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.id = 'row-' + id;
      row.innerHTML = `<div class="asst-body" id="bub-${id}"><span class="gpt-dot"></span></div><div class="msg-actions" id="act-${id}" style="display:none"><button type="button" class="msg-act-btn copy-msg-btn" data-mid="${escapeHtml(id)}">复制</button></div>`;
      chatScroll.appendChild(row);
    }
    return row;
  }

  function finalizeAssistantBubble(item, autoScroll = true) {
    renderedIds.add(item.id);
    rawMessageTexts.set(item.id, item.text || '');
    ensureAssistantRow(item.id);
    const bub = document.getElementById('bub-' + item.id);
    const act = document.getElementById('act-' + item.id);
    bub.innerHTML = renderRichText(item.text || '');

    if (item.images && item.images.length) {
      const grid = document.createElement('div');
      grid.className = 'media-grid';
      item.images.forEach((im) => {
        const img = document.createElement('img');
        img.className = 'chat-img';
        img.src = mediaUrl(im.media_id);
        img.alt = im.name || '截图';
        grid.appendChild(img);
      });
      bub.appendChild(grid);
    }
    if (item.files && item.files.length) {
      item.files.forEach((f) => {
        const a = document.createElement('a');
        a.className = 'file-card';
        a.href = mediaUrl(f.media_id);
        a.download = f.name || '';
        const kb = f.size ? ` (${(f.size / 1024).toFixed(1)} KB)` : '';
        a.textContent = `📥 下载 ${f.name || '文件'}${kb}`;
        bub.appendChild(a);
      });
    }
    if (act && item.text) act.style.display = 'flex';
    if (autoScroll) scrollToBottom();
  }

  function renderHistoryBatch(hist, preserveScroll = false) {
    const wasNearBottom = isNearBottom(180);
    const prevScrollHeight = chatScroll.scrollHeight;
    const prevScrollTop = chatScroll.scrollTop;
    chatScroll.innerHTML = '';
    renderedIds.clear();
    streamBuffers.clear();
    rawMessageTexts.clear();
    if (!hist || !hist.length) return;

    if (hasMoreHistory && activeConvId) {
      const bar = document.createElement('div');
      bar.className = 'load-more-bar';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'load-more-btn';
      btn.textContent = `加载更早消息（共约 ${totalConvMessages} 条）`;
      btn.onclick = () => {
        if (!ws || ws.readyState !== 1) return;
        btn.textContent = '正在加载...';
        ws.send(JSON.stringify({
          type: 'select_conversation',
          conversation_id: activeConvId,
          store: activeConvStore || 'auto',
          only_refresh: true,
          max_messages: 2500,
        }));
      };
      bar.appendChild(btn);
      chatScroll.appendChild(bar);
    }

    hist.forEach((h) => {
      if (h.role === 'user') appendUserBubble(h, false);
      else finalizeAssistantBubble(h, false);
    });

    if (!preserveScroll || wasNearBottom) {
      scrollToBottom(true);
    } else {
      const deltaH = chatScroll.scrollHeight - prevScrollHeight;
      chatScroll.scrollTop = Math.max(0, prevScrollTop + (deltaH > 0 ? deltaH : 0));
      updateJumpButton();
    }
  }

  function restoreInflightStream(inf) {
    if (!inf || !inf.msg_id) return;
    clearOptimisticPlaceholder();
    setStreamingState(true);
    const curText = inf.text || '';
    streamBuffers.set(inf.msg_id, curText);
    rawMessageTexts.set(inf.msg_id, curText);
    ensureAssistantRow(inf.msg_id);
    const bub = document.getElementById('bub-' + inf.msg_id);
    if (bub) {
      if (curText) {
        bub.innerHTML = renderRichText(curText) + '<span class="gpt-dot"></span>';
      } else if (inf.status) {
        bub.innerHTML = `<span style="color:var(--text-muted);font-size:14px">${escapeHtml(inf.status)}</span><span class="gpt-dot"></span>`;
      }
    }
    scrollToBottom(true);
  }

  function clearPongWatchdog() {
    if (pongWatchdog) {
      clearTimeout(pongWatchdog);
      pongWatchdog = null;
    }
  }

  function notifyReplyFinished(previewText) {
    if (navigator.vibrate) {
      try { navigator.vibrate(12); } catch (_) {}
    }
    if (document.visibilityState === 'hidden') {
      document.title = '● 新回复 · 反重力助手';
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification('反重力助手', {
            body: String(previewText || '已完成图片或文件生成').slice(0, 80),
            icon: '/icon-192.png',
          });
        } catch (_) {}
      }
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') document.title = '反重力助手';
  });

  function connect() {
    clearTimeout(reconnectTimer);
    clearPongWatchdog();
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const qs = token ? `?token=${encodeURIComponent(token)}` : '';
    ws = new WebSocket(`${proto}//${location.host}/ws${qs}`);

    ws.onopen = () => {
      reconnectAttempt = 0;
      connDot.className = 'conn-dot online';
      $('authModal').classList.remove('show');
      clearInterval(pingTimer);
      const sendPing = () => {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'ping', ts: Date.now() }));
        }
      };
      sendPing();
      pingTimer = setInterval(sendPing, 8000);
      ws.send(JSON.stringify({ type: 'list_conversations' }));
      if (liveScreenOn && $('deskModal').classList.contains('show')) {
        ws.send(JSON.stringify({ type: 'live_screen', enable: true, interval_ms: 1600 }));
      }
    };

    ws.onmessage = (ev) => {
      clearPongWatchdog();
      const data = JSON.parse(ev.data);
      if (data.type === 'pong' && data.ts) {
        lastRttMs = Math.max(1, Date.now() - Number(data.ts));
        refreshHeaderSubtitle();
        return;
      }
      if (data.type === 'hello') {
        activeSlot = data.slot || '';
        currentModelLabel = data.model || '';
        activeConvId = data.active_conversation_id || '';
        activeConvStore = data.active_store || '';
        if (data.active_title) $('headerTitle').textContent = data.active_title;
        subInfo.dataset.wsName = (data.workspace || '').split(/[\\/]/).pop() || '';
        refreshHeaderSubtitle();
        setStreamingState(Boolean(data.busy));
        if (Array.isArray(data.history) && data.history.length) {
          renderHistoryBatch(data.history, false);
        }
        if (data.inflight) {
          restoreInflightStream(data.inflight);
        }
      } else if (data.type === 'meta_update') {
        if (data.slot) activeSlot = data.slot;
        if (data.model) currentModelLabel = data.model;
        if (typeof data.active_conversation_id === 'string') activeConvId = data.active_conversation_id;
        if (typeof data.active_store === 'string') activeConvStore = data.active_store;
        if (data.active_title) $('headerTitle').textContent = data.active_title;
        if (data.workspace) subInfo.dataset.wsName = data.workspace.split(/[\\/]/).pop() || '';
        if (typeof data.busy === 'boolean') setStreamingState(data.busy);
        refreshHeaderSubtitle();
      } else if (data.type === 'conversations_list') {
        activeConvId = data.active_id || activeConvId;
        allConvItems = data.items || [];
        updateConvCounts();
        renderConvList();
        renderWorkspaceChips(data.workspaces || [], data.current_workspace || '');
      } else if (data.type === 'conversation_loaded') {
        activeSlot = data.slot || activeSlot;
        activeConvId = data.conversation_id || '';
        activeConvStore = data.store || '';
        hasMoreHistory = Boolean(data.has_more);
        totalConvMessages = Number(data.total_messages || 0);
        $('headerTitle').textContent = data.title || '反重力助手';
        if (data.workspace) subInfo.dataset.wsName = data.workspace.split(/[\\/]/).pop() || '';
        refreshHeaderSubtitle();
        setStreamingState(Boolean(data.busy));
        const hist = data.history || [];
        if (!hist.length && !data.inflight) {
          chatScroll.innerHTML = `<div class="empty-hero"><div class="hero-logo">✦</div><h2>${escapeHtml(data.title || '空会话')}</h2></div>`;
          renderedIds.clear();
          streamBuffers.clear();
        } else {
          renderHistoryBatch(hist, Boolean(data.silent));
        }
        if (data.inflight) {
          restoreInflightStream(data.inflight);
        }
        if (!data.silent) {
          closeDrawer();
        }
      } else if (data.type === 'clear_history') {
        clearOptimisticPlaceholder();
        setStreamingState(false);
        hasMoreHistory = false;
        totalConvMessages = 0;
        activeConvId = '';
        activeConvStore = '';
        $('headerTitle').textContent = '反重力助手';
        refreshHeaderSubtitle();
        chatScroll.innerHTML = buildHeroHtml();
        renderedIds.clear();
        streamBuffers.clear();
        rawMessageTexts.clear();
        closeDrawer();
      } else if (data.type === 'workspace_state') {
        latestWsData = data;
        renderWsInspector();
      } else if (data.type === 'workspace_diff') {
        renderDiffDetail(data);
      } else if (data.type === 'workspace_file') {
        renderFilePreview(data);
      } else if (data.type === 'user_msg') {
        appendUserBubble(data.item);
      } else if (data.type === 'stream_start') {
        clearOptimisticPlaceholder();
        setStreamingState(true);
        streamBuffers.set(data.msg_id, '');
        ensureAssistantRow(data.msg_id);
        scrollToBottom(true);
      } else if (data.type === 'stream_status') {
        ensureAssistantRow(data.msg_id);
        const cur = streamBuffers.get(data.msg_id) || '';
        if (!cur) {
          const bub = document.getElementById('bub-' + data.msg_id);
          if (bub) bub.innerHTML = `<span style="color:var(--text-muted);font-size:14px">${escapeHtml(data.status)}</span><span class="gpt-dot"></span>`;
        }
      } else if (data.type === 'stream_reset') {
        streamBuffers.set(data.msg_id, '');
        const bub = document.getElementById('bub-' + data.msg_id);
        if (bub) bub.innerHTML = '<span class="gpt-dot"></span>';
      } else if (data.type === 'stream_delta') {
        clearOptimisticPlaceholder();
        const cur = (streamBuffers.get(data.msg_id) || '') + data.delta;
        streamBuffers.set(data.msg_id, cur);
        rawMessageTexts.set(data.msg_id, cur);
        ensureAssistantRow(data.msg_id);
        const bub = document.getElementById('bub-' + data.msg_id);
        if (bub) bub.innerHTML = renderRichText(cur) + '<span class="gpt-dot"></span>';
        scrollToBottom();
      } else if (data.type === 'stream_end') {
        clearOptimisticPlaceholder();
        setStreamingState(false);
        streamBuffers.delete(data.item.id);
        finalizeAssistantBubble(data.item);
        notifyReplyFinished(data.item.text || '');
      } else if (data.type === 'desktop_frame') {
        const sep = mediaUrl(data.media_id).includes('?') ? '&' : '?';
        const u = mediaUrl(data.media_id) + sep + '_t=' + data.ts;
        $('deskImg').src = u;
        $('deskTs').textContent = '更新于 ' + new Date(data.ts).toLocaleTimeString() + ' · 点击画面可全屏缩放';
      } else if (data.type === 'upload_done') {
        pendingAttachments.push(data);
        renderPendingAttachments();
        refreshSendBtnVisual();
        showToast(`已添加：${data.name}`);
      } else if (data.type === 'toast') {
        showToast(data.text);
      }
    };

    ws.onclose = (ev) => {
      clearInterval(pingTimer);
      clearPongWatchdog();
      ws = null;
      connDot.className = 'conn-dot offline';
      setStreamingState(false);
      if (ev.code === 4001) {
        subInfo.textContent = '需要验证访问密钥';
        try { localStorage.removeItem('agy_pwa_token'); } catch (_) {}
        token = '';
        syncManifestToken();
        $('authModal').classList.add('show');
        return;
      }
      const delay = Math.min(3500, 450 * Math.pow(1.45, reconnectAttempt++));
      subInfo.textContent = '正在重连...';
      reconnectTimer = setTimeout(connect, delay);
    };
  }

  function handleAppWakeup() {
    if (document.visibilityState === 'hidden') return;
    if ($('authModal').classList.contains('show')) return;
    if (!ws || ws.readyState === 2 || ws.readyState === 3) {
      reconnectAttempt = 0;
      connect();
      return;
    }
    if (ws.readyState === 1) {
      clearPongWatchdog();
      try {
        ws.send(JSON.stringify({ type: 'ping', ts: Date.now() }));
        // Never refresh/overwrite DOM while streaming!
        if (!isStreaming && (activeConvStore === 'ide' || activeConvStore === 'codex') && activeConvId) {
          ws.send(JSON.stringify({
            type: 'refresh_conversation',
            conversation_id: activeConvId,
            store: activeConvStore,
          }));
        }
      } catch (_) {}
      pongWatchdog = setTimeout(() => {
        if (ws) {
          try { ws.close(); } catch (_) {}
          ws = null;
        }
        reconnectAttempt = 0;
        connect();
      }, 2200);
    }
  }
  document.addEventListener('visibilitychange', handleAppWakeup);
  window.addEventListener('pageshow', handleAppWakeup);
  window.addEventListener('online', handleAppWakeup);
  window.addEventListener('focus', handleAppWakeup);

  function renderPendingAttachments() {
    const strip = $('attStrip');
    if (!pendingAttachments.length) {
      strip.style.display = 'none';
      strip.innerHTML = '';
      return;
    }
    strip.style.display = 'flex';
    strip.innerHTML = '';
    pendingAttachments.forEach((a, idx) => {
      const b = document.createElement('span');
      b.className = 'att-badge';
      b.innerHTML = `${a.is_image ? '🖼' : '📄'} ${escapeHtml(a.name)} <button type="button">✕</button>`;
      b.querySelector('button').onclick = () => {
        pendingAttachments.splice(idx, 1);
        renderPendingAttachments();
        refreshSendBtnVisual();
      };
      strip.appendChild(b);
    });
  }

  async function uploadFile(file) {
    if (!ws || ws.readyState !== 1) return showToast('尚未连接服务器');
    const uid = Math.random().toString(36).slice(2, 10);
    showToast(`正在上传 ${file.name}...`);
    ws.send(JSON.stringify({ type: 'upload_init', upload_id: uid, name: file.name, size: file.size }));

    const chunkSize = 384 * 1024;
    for (let offset = 0; offset < file.size; offset += chunkSize) {
      const slice = file.slice(offset, offset + chunkSize);
      const buf = await slice.arrayBuffer();
      let binary = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      ws.send(JSON.stringify({ type: 'upload_chunk', upload_id: uid, data: btoa(binary) }));
    }
    ws.send(JSON.stringify({ type: 'upload_complete', upload_id: uid }));
  }

  function clearOptimisticPlaceholder() {
    if (optimisticWaitRowId) {
      const el = document.getElementById(optimisticWaitRowId);
      if (el) el.remove();
      optimisticWaitRowId = null;
    }
  }

  function showOptimisticPlaceholder() {
    clearOptimisticPlaceholder();
    optimisticWaitRowId = 'opt-wait-' + Date.now();
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = optimisticWaitRowId;
    row.innerHTML = `<div class="asst-body"><span class="gpt-dot"></span></div>`;
    chatScroll.appendChild(row);
    scrollToBottom(true);
  }

  function sendChat(overrideText = null) {
    plusPopover.classList.remove('show');
    if (!ws || ws.readyState !== 1) {
      handleAppWakeup();
      return showToast('正在重连，请稍候...');
    }
    if (isStreaming && overrideText === null) {
      // Stop ONLY the current conversation's stream without losing any text typed in msgInput!
      ws.send(JSON.stringify({ type: 'cancel' }));
      return;
    }
    const text = overrideText !== null ? overrideText : msgInput.value.trim();
    if (!text && !pendingAttachments.length) return;
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
    const clientId = 'u-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const atts = pendingAttachments.splice(0, pendingAttachments.length);

    appendUserBubble({ id: clientId, role: 'user', text, attachments: atts });
    showOptimisticPlaceholder();
    setStreamingState(true);

    ws.send(JSON.stringify({
      type: 'chat',
      client_id: clientId,
      text,
      attachments: atts,
    }));
    renderPendingAttachments();
    if (overrideText === null) {
      msgInput.value = '';
      msgInput.style.height = 'auto';
      try { localStorage.removeItem('agy_pwa_draft'); } catch (_) {}
      refreshSendBtnVisual();
    }
  }

  function openLightbox(src) {
    if (!src) return;
    $('lightboxImg').src = src;
    $('lightbox').classList.add('show');
  }

  // Optional Native Web Speech Voice Input
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRec) {
    const voiceBtn = $('voiceBtn');
    voiceBtn.style.display = 'inline-flex';
    let rec = null;
    let listening = false;
    voiceBtn.onclick = () => {
      if (listening && rec) {
        rec.stop();
        return;
      }
      rec = new SpeechRec();
      rec.lang = 'zh-CN';
      rec.interimResults = false;
      rec.onstart = () => {
        listening = true;
        voiceBtn.classList.add('recording');
        showToast('正在聆听...');
      };
      rec.onresult = (ev) => {
        const transcript = Array.from(ev.results).map((r) => r[0].transcript).join('');
        if (transcript) {
          msgInput.value = (msgInput.value ? msgInput.value + ' ' : '') + transcript;
          msgInput.dispatchEvent(new Event('input'));
        }
      };
      rec.onend = () => { listening = false; voiceBtn.classList.remove('recording'); };
      rec.onerror = () => { listening = false; voiceBtn.classList.remove('recording'); };
      try { rec.start(); } catch (_) {}
    };
  }

  // Event bindings
  $('saveTokenBtn').onclick = () => {
    const v = $('tokenInput').value.trim();
    if (!v) return;
    token = v;
    try { localStorage.setItem('agy_pwa_token', token); } catch (_) {}
    syncManifestToken();
    connect();
  };

  $('menuBtn').onclick = openDrawer;
  drawerBackdrop.onclick = closeDrawer;

  sendBtn.onclick = () => sendChat();
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 136) + 'px';
    try { localStorage.setItem('agy_pwa_draft', msgInput.value); } catch (_) {}
    refreshSendBtnVisual();
  });
  msgInput.addEventListener('focus', () => plusPopover.classList.remove('show'));
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) {
      e.preventDefault();
      if (!isStreaming) sendChat();
    }
  });

  // Plus Button Popover
  $('plusBtn').onclick = (e) => {
    e.stopPropagation();
    plusPopover.classList.toggle('show');
  };
  document.addEventListener('click', (e) => {
    if (!plusPopover.contains(e.target) && e.target !== $('plusBtn')) {
      plusPopover.classList.remove('show');
    }
  });

  $('popUploadBtn').onclick = () => { plusPopover.classList.remove('show'); $('filePicker').click(); };
  $('popShotBtn').onclick = () => { plusPopover.classList.remove('show'); sendChat('/screen'); };
  $('popLiveDeskBtn').onclick = () => { plusPopover.classList.remove('show'); openDesktopModal(); };
  $('popDiffBtn').onclick = () => { plusPopover.classList.remove('show'); openWsModal(); };
  $('popWsSwitchBtn').onclick = () => {
    plusPopover.classList.remove('show');
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'list_conversations' }));
    $('wsPickerModal').classList.add('show');
  };

  $('filePicker').onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    for (const f of files) await uploadFile(f);
  };

  $('syncPcBtn').onclick = () => {
    if (ws && ws.readyState === 1 && activeConvId) {
      showToast('已同步最新对话');
      ws.send(JSON.stringify({
        type: 'refresh_conversation',
        conversation_id: activeConvId,
        store: activeConvStore || 'auto',
      }));
    }
  };

  // Drawer Actions
  function startNewConversation(workspacePath = '') {
    if (!ws || ws.readyState !== 1) return showToast('尚未连接服务器');
    closeDrawer();
    $('wsPickerModal').classList.remove('show');
    ws.send(JSON.stringify({ type: 'new_conversation', workspace: workspacePath }));
  }

  $('newChatTopBtn').onclick = () => startNewConversation('');
  $('drawerNewChatBtn').onclick = () => startNewConversation('');
  $('drawerWsPickerBtn').onclick = () => {
    closeDrawer();
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'list_conversations' }));
    $('wsPickerModal').classList.add('show');
  };
  $('drawerDeskBtn').onclick = () => { closeDrawer(); openDesktopModal(); };
  $('drawerGitBtn').onclick = () => { closeDrawer(); openWsModal(); };

  $('closeWsPickerBtn').onclick = () => $('wsPickerModal').classList.remove('show');
  $('confirmNewChatBtn').onclick = () => startNewConversation($('customWsInput').value.trim());

  function updateConvCounts() {
    const nAll = allConvItems.length;
    const nIde = allConvItems.filter((x) => x.store === 'ide').length;
    const nCodex = allConvItems.filter((x) => x.store === 'codex').length;
    const nCli = allConvItems.filter((x) => x.store === 'cli').length;
    $('cntAll').textContent = nAll ? `(${nAll})` : '';
    $('cntIde').textContent = nIde ? `(${nIde})` : '';
    $('cntCodex').textContent = nCodex ? `(${nCodex})` : '';
    $('cntCli').textContent = nCli ? `(${nCli})` : '';
    $('fltCodexBtn').style.display = nCodex > 0 ? 'inline-block' : 'none';
  }

  function renderWorkspaceChips(workspaces, currentWs) {
    const box = $('wsChips');
    box.innerHTML = '';
    workspaces.forEach((w) => {
      const name = w.split(/[\\/]/).pop() || w;
      const b = document.createElement('button');
      b.className = 'pill-btn';
      if (w === currentWs) b.style.borderColor = '#fff';
      b.textContent = '📁 ' + name;
      b.title = w;
      b.onclick = () => startNewConversation(w);
      box.appendChild(b);
    });
  }

  function dateBucketLabel(tsMs) {
    if (!tsMs) return '更早';
    const now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (tsMs >= startToday) return '今天';
    if (tsMs >= startToday - 86400000) return '昨天';
    if (tsMs >= startToday - 7 * 86400000) return '最近 7 天';
    return '更早';
  }

  function renderConvList() {
    const listEl = $('convList');
    const q = convQuery.trim().toLowerCase();
    const filtered = allConvItems.filter((it) => {
      if (convFilter !== 'all' && it.store !== convFilter) return false;
      if (!q) return true;
      const hay = `${it.title || ''} ${it.preview || ''} ${it.workspace || ''}`.toLowerCase();
      return hay.includes(q);
    });
    if (!filtered.length) {
      listEl.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px">暂无匹配的聊天记录</div>';
      return;
    }
    listEl.innerHTML = '';
    let lastGroup = '';
    filtered.forEach((it) => {
      const grp = dateBucketLabel(it.updated_ms);
      if (grp !== lastGroup) {
        lastGroup = grp;
        const gEl = document.createElement('div');
        gEl.className = 'conv-group-label';
        gEl.textContent = grp;
        listEl.appendChild(gEl);
      }

      const btn = document.createElement('button');
      btn.className = 'conv-item' + (it.conversation_id === activeConvId ? ' active' : '');
      let tagCls = 'conv-tag';
      let tagTxt = '远程';
      if (it.store === 'ide') { tagCls = 'conv-tag ide'; tagTxt = 'Antigravity'; }
      else if (it.store === 'codex') { tagCls = 'conv-tag codex'; tagTxt = 'Codex'; }

      const runHtml = it.running ? '<span class="conv-tag run">运行中</span>' : '';
      const wsShort = it.workspace ? (it.workspace.split(/[\\/]/).pop() || '') : '';
      btn.innerHTML = `
        <div class="conv-item-top">
          <div class="conv-item-title">${escapeHtml(it.title || '未命名对话')}</div>
          <div style="display:flex;gap:4px;flex-shrink:0">${runHtml}<span class="${tagCls}">${tagTxt}</span></div>
        </div>
        <div class="conv-item-sub">
          <span style="overflow:hidden;text-overflow:ellipsis">${escapeHtml(wsShort || it.preview || '')}</span>
          <span style="flex-shrink:0">${escapeHtml(it.updated_human || '')}</span>
        </div>
      `;
      btn.onclick = () => {
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({
          type: 'select_conversation',
          conversation_id: it.conversation_id,
          store: it.store,
          max_messages: 200,
        }));
      };
      listEl.appendChild(btn);
    });
  }

  $('convSearchInput').addEventListener('input', (e) => {
    convQuery = e.target.value || '';
    renderConvList();
  });

  document.querySelectorAll('.drawer-tab').forEach((tb) => {
    tb.onclick = () => {
      convFilter = tb.dataset.f;
      document.querySelectorAll('.drawer-tab').forEach((x) => x.classList.toggle('active', x === tb));
      renderConvList();
    };
  });

  // ── Workspace & Git Diff Inspector ──
  function openWsModal() {
    $('wsModal').classList.add('show');
    requestWsInspect(currentRelDir);
  }
  function requestWsInspect(relDir = '') {
    currentRelDir = relDir;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'workspace_inspect', rel_dir: relDir }));
    }
  }
  $('closeWsBtn').onclick = () => $('wsModal').classList.remove('show');
  $('refreshWsBtn').onclick = () => requestWsInspect(currentRelDir);

  $('wsTabGit').onclick = () => {
    wsTab = 'git';
    $('wsTabGit').style.cssText = 'background:#fff;color:#0d0d0d';
    $('wsTabFiles').style.cssText = '';
    renderWsInspector();
  };
  $('wsTabFiles').onclick = () => {
    wsTab = 'files';
    $('wsTabFiles').style.cssText = 'background:#fff;color:#0d0d0d';
    $('wsTabGit').style.cssText = '';
    renderWsInspector();
  };

  function renderWsInspector() {
    const body = $('wsBody');
    if (!latestWsData) {
      body.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px">正在读取工作区...</div>';
      return;
    }
    const git = latestWsData.git || {};
    const dir = latestWsData.dir || {};
    const changes = git.changes || [];
    $('gitCntBadge').textContent = String(changes.length);
    $('gitBranchLbl').textContent = git.is_git ? `⎇ ${git.branch || 'HEAD'}` : '';
    const wsShort = (latestWsData.workspace || '').split(/[\\/]/).pop() || latestWsData.workspace || '';
    $('wsModalTitle').textContent = wsShort || '工作区';

    body.innerHTML = '';
    if (wsTab === 'git') {
      if (!git.is_git) {
        body.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:26px;font-size:13px">当前目录非 Git 仓库，可切到「目录文件」浏览。</div>';
        return;
      }
      if (!changes.length) {
        body.innerHTML = '<div style="text-align:center;color:var(--text-sec);padding:26px;font-size:13px">✓ 工作区干净，无未提交变更</div>';
        return;
      }
      changes.forEach((ch) => {
        const row = document.createElement('button');
        row.className = 'file-row';
        const stUp = (ch.status || 'M').toUpperCase();
        const stCls = stUp.includes('D') ? 'd' : (stUp.includes('A') || stUp.includes('?') ? 'a' : 'm');
        row.innerHTML = `
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(ch.path)}</span>
          <span class="git-st ${stCls}">${escapeHtml(stUp)}</span>
        `;
        row.onclick = () => {
          if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'workspace_diff', path: ch.path }));
        };
        body.appendChild(row);
      });
    } else {
      const rel = dir.rel_dir || '';
      if (rel) {
        const upBtn = document.createElement('button');
        upBtn.className = 'file-row';
        const parentRel = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
        upBtn.innerHTML = `<span>⬅ 返回上级 (${escapeHtml(rel)})</span><span style="color:var(--text-muted);font-size:11px">上级</span>`;
        upBtn.onclick = () => requestWsInspect(parentRel);
        body.appendChild(upBtn);
      }
      const entries = dir.entries || [];
      entries.forEach((ent) => {
        const row = document.createElement('button');
        row.className = 'file-row';
        const icon = ent.is_dir ? '📁' : '📄';
        const szTxt = ent.is_dir ? '打开' : `${(Number(ent.size || 0) / 1024).toFixed(1)} KB`;
        row.innerHTML = `
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${icon} ${escapeHtml(ent.name)}</span>
          <span style="color:var(--text-muted);font-size:11.5px;flex-shrink:0">${escapeHtml(szTxt)}</span>
        `;
        row.onclick = () => {
          if (ent.is_dir) requestWsInspect(ent.rel_path);
          else if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'workspace_file', path: ent.rel_path }));
        };
        body.appendChild(row);
      });
    }
  }

  function formatDiffHtml(rawDiff) {
    return String(rawDiff || '').split('\n').map((ln) => {
      const esc = escapeHtml(ln);
      if (ln.startsWith('+++') || ln.startsWith('---') || ln.startsWith('@@')) return `<span class="diff-hunk">${esc}</span>`;
      if (ln.startsWith('+')) return `<span class="diff-add">${esc}</span>`;
      if (ln.startsWith('-')) return `<span class="diff-del">${esc}</span>`;
      return esc + '\n';
    }).join('');
  }

  function renderDiffDetail(data) {
    const body = $('wsBody');
    body.innerHTML = '';
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px';
    bar.innerHTML = `<button id="backFromDiff" class="pill-btn">⬅ 返回</button><button id="askReviewBtn" class="pill-btn" style="background:#fff;color:#0d0d0d">让助手审阅此改动</button>`;
    body.appendChild(bar);

    const viewer = document.createElement('div');
    viewer.className = 'diff-viewer';
    viewer.innerHTML = formatDiffHtml(data.diff || '');
    body.appendChild(viewer);

    $('backFromDiff').onclick = renderWsInspector;
    $('askReviewBtn').onclick = () => {
      $('wsModal').classList.remove('show');
      msgInput.value = `请帮我审阅 \`${data.path}\` 的最新代码改动是否有潜在问题：`;
      msgInput.dispatchEvent(new Event('input'));
      msgInput.focus();
    };
  }

  function renderFilePreview(data) {
    const body = $('wsBody');
    body.innerHTML = '';
    if (!data.ok) {
      body.innerHTML = `<div style="color:var(--danger);padding:18px">${escapeHtml(data.error || '无法读取文件')}</div>`;
      return;
    }
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px';
    const dlHtml = data.media_id ? `<a class="pill-btn" href="${mediaUrl(data.media_id)}" download="${escapeHtml(data.name || '')}" style="text-decoration:none">下载</a>` : '';
    bar.innerHTML = `<button id="backFromFile" class="pill-btn">⬅ 返回</button><div style="display:flex;gap:6px">${dlHtml}<button id="quoteFileBtn" class="pill-btn" style="background:#fff;color:#0d0d0d">引用到对话</button></div>`;
    body.appendChild(bar);

    if (data.is_image && data.media_id) {
      const img = document.createElement('img');
      img.className = 'screen-frame';
      img.src = mediaUrl(data.media_id);
      img.onclick = () => openLightbox(img.src);
      body.appendChild(img);
    } else {
      const viewer = document.createElement('div');
      viewer.className = 'diff-viewer';
      viewer.textContent = data.is_binary ? '（二进制文件，请点右上角下载查看）' : (data.content || '');
      body.appendChild(viewer);
    }

    $('backFromFile').onclick = renderWsInspector;
    $('quoteFileBtn').onclick = () => {
      $('wsModal').classList.remove('show');
      msgInput.value = (msgInput.value ? msgInput.value + '\n' : '') + `请查看工作区文件 \`${data.path}\`：`;
      msgInput.dispatchEvent(new Event('input'));
      msgInput.focus();
    };
  }

  // ── Desktop Live Screen ──
  function openDesktopModal() {
    $('deskModal').classList.add('show');
    $('deskTs').textContent = '正在抓取电脑画面...';
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'desktop_frame' }));
  }
  function closeDesktopModal() {
    $('deskModal').classList.remove('show');
    if (liveScreenOn) {
      liveScreenOn = false;
      $('toggleLiveBtn').textContent = '实时跟随';
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'live_screen', enable: false }));
    }
  }
  $('closeDeskBtn').onclick = closeDesktopModal;
  $('refreshDeskBtn').onclick = () => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'desktop_frame' }));
  };
  $('toggleLiveBtn').onclick = () => {
    liveScreenOn = !liveScreenOn;
    $('toggleLiveBtn').textContent = liveScreenOn ? '暂停跟随' : '实时跟随';
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'live_screen', enable: liveScreenOn, interval_ms: 1600 }));
  };
  $('deskImg').onclick = () => openLightbox($('deskImg').src);
  $('lightbox').onclick = () => $('lightbox').classList.remove('show');

  ['deskModal', 'modelModal', 'wsModal', 'wsPickerModal'].forEach((mid) => {
    const el = $(mid);
    el.addEventListener('click', (e) => {
      if (e.target === el) {
        if (mid === 'deskModal') closeDesktopModal();
        else el.classList.remove('show');
      }
    });
  });

  $('modelBtn').onclick = () => $('modelModal').classList.add('show');
  $('closeModelBtn').onclick = () => $('modelModal').classList.remove('show');
  document.querySelectorAll('.model-opt').forEach((opt) => {
    opt.onclick = () => {
      $('modelModal').classList.remove('show');
      sendChat('/model ' + opt.dataset.m);
    };
  });

  if (msgInput.value) {
    msgInput.style.height = Math.min(msgInput.scrollHeight, 136) + 'px';
  }
  refreshSendBtnVisual();
  connect();
})();
</script>
