  function dateBucketLabel(tsMs) {
    if (!tsMs) return '更早';
    const now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (tsMs >= startToday) return '今天';
    if (tsMs >= startToday - 86400000) return '昨天';
    if (tsMs >= startToday - 7 * 86400000) return '最近 7 天';
    return '更早';
  }

  function renderConvList() {
    const listEl = $('convList');
    const q = convQuery.trim().toLowerCase();
    const filtered = allConvItems.filter((it) => {
      if (convFilter !== 'all' && it.store !== convFilter) return false;
      if (!q) return true;
      const hay = `${it.title || ''} ${it.preview || ''} ${it.workspace || ''}`.toLowerCase();
      return hay.includes(q);
    });
    if (!filtered.length) {
      listEl.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px">暂无匹配的聊天记录</div>';
      return;
    }
    listEl.innerHTML = '';
    let lastGroup = '';
    filtered.forEach((it) => {
      const grp = dateBucketLabel(it.updated_ms);
      if (grp !== lastGroup) {
        lastGroup = grp;
        const gEl = document.createElement('div');
        gEl.className = 'conv-group-label';
        gEl.textContent = grp;
        listEl.appendChild(gEl);
      }

      const btn = document.createElement('button');
      btn.className = 'conv-item' + (it.conversation_id === activeConvId ? ' active' : '');
      let tagCls = 'conv-tag';
      let tagTxt = '远程';
      if (it.store === 'ide') { tagCls = 'conv-tag ide'; tagTxt = 'Antigravity'; }
      else if (it.store === 'codex') { tagCls = 'conv-tag codex'; tagTxt = 'Codex'; }

      const runHtml = it.running ? '<span class="conv-tag run">运行中</span>' : '';
      const wsShort = it.workspace ? (it.workspace.split(/[\\/]/).pop() || '') : '';
      btn.innerHTML = `
        <div class="conv-item-top">
          <div class="conv-item-title">${escapeHtml(it.title || '未命名对话')}</div>
          <div style="display:flex;gap:4px;flex-shrink:0">${runHtml}<span class="${tagCls}">${tagTxt}</span></div>
        </div>
        <div class="conv-item-sub">
          <span style="overflow:hidden;text-overflow:ellipsis">${escapeHtml(wsShort || it.preview || '')}</span>
          <span style="flex-shrink:0">${escapeHtml(it.updated_human || '')}</span>
        </div>
      `;
      btn.onclick = () => {
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({
          type: 'select_conversation',
          conversation_id: it.conversation_id,
          store: it.store,
          max_messages: 200,
        }));
      };
      listEl.appendChild(btn);
    });
  }

  $('convSearchInput').addEventListener('input', (e) => {
    convQuery = e.target.value || '';
    renderConvList();
  });

  document.querySelectorAll('.drawer-tab[data-f]').forEach((tb) => {
    tb.onclick = () => {
      convFilter = tb.dataset.f || 'all';
      document.querySelectorAll('.drawer-tab[data-f]').forEach((x) => x.classList.toggle('active', x === tb));
      renderConvList();
    };
  });

  // ── Workspace & Git Diff Inspector ──
  function openWsModal() {
    $('wsModal').classList.add('show');
    requestWsInspect(currentRelDir);
  }
  function requestWsInspect(relDir = '') {
    currentRelDir = relDir;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'workspace_inspect', rel_dir: relDir }));
    }
  }
  $('closeWsBtn').onclick = () => $('wsModal').classList.remove('show');
  $('refreshWsBtn').onclick = () => requestWsInspect(currentRelDir);

  $('wsTabGit').onclick = () => {
    wsTab = 'git';
    $('wsTabGit').style.cssText = 'background:#fff;color:#0d0d0d';
    $('wsTabFiles').style.cssText = '';
    renderWsInspector();
  };
  $('wsTabFiles').onclick = () => {
    wsTab = 'files';
    $('wsTabFiles').style.cssText = 'background:#fff;color:#0d0d0d';
    $('wsTabGit').style.cssText = '';
    renderWsInspector();
  };

  function renderWsInspector() {
    const body = $('wsBody');
    if (!latestWsData) {
      body.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px">正在读取工作区...</div>';
      return;
    }
    const git = latestWsData.git || {};
    const dir = latestWsData.dir || {};
    const changes = git.changes || [];
    $('gitCntBadge').textContent = String(changes.length);
    $('gitBranchLbl').textContent = git.is_git ? `⎇ ${git.branch || 'HEAD'}` : '';
    const wsShort = (latestWsData.workspace || '').split(/[\\/]/).pop() || latestWsData.workspace || '';
    $('wsModalTitle').textContent = wsShort || '工作区';

    body.innerHTML = '';
    if (wsTab === 'git') {
      if (!git.is_git) {
        body.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:26px;font-size:13px">当前目录非 Git 仓库，可切到「目录文件」浏览。</div>';
        return;
      }
      if (!changes.length) {
        body.innerHTML = '<div style="text-align:center;color:var(--text-sec);padding:26px;font-size:13px">✓ 工作区干净，无未提交变更</div>';
        return;
      }
      changes.forEach((ch) => {
        const row = document.createElement('button');
        row.className = 'file-row';
        const stUp = (ch.status || 'M').toUpperCase();
        const stCls = stUp.includes('D') ? 'd' : (stUp.includes('A') || stUp.includes('?') ? 'a' : 'm');
        row.innerHTML = `
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(ch.path)}</span>
          <span class="git-st ${stCls}">${escapeHtml(stUp)}</span>
        `;
        row.onclick = () => {
          if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'workspace_diff', path: ch.path }));
        };
        body.appendChild(row);
      });
    } else {
      const rel = dir.rel_dir || '';
      if (rel) {
        const upBtn = document.createElement('button');
        upBtn.className = 'file-row';
        const parentRel = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
        upBtn.innerHTML = `<span>⬅ 返回上级 (${escapeHtml(rel)})</span><span style="color:var(--text-muted);font-size:11px">上级</span>`;
        upBtn.onclick = () => requestWsInspect(parentRel);
        body.appendChild(upBtn);
      }
      const entries = dir.entries || [];
      entries.forEach((ent) => {
        const row = document.createElement('button');
        row.className = 'file-row';
        const icon = ent.is_dir ? '📁' : '📄';
        const szTxt = ent.is_dir ? '打开' : `${(Number(ent.size || 0) / 1024).toFixed(1)} KB`;
        row.innerHTML = `
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${icon} ${escapeHtml(ent.name)}</span>
          <span style="color:var(--text-muted);font-size:11.5px;flex-shrink:0">${escapeHtml(szTxt)}</span>
        `;
        row.onclick = () => {
          if (ent.is_dir) requestWsInspect(ent.rel_path);
          else if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'workspace_file', path: ent.rel_path }));
        };
        body.appendChild(row);
      });
    }
  }

  function formatDiffHtml(rawDiff) {
    return String(rawDiff || '').split('\n').map((ln) => {
      const esc = escapeHtml(ln);
      if (ln.startsWith('+++') || ln.startsWith('---') || ln.startsWith('@@')) return `<span class="diff-hunk">${esc}</span>`;
      if (ln.startsWith('+')) return `<span class="diff-add">${esc}</span>`;
      if (ln.startsWith('-')) return `<span class="diff-del">${esc}</span>`;
      return esc + '\n';
    }).join('');
  }

  function renderDiffDetail(data) {
    const body = $('wsBody');
    body.innerHTML = '';
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px';
    bar.innerHTML = `<button id="backFromDiff" class="pill-btn">⬅ 返回</button><button id="askReviewBtn" class="pill-btn" style="background:#fff;color:#0d0d0d">让助手审阅此改动</button>`;
    body.appendChild(bar);

    const viewer = document.createElement('div');
    viewer.className = 'diff-viewer';
    viewer.innerHTML = formatDiffHtml(data.diff || '');
    body.appendChild(viewer);

    $('backFromDiff').onclick = renderWsInspector;
    $('askReviewBtn').onclick = () => {
      $('wsModal').classList.remove('show');
      msgInput.value = `请帮我审阅 \`${data.path}\` 的最新代码改动是否有潜在问题：`;
      msgInput.dispatchEvent(new Event('input'));
      msgInput.focus();
    };
  }

  function renderFilePreview(data) {
    const body = $('wsBody');
    body.innerHTML = '';
    if (!data.ok) {
      body.innerHTML = `<div style="color:var(--danger);padding:18px">${escapeHtml(data.error || '无法读取文件')}</div>`;
      return;
    }
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px';
    const dlHtml = data.media_id ? `<a class="pill-btn" href="${mediaUrl(data.media_id)}" download="${escapeHtml(data.name || '')}" style="text-decoration:none">下载</a>` : '';
    bar.innerHTML = `<button id="backFromFile" class="pill-btn">⬅ 返回</button><div style="display:flex;gap:6px">${dlHtml}<button id="quoteFileBtn" class="pill-btn" style="background:#fff;color:#0d0d0d">引用到对话</button></div>`;
    body.appendChild(bar);

    if (data.is_image && data.media_id) {
      const img = document.createElement('img');
      img.className = 'screen-frame';
      img.src = mediaUrl(data.media_id);
      img.onclick = () => openLightbox(img.src);
      body.appendChild(img);
    } else {
      const viewer = document.createElement('div');
      viewer.className = 'diff-viewer';
      viewer.textContent = data.is_binary ? '（二进制文件，请点右上角下载查看）' : (data.content || '');
      body.appendChild(viewer);
    }

    $('backFromFile').onclick = renderWsInspector;
    $('quoteFileBtn').onclick = () => {
      $('wsModal').classList.remove('show');
      msgInput.value = (msgInput.value ? msgInput.value + '\n' : '') + `请查看工作区文件 \`${data.path}\`：`;
      msgInput.dispatchEvent(new Event('input'));
      msgInput.focus();
    };
  }

  // ── Desktop Live Screen ──
  function openDesktopModal() {
    $('deskModal').classList.add('show');
    $('deskTs').textContent = '正在抓取电脑画面...';
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'desktop_frame' }));
  }
  function closeDesktopModal() {
    $('deskModal').classList.remove('show');
    if (liveScreenOn) {
      liveScreenOn = false;
      $('toggleLiveBtn').textContent = '实时跟随';
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'live_screen', enable: false }));
    }
  }
  $('closeDeskBtn').onclick = closeDesktopModal;
  $('refreshDeskBtn').onclick = () => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'desktop_frame' }));
  };
  $('toggleLiveBtn').onclick = () => {
    liveScreenOn = !liveScreenOn;
    $('toggleLiveBtn').textContent = liveScreenOn ? '暂停跟随' : '实时跟随';
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'live_screen', enable: liveScreenOn, interval_ms: 1600 }));
  };
  $('deskImg').onclick = () => openLightbox($('deskImg').src);
  $('lightbox').onclick = () => $('lightbox').classList.remove('show');

  ['deskModal', 'modelModal', 'wsModal', 'wsPickerModal'].forEach((mid) => {
    const el = $(mid);
    el.addEventListener('click', (e) => {
      if (e.target === el) {
        if (mid === 'deskModal') closeDesktopModal();
        else el.classList.remove('show');
      }
    });
  });

  $('modelBtn').onclick = () => $('modelModal').classList.add('show');
  $('closeModelBtn').onclick = () => $('modelModal').classList.remove('show');
  document.querySelectorAll('.model-opt').forEach((opt) => {
    opt.onclick = () => {
      $('modelModal').classList.remove('show');
      sendChat('/model ' + opt.dataset.m);
    };
  });

  if (msgInput.value) {
    msgInput.style.height = Math.min(msgInput.scrollHeight, 136) + 'px';
  }
  refreshSendBtnVisual();
  connect();
})();
</script>
</body>
</html>
